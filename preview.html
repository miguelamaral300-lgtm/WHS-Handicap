<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PREVIEW · The Club · WHS Golf</title>
<!-- PWA -->
<meta name="theme-color" content="#060E08">
<meta name="description" content="The Club — WHS handicap rankings, tournaments and contests">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Club">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,600&family=Barlow:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Dark-first luxury palette */
  --forest:#060E08;       /* deepest bg */
  --deep:#0A1A0E;         /* card bg */
  --mid:#0F2418;          /* elevated card */
  --raised:#142C1C;       /* hover state */
  --sage:#2A5038;
  --border:rgba(201,168,76,.12);
  --border2:rgba(201,168,76,.22);
  --gold:#C9A84C;--gold-lt:#E0C870;--gold-dim:#9A7830;
  --gold-faint:rgba(201,168,76,.06);
  --text:#E8E2D0;--text2:#A89E80;--text3:#605848;
  --success:#3A8050;--danger:#9B3030;
  --r:10px;--r2:14px;--r3:18px;
  --sh:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --sh2:0 4px 20px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.35);
}
body{
  font-family:'Barlow','Segoe UI',sans-serif;
  background:var(--forest);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
#app{max-width:820px;margin:0 auto;padding:14px}

/* HEADER */
.hdr{
  background:var(--deep);
  border-radius:var(--r3);
  margin-bottom:16px;
  overflow:hidden;
  position:relative;
  border:0.5px solid var(--border);
}
/* Layered atmospheric background */
.hdr::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% -20%, rgba(201,168,76,.18) 0%, transparent 60%),
    radial-gradient(ellipse at 0% 100%, rgba(26,64,48,.9) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(26,64,48,.9) 0%, transparent 50%),
    repeating-linear-gradient(
      -45deg,
      transparent,transparent 22px,
      rgba(255,255,255,.012) 22px,rgba(255,255,255,.012) 23px
    );
  pointer-events:none;
}
/* Gold top rule */
.hdr::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.5),rgba(201,168,76,.9),rgba(201,168,76,.5),transparent);
}
.hdr-inner{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 24px 24px;
  text-align:center;
}
/* Crest mark above name */
.hdr-crest{
  width:48px;height:48px;
  border:1.5px solid rgba(201,168,76,.35);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,168,76,.07);
  font-size:22px;
  margin-bottom:14px;
  position:relative;
}
.hdr-crest::before{
  content:'';
  position:absolute;inset:-6px;
  border-radius:50%;
  border:0.5px solid rgba(201,168,76,.15);
}
/* Thin gold rules flanking the name */
.hdr-rule{
  display:flex;align-items:center;gap:12px;width:100%;max-width:320px;margin-bottom:6px;
}
.hdr-rule-line{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4))}
.hdr-rule-line.r{background:linear-gradient(270deg,transparent,rgba(201,168,76,.4))}
.hdr-rule-dot{width:3px;height:3px;border-radius:50%;background:rgba(201,168,76,.6);flex-shrink:0}
.club-name{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:30px;font-weight:700;font-style:italic;
  color:var(--gold);
  letter-spacing:1.5px;line-height:1;
}
@media(min-width:480px){.club-name{font-size:36px}}
.club-sub{
  font-family:'Barlow',sans-serif;
  font-size:8.5px;color:rgba(201,168,76,.42);
  letter-spacing:5px;text-transform:uppercase;
  margin-top:8px;
}
/* Top-right status */
.hdr-status{
  position:absolute;top:16px;right:16px;
  display:flex;align-items:center;gap:8px;
  z-index:3;
}
.sync{font-size:9px;padding:3px 9px;border-radius:20px;letter-spacing:.3px;font-weight:600;font-family:'Barlow',sans-serif}
.sync.ok{background:rgba(42,96,64,.3);color:#7aba96;border:0.5px solid rgba(42,96,64,.4)}
.sync.err{background:rgba(139,32,32,.25);color:#cc7777;border:0.5px solid rgba(139,32,32,.35)}
.sync.wait{background:rgba(201,168,76,.15);color:var(--gold);border:0.5px solid rgba(201,168,76,.25)}
/* Keep these for JS that references them */
.hdr-right{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px}
.club-seal{display:none}

/* ── BOTTOM NAV (mobile-first real app style) ── */
#app{padding-bottom:80px}
.nav-wrap{display:none}/* hide old top nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#060E08;
  display:flex;align-items:stretch;
  border-top:0.5px solid rgba(201,168,76,.2);
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.bnt{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 2px 6px;
  background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:8px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  color:rgba(201,168,76,.4);
  gap:4px;transition:all .2s;
  min-height:56px;
}
.bnt.on{color:var(--gold)}
.bnt.on .bnt-icon{filter:drop-shadow(0 0 4px rgba(201,168,76,.4))}
.bnt:hover{color:var(--gold-lt)}
.bnt-icon{font-size:19px;line-height:1}
.bnt-lbl{font-size:8px;letter-spacing:.8px}

/* Desktop: restore top nav, hide bottom */
@media(min-width:640px){
  #app{padding-bottom:20px}
  .bnav{display:none}
  .nav-wrap{display:block;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-wrap::-webkit-scrollbar{display:none}
  .nav{background:var(--ivory);border-radius:var(--r2);display:flex;border:0.5px solid rgba(11,30,18,.09);box-shadow:var(--sh);min-width:max-content;width:100%}
  .nt{flex:1;background:none;border:none;border-bottom:2.5px solid transparent;padding:13px 14px 11px;font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .2s;white-space:nowrap}
  .nt.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.04)}
  .nt:hover:not(.on){color:var(--text2);background:rgba(11,30,18,.03)}
}

/* BACK NAV */
.back-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back-btn{background:none;border:none;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-family:'Barlow',inherit;display:flex;align-items:center;gap:6px;padding:8px 0;transition:color .15s}
.back-btn:hover{color:var(--gold)}
.breadcrumb{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--text2)}

/* SECTION HEADERS */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:0.5px solid var(--border)}
.sec-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:600;font-style:italic;color:var(--gold-lt);letter-spacing:.2px}
/* Section intro bands — unique per tab */
.sec-band{
  border-radius:var(--r2) var(--r2) 0 0;
  padding:14px 18px;
  margin-bottom:0;
  display:flex;align-items:center;gap:12px;
}
.sec-band.rankings{background:linear-gradient(90deg,rgba(201,168,76,.08),transparent)}
.sec-band.purse{background:linear-gradient(90deg,rgba(42,128,70,.1),transparent)}
.sec-band.winners{background:linear-gradient(90deg,rgba(201,168,76,.12),transparent)}
.sec-band.contests{background:linear-gradient(90deg,rgba(60,100,180,.1),transparent)}
.sec-band.upcoming{background:linear-gradient(90deg,rgba(80,140,200,.08),transparent)}
.sec-band-icon{font-size:20px;opacity:.7}
.sec-band-text{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--text3);letter-spacing:.3px}
.divider{height:0.5px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),rgba(201,168,76,.6),rgba(201,168,76,.4),transparent);margin:18px 0}

/* RANK ROWS — member card style */
.rank-row{
  display:flex;align-items:center;gap:16px;
  padding:0;
  background:var(--deep);
  border-radius:var(--r2);
  margin-bottom:10px;
  cursor:pointer;
  box-shadow:var(--sh);
  border:0.5px solid var(--border);
  overflow:hidden;
  transition:all .25s;
  position:relative;
}
.rank-row.p1{
  background:linear-gradient(110deg,#162C1E,#0D2B1F);
  border-color:var(--border2);
  box-shadow:0 2px 12px rgba(201,168,76,.08),var(--sh);
}
.rank-row:active{transform:scale(.99)}
@media(hover:hover){.rank-row:hover{box-shadow:var(--sh2);transform:translateY(-2px);background:var(--raised)}}
.trn-row:hover{box-shadow:var(--sh2);transform:translateY(-1px);background:var(--raised)}
/* Gold left accent only on top 3 */
.rank-row.p1::before,.rank-row.p2::before,.rank-row.p3::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
}
.rank-row.p1::before{background:linear-gradient(180deg,#E0C870,#C9A84C,#9A7830)}
.rank-row.p2::before{background:linear-gradient(180deg,#D0D8D4,#B8C0BC,#90A0A0)}
.rank-row.p3::before{background:linear-gradient(180deg,#E0A888,#C0785A,#9A5838)}
/* Medal block */
.rank-medal-wrap{
  width:56px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 0 18px 8px;
  gap:4px;
}
.rank-medal{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;font-weight:700;
}
.medal-1{background:linear-gradient(135deg,#E8D060,#C9A84C);color:var(--deep)}
.medal-2{background:linear-gradient(135deg,#D8E0DC,#B8C8C4);color:#1A2A20}
.medal-3{background:linear-gradient(135deg,#E0A888,#C07858);color:#1A0808}
.medal-n{background:var(--parchment);color:var(--text3)}
.rank-pos{font-family:'Barlow',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:2px}
/* Name + meta */
.rank-info{flex:1;min-width:0;padding:16px 4px}
.rank-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.1}
.rank-sub{font-family:'Barlow',sans-serif;font-size:10px;color:var(--text3);letter-spacing:.3px}
/* HCP number — large, right side */
.rank-hi{
  flex-shrink:0;
  text-align:center;
  padding:18px 16px;
  background:rgba(0,0,0,.2);
  border-left:0.5px solid var(--border);
  min-width:72px;
}
.hi-label{
  font-family:'Barlow',sans-serif;
  font-size:7px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:4px;font-weight:700;
}
.hi-val{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:34px;font-weight:700;
  color:var(--gold);line-height:1;
}
.hi-na{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--text3)}
.rank-chev{
  font-size:18px;color:rgba(201,168,76,.35);
  padding-right:12px;flex-shrink:0;
}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.scard{border-radius:var(--r);padding:14px;border:0.5px solid rgba(11,30,18,.08)}
.scard.normal{background:var(--mid)}
.scard.hero{background:linear-gradient(135deg,#1A3C28,#0D2B1F);border:0.5px solid var(--border2)}
.s-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:600}
.scard.normal .s-lbl{color:var(--text3);font-family:'Barlow',sans-serif}
.scard.hero .s-lbl{color:rgba(201,168,76,.55)}
.s-val{font-family:'Playfair Display',serif;font-weight:600}
.scard.normal .s-val{font-size:22px;color:var(--gold-lt)}
.scard.hero .s-val{font-size:34px;color:var(--gold);line-height:1}
@media(max-width:520px){
  .stats{grid-template-columns:1fr 1fr 1fr}
  .scard.hero{grid-column:span 3;display:flex;align-items:center;gap:16px;padding:16px 18px}
  .scard.hero .s-lbl{margin-bottom:0;flex-shrink:0}
  .scard.hero .s-val{font-size:40px}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr 1fr}
  .scard.hero{grid-column:span 2}
}

/* CONTENT CARD */
.ccard{background:var(--deep);border-radius:var(--r2);border:0.5px solid var(--border);box-shadow:var(--sh);padding:0 18px}

/* SCORE TABLE */
.sthead{display:grid;grid-template-columns:1fr 54px 52px 60px 56px 28px;gap:6px;padding:11px 0 9px;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);border-bottom:0.5px solid var(--border)}
.srow{display:grid;grid-template-columns:1fr 54px 52px 60px 56px 28px;gap:6px;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--border);font-size:13px;cursor:pointer;transition:background .15s}
.srow:last-child{border-bottom:none}
.srow:hover{background:rgba(201,168,76,.04);margin:0 -18px;padding:11px 18px}
/* Mobile: hide tee + type columns, keep course/score/diff/delete */
@media(max-width:500px){
  .sthead{grid-template-columns:1fr 48px 52px 28px}
  .srow{grid-template-columns:1fr 48px 52px 28px}
  .sthead span:nth-child(2),.sthead span:nth-child(5),
  .srow>span:nth-child(2),.srow>span:nth-child(5){display:none}
}

/* INFO EXPAND */
.icard{background:rgba(0,0,0,.2);border:0.5px solid rgba(201,168,76,.15);border-radius:var(--r);padding:14px 16px;margin:2px 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ic-full{grid-column:span 3;padding-bottom:10px;border-bottom:0.5px solid rgba(11,30,18,.08);margin-bottom:6px}
.ie-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--sage);margin-bottom:4px;font-weight:700}
.ie-val{font-size:15px;font-weight:500;color:var(--deep);word-break:break-word}
.ie-lbl{color:rgba(201,168,76,.55)}.ie-val{color:var(--gold-lt)}

/* TOURNAMENT ROWS */
.trn-row{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--deep);border-radius:var(--r2);margin-bottom:9px;cursor:pointer;box-shadow:var(--sh);border:0.5px solid var(--border);transition:all .2s}
.trn-row:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.trn-icon{width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.trn-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:600;font-style:italic;color:var(--text);margin-bottom:3px}
.trn-meta{font-size:12px;color:var(--text3)}
.trn-win{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:2px}

/* WINNER BOX */
.win-box{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(201,168,76,.04));border:0.5px solid rgba(201,168,76,.3);border-radius:var(--r2);margin-top:14px;box-shadow:0 4px 24px rgba(201,168,76,.08)}
.win-lbl{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--gold-dim);font-weight:700;margin-bottom:4px}
.win-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;font-style:italic;color:var(--gold-lt)}
@media(prefers-color-scheme:dark){.win-name{color:var(--gold-lt)}}

/* TOURNAMENT SCOREBOARD */
.tscore{display:grid;grid-template-columns:1fr 72px 60px;gap:8px;align-items:center;padding:12px 0;border-bottom:0.5px solid rgba(11,30,18,.07);font-size:14px}
.tscore:last-child{border-bottom:none}
@media(max-width:400px){.tscore{grid-template-columns:1fr 60px 56px;gap:6px}}
.tscore-val{text-align:center;font-family:'Playfair Display',serif;font-size:17px;font-weight:600}
.under{color:var(--success);font-weight:700}
.over{color:var(--danger)}
.even{color:var(--text3)}
.counting-diff{color:var(--gold)!important;font-weight:700}

/* PILLS */
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.4px}
.p9{background:rgba(201,168,76,.15);color:var(--gold-dim)}
.p18{background:rgba(42,80,58,.25);color:#7AB890}
.pwon{background:var(--gold);color:var(--deep)}
.prun{background:rgba(255,255,255,.07);color:var(--text3)}
.pupcoming{background:rgba(26,58,106,.12);color:#1A3A6A}

/* TROPHY */
.trophy-stage{
  text-align:center;padding:32px 20px 36px;
  background:linear-gradient(180deg,rgba(201,168,76,.08) 0%,rgba(0,0,0,0) 60%);
  border-radius:var(--r2);
  border:0.5px solid var(--border);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.trophy-stage::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 20%,rgba(201,168,76,.1) 0%,transparent 65%);
  pointer-events:none;
}
.trophy-eyebrow{font-size:9px;letter-spacing:5px;text-transform:uppercase;color:var(--text3);margin-bottom:20px}
.trophy-champ{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;font-style:italic;color:var(--gold);margin-top:18px;letter-spacing:.8px;text-shadow:0 0 30px rgba(201,168,76,.3)}
.trophy-event{font-size:12px;color:var(--text3);letter-spacing:1px;margin-top:5px}
/* Image-based trophy with dynamic engraving overlay on the nameplate */
.trophy-image-wrap{
  position:relative;
  width:100%;
  max-width:280px;
  margin:0 auto;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.7));
  container-type:inline-size;
  animation:trophyEnter 700ms cubic-bezier(.2,.7,.2,1) both;
}
@keyframes trophyEnter{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.trophy-image{width:100%;display:block}
.trophy-engraving{
  position:absolute;
  left:50%;
  top:86.9%;
  transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond','Times New Roman',Georgia,serif;
  font-style:italic;
  font-weight:600;
  font-size:5.2cqw;
  color:#1f2b2b;
  letter-spacing:0.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0.5px 0 rgba(255,255,255,.35);
  max-width:38%;
  text-align:center;
}

/* HONOURS TABLE */
.honour-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:0.5px solid var(--border)}
.honour-row:last-child{border-bottom:none}
.honour-pos{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--mid);border:0.5px solid var(--border)}
.honour-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:2px}
.honour-event{font-size:12px;color:var(--text3)}
.honour-score{font-family:'Playfair Display',serif;font-size:16px;font-weight:600}

/* COURSE TABLE */
.crow{display:grid;grid-template-columns:1fr 62px 68px 60px 36px;gap:8px;align-items:center;padding:11px 0;border-bottom:0.5px solid rgba(11,30,18,.06);font-size:13px}
.crow:last-child{border-bottom:none}
@media(max-width:480px){
  .crow{grid-template-columns:1fr 56px 36px}
  .crow span:nth-child(3),.crow span:nth-child(4){display:none}
}
.info-btn{background:none;border:1px solid rgba(11,30,18,.14);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--text3);flex-shrink:0;transition:all .15s}
.info-btn:hover,.info-btn.active{background:var(--deep);color:var(--gold);border-color:var(--deep)}

/* PURSE */
.purse-total{
  background:linear-gradient(135deg,#0A2018,#0D2B1F);
  border:0.5px solid rgba(42,128,70,.3);
  border-radius:var(--r2);padding:28px;text-align:center;margin-bottom:16px;
  box-shadow:0 4px 24px rgba(42,128,70,.08);
}
.purse-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.5);margin-bottom:6px}
.purse-amt{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:700;font-style:italic;color:var(--gold);line-height:1}
.purse-row{display:grid;grid-template-columns:auto 1fr 90px 80px;gap:12px;align-items:center;padding:14px 0;border-bottom:0.5px solid rgba(11,30,18,.06);font-size:13px}
.purse-row:last-child{border-bottom:none}
@media(max-width:480px){.purse-row{grid-template-columns:auto 1fr 72px}}
.purse-bar-wrap{height:6px;background:rgba(11,30,18,.08);border-radius:3px;overflow:hidden}
.purse-bar{height:100%;background:linear-gradient(90deg,#3A8050,#5AB870);border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.purse-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;font-style:italic}
.purse-earned{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#5AB870;text-align:right}
.purse-wins{font-size:11px;color:var(--text3);text-align:right}

/* CONTESTS */
.contest-tab{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.ctab{background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:20px;padding:8px 18px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:var(--text3);white-space:nowrap;transition:all .2s;flex-shrink:0}
.ctab.on{background:linear-gradient(135deg,#1A3C28,#0F2418);color:var(--gold);border-color:var(--border2)}
.contest-row{display:grid;grid-template-columns:1fr 100px 28px;gap:10px;align-items:center;padding:13px 0;border-bottom:0.5px solid rgba(11,30,18,.06);font-size:13px}
.contest-row:last-child{border-bottom:none}
.contest-course{font-weight:500;font-size:13px}
.contest-winner{font-family:'Playfair Display',serif;font-size:13px;color:var(--gold);text-align:right}
.contest-meta{font-size:11px;color:var(--text3);margin-top:2px}
.stat-leader{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--gold)}
.stat-count{font-size:11px;color:var(--text3);margin-top:2px}

/* UPCOMING */
.upcoming-row{display:flex;align-items:flex-start;gap:14px;padding:16px 14px;background:var(--deep);border-radius:var(--r2);margin-bottom:10px;box-shadow:var(--sh);border:0.5px solid var(--border);border-left:3px solid var(--gold)}
.date-block{flex-shrink:0;width:52px;text-align:center;background:var(--deep);border-radius:var(--r);padding:8px 6px}
.date-day{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.date-mon{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(201,168,76,.6);margin-top:2px}
.date-yr{font-size:9px;color:rgba(201,168,76,.4);margin-top:1px}
.upcoming-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:600;font-style:italic;color:var(--text);margin-bottom:4px}
.upcoming-meta{font-size:12px;color:var(--text3);margin-bottom:8px}
.upcoming-players{display:flex;flex-wrap:wrap;gap:5px}
.player-tag{font-size:10px;padding:3px 10px;background:rgba(42,96,60,.2);border-radius:12px;color:#7AB890;font-weight:500;border:0.5px solid rgba(42,96,60,.3)}
.countdown{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:12px;background:rgba(201,168,76,.15);color:var(--gold);border:0.5px solid rgba(201,168,76,.25)}

/* INPUTS */
select,input,textarea{font-family:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);background:rgba(0,0,0,.25);color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.18);background:rgba(0,0,0,.35)}
textarea{resize:vertical;min-height:70px}

/* BUTTONS */
.btn-p{
  background:var(--deep);color:var(--gold);
  border:none;border-radius:var(--r);
  padding:11px 22px;
  font-family:'Barlow',inherit;
  font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;overflow:hidden;
}
.btn-p::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(201,168,76,.06),transparent,rgba(201,168,76,.06));
  pointer-events:none;
}
.btn-p:hover{background:var(--mid)}
.btn-p:active{transform:scale(.98)}
.btn-s{
  background:none;
  border:1px solid rgba(11,30,18,.16);
  border-radius:var(--r);
  padding:11px 20px;
  font-family:'Barlow',inherit;
  font-size:11px;font-weight:500;
  cursor:pointer;color:var(--text2);
  transition:all .15s;
}
.btn-s:hover{background:var(--parchment);border-color:rgba(11,30,18,.28)}
.btn-ic{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 5px;border-radius:4px}
.btn-ic:hover{color:#c00;background:rgba(220,0,0,.1)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(11,30,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:100;overflow-y:auto}
.mo{background:#0D1E14;border-radius:var(--r3) var(--r3) 0 0;border:0.5px solid var(--border2);border-bottom:none;padding:28px 24px 40px;width:100%;max-width:480px;box-shadow:0 -12px 60px rgba(0,0,0,.7);max-height:92vh;overflow-y:auto}
@media(min-width:540px){
  .ov{align-items:flex-start;padding:32px 14px}
  .mo{border-radius:var(--r3);border-bottom:0.5px solid var(--border2);max-height:none}
}
.mo-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:700;font-style:italic;color:var(--gold-lt);margin-bottom:22px;letter-spacing:.2px}
/* mo-title always gold-lt on dark bg */
.fr{margin-bottom:16px}
.fl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);margin-bottom:6px}
.tp-row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:0.5px solid rgba(11,30,18,.07);font-size:13px}
.tp-row:last-child{border-bottom:none}

/* EMPTY + WARN */
.pending-warn{padding:12px 16px;background:rgba(155,48,48,.12);border:0.5px solid rgba(155,48,48,.3);border-radius:var(--r);font-size:13px;color:#E07070;margin-bottom:16px;font-weight:500}
.empty-state{
  text-align:center;padding:56px 28px;
  background:var(--deep);border-radius:var(--r2);
  border:0.5px solid var(--border);
  box-shadow:var(--sh);
}
.empty-icon{font-size:44px;margin-bottom:18px;opacity:.45;display:block}
.empty-title{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;
  font-size:20px;color:var(--text2);margin-bottom:8px;
}
.empty-sub{
  font-family:'Barlow',sans-serif;
  font-size:12px;color:var(--text3);
  letter-spacing:.3px;line-height:1.6;
}
/* Decorative gold divider in empty state */
.empty-state::before{
  content:'— ⛳ —';
  display:block;
  font-size:12px;
  letter-spacing:4px;
  color:rgba(201,168,76,.3);
  margin-bottom:20px;
}

/* ── HEADER EXPORT BUTTON ──────────────────────────────────────────────── */
.hdr-iconbtn{
  background:rgba(201,168,76,.07);
  border:0.5px solid rgba(201,168,76,.22);
  color:var(--gold);
  font-family:inherit;
  font-size:11px;font-weight:600;
  letter-spacing:.4px;
  padding:3px 9px 3px 7px;
  border-radius:20px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:all .15s ease;
  line-height:1;
}
.hdr-iconbtn:hover{
  background:rgba(201,168,76,.15);
  border-color:rgba(201,168,76,.42);
  color:var(--gold-lt);
}
.hdr-iconbtn svg{width:11px;height:11px;display:block}

/* ── PASSPHRASE GATE ───────────────────────────────────────────────────── */
.gate{
  position:fixed;inset:0;z-index:9999;
  background:var(--forest);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:gateFade .4s ease both;
}
.gate::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 10%, rgba(201,168,76,.10) 0%, transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(26,64,48,.55) 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(26,64,48,.55) 0%, transparent 55%);
}
.gate-card{
  position:relative;
  width:100%;max-width:380px;
  background:var(--deep);
  border:0.5px solid var(--border2);
  border-radius:var(--r3);
  padding:36px 28px 28px;
  text-align:center;
  box-shadow:var(--sh2);
  animation:gateRise .5s cubic-bezier(.2,.8,.25,1) .1s both;
}
.gate-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r3) var(--r3) 0 0;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.5),rgba(201,168,76,.9),rgba(201,168,76,.5),transparent);
}
.gate-crest{
  width:54px;height:54px;
  border:1.5px solid rgba(201,168,76,.4);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,168,76,.08);
  font-size:24px;
  margin:0 auto 18px;
  position:relative;
}
.gate-crest::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:0.5px solid rgba(201,168,76,.18);
}
.gate-rule{display:flex;align-items:center;gap:12px;width:100%;max-width:240px;margin:0 auto 8px}
.gate-rule-line{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4))}
.gate-rule-line.r{background:linear-gradient(270deg,transparent,rgba(201,168,76,.4))}
.gate-rule-dot{width:3px;height:3px;border-radius:50%;background:rgba(201,168,76,.6)}
.gate-name{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:30px;font-weight:700;font-style:italic;
  color:var(--gold);letter-spacing:1.5px;line-height:1;
}
.gate-sub{
  font-family:'Barlow',sans-serif;
  font-size:9px;color:rgba(201,168,76,.5);
  letter-spacing:5px;text-transform:uppercase;
  margin-top:10px;margin-bottom:26px;
}
.gate-lbl{
  font-family:'Barlow',sans-serif;
  font-size:9.5px;font-weight:600;
  color:var(--text3);letter-spacing:1.6px;text-transform:uppercase;
  text-align:left;margin-bottom:8px;
}
.gate-input{
  width:100%;
  background:var(--mid);
  border:0.5px solid var(--border2);
  border-radius:var(--r);
  padding:13px 14px;
  font-family:'Barlow',sans-serif;
  font-size:15px;
  color:var(--text);
  letter-spacing:.5px;
  outline:none;
  transition:border-color .15s, background .15s;
}
.gate-input:focus{border-color:var(--gold);background:var(--raised)}
.gate-input::placeholder{color:var(--text3);letter-spacing:.3px}
.gate-err{
  display:none;
  margin-top:10px;
  font-family:'Barlow',sans-serif;font-size:11px;
  color:#cc7777;letter-spacing:.3px;
  text-align:left;
}
.gate-btn{
  width:100%;margin-top:16px;
  background:linear-gradient(180deg,var(--gold),var(--gold-dim));
  border:none;
  color:var(--forest);
  font-family:'Barlow',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  padding:14px;
  border-radius:var(--r);
  cursor:pointer;
  transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;
}
.gate-btn:hover{filter:brightness(1.08);box-shadow:0 4px 18px rgba(201,168,76,.25)}
.gate-btn:active{transform:translateY(1px)}
.gate-foot{
  margin-top:22px;
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:11px;color:var(--text3);
  letter-spacing:.4px;
}
@keyframes gateFade{from{opacity:0}to{opacity:1}}
@keyframes gateRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── LIFETIME STATS GRID (per-player detail) ──────────────────────────── */
.lifestats{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(min-width:480px){.lifestats{grid-template-columns:repeat(4,1fr)}}
.ls-card{
  background:var(--deep);
  border:0.5px solid var(--border);
  border-radius:var(--r2);
  padding:14px 14px 12px;
  position:relative;
  overflow:hidden;
}
.ls-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.35),transparent);
}
.ls-icon{
  font-size:14px;
  color:var(--gold-dim);
  margin-bottom:4px;
  letter-spacing:1px;
}
.ls-lbl{
  font-size:9px;font-weight:700;
  color:var(--text3);
  text-transform:uppercase;letter-spacing:1.6px;
  margin-bottom:6px;
}
.ls-val{
  font-family:'Playfair Display',Georgia,serif;
  font-size:24px;font-weight:600;
  color:var(--gold-lt);
  line-height:1;
  margin-bottom:4px;
}
.ls-sub{
  font-size:10px;color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'Barlow',sans-serif;
}
.ls-empty .ls-val{color:var(--text3);font-size:18px}

/* Section subhead (smaller than .sec-title, used as a label between blocks) */
.subsec{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:16px;color:var(--text2);
  letter-spacing:.3px;
  margin:20px 0 10px;
}

/* ── HANDICAP TREND CHART ─────────────────────────────────────────────── */
.trend-card{
  background:var(--deep);
  border:0.5px solid var(--border);
  border-radius:var(--r2);
  padding:14px 14px 8px;
  margin-top:14px;
  position:relative;
  overflow:hidden;
}
.trend-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.35),transparent);
}
.trend-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:8px;
}
.trend-title{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:16px;color:var(--gold-lt);
  letter-spacing:.3px;
}
.trend-sub{
  font-size:10px;color:var(--text3);
  letter-spacing:.5px;font-family:'Barlow',sans-serif;
}

/* ── INLINE EDIT BUTTON (inside the expanded score card) ──────────────── */
.icard-actions{
  grid-column:span 3;
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:6px;padding-top:10px;
  border-top:0.5px solid rgba(201,168,76,.1);
}
.btn-edit{
  background:rgba(201,168,76,.08);
  border:0.5px solid rgba(201,168,76,.28);
  color:var(--gold);
  font-family:'Barlow',inherit;
  font-size:10px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;
  padding:7px 14px;
  border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s ease;
}
.btn-edit:hover{
  background:rgba(201,168,76,.18);
  border-color:rgba(201,168,76,.5);
  color:var(--gold-lt);
}
.btn-edit svg{width:11px;height:11px}
.btn-edit.danger{
  background:rgba(155,48,48,.1);
  border-color:rgba(155,48,48,.3);
  color:#cc7777;
}
.btn-edit.danger:hover{
  background:rgba(155,48,48,.2);
  border-color:rgba(155,48,48,.5);
  color:#e88888;
}

/* ═══ PLAY (live scoring) ═══ */
.lp-wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.lp-msg{text-align:center;border:0.5px solid rgba(127,176,105,.4);border-radius:14px;background:rgba(127,176,105,.08);padding:13px;margin-bottom:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#7FB069}
.lp-sec{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:18px 4px 9px;display:flex;align-items:center;gap:10px}
.lp-sec::after{content:"";flex:1;height:0.5px;background:var(--line)}
.lp-chips{display:flex;flex-wrap:wrap;gap:7px}
.lp-chip{border:0.5px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text2);font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer}
.lp-chip.on{background:rgba(201,168,76,.16);border-color:var(--gold);color:var(--gold-lt,#E6CE80)}
.lp-prow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0.5px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 13px;margin-bottom:7px;cursor:pointer}
.lp-prow.on{border-color:var(--gold);background:rgba(201,168,76,.09)}
.lp-prow .nm{font-weight:600;font-size:14px;color:var(--text)}
.lp-prow .hi{font-size:11px;color:var(--text3);margin-top:1px}
.lp-prow .ch{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:19px;color:var(--gold)}
.lp-prow .ch small{font-size:9px;color:var(--text3);font-weight:500;letter-spacing:1px;display:block;text-align:right}
.lp-prow.dis{opacity:.4;cursor:default}
.lp-start{width:100%;border:none;border-radius:13px;padding:15px;font-family:'Barlow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px;background:linear-gradient(135deg,var(--gold),#B08F3C);color:#1A1306;margin-top:16px;cursor:pointer}
.lp-start:disabled{opacity:.4}
.lp-strip{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.lp-strip::-webkit-scrollbar{display:none}
.lp-pip{flex:0 0 auto;width:26px;height:30px;border-radius:7px;border:0.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;color:var(--text3);cursor:pointer}
.lp-pip.done{color:var(--text);background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.3)}
.lp-pip.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);color:var(--gold-lt,#E6CE80)}
.lp-hole{background:linear-gradient(170deg,#13301E,#0C2114);border:0.5px solid var(--line);border-radius:20px;padding:16px 15px 17px;box-shadow:0 16px 44px -32px #000}
.lp-hh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.lp-hh .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:46px;line-height:.85;color:var(--gold)}
.lp-hh .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);font-weight:600}
.lp-hh .meta{text-align:right;font-size:12px;color:var(--text2);line-height:1.5}
.lp-hh .meta b{color:var(--gold-lt,#E6CE80)}
.lp-pl{margin-top:12px;border:0.5px solid var(--line);border-radius:12px;background:rgba(0,0,0,.16);padding:10px 11px}
.lp-pl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.lp-pl .pnm{font-weight:600;font-size:13.5px;color:var(--text)}
.lp-pl .pstk{font-size:10px;color:var(--text3)}
.lp-pl .pnet{font-size:11px;color:var(--text2)}
.lp-pl .pnet b{color:var(--gold-lt,#E6CE80);font-family:'Barlow Semi Condensed',sans-serif;font-size:14px}
.lp-schips{display:flex;gap:5px}
.lp-sc{flex:1;max-width:44px;aspect-ratio:1/1.02;border-radius:10px;border:0.5px solid var(--line);background:#071009;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:17px;color:var(--text2);cursor:pointer}
.lp-sc:active{transform:scale(.92)}
.lp-sc.sel{background:var(--gold);border-color:var(--gold);color:#10210F}
.lp-sc.sel.b1{border-radius:50%}
.lp-sc.sel.b2{border-radius:50%;box-shadow:0 0 0 2px #071009,0 0 0 3.5px var(--gold)}
.lp-sc.sel.o1{border-radius:4px}
.lp-sc.sel.o2{border-radius:4px;box-shadow:0 0 0 2px #071009,0 0 0 3.5px #CF6B5C}
.lp-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:12px}
.lp-nbtn{border:0.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text2);font-family:'Barlow',sans-serif;font-weight:600;font-size:14px;padding:13px;cursor:pointer}
.lp-nbtn.next{background:linear-gradient(135deg,var(--gold),#B0883A);color:#16100A;border:none;font-weight:700}
.lp-nbtn:disabled{opacity:.35}
.lp-lb{border:0.5px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px}
.lp-lb .row{display:grid;grid-template-columns:26px 1fr 46px 52px 44px 40px;align-items:center;padding:9px 11px;border-bottom:0.5px solid rgba(201,168,76,.08);background:var(--card,rgba(255,255,255,.03));font-size:13px}
.lp-lb .row:last-child{border-bottom:none}
.lp-lb .row.hd{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:600;background:rgba(0,0,0,.25)}
.lp-lb .pos{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;color:var(--gold)}
.lp-lb .nm2{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-lb .num{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;text-align:right;color:var(--text)}
.lp-lb .num.u{color:#CF6B5C}.lp-lb .num.d{color:#7FB069}
.lp-lb .num small{font-size:9px;color:var(--text3);font-weight:500}
.lp-fin{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.lp-fbtn{border-radius:12px;padding:13px;font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;cursor:pointer}
.lp-fbtn.post{border:none;background:linear-gradient(135deg,#7FB069,#5E8B4C);color:#0C1A0C}
.lp-fbtn.post:disabled{opacity:.4}
.lp-fbtn.disc{background:transparent;color:#C77;border:0.5px solid rgba(204,119,119,.3)}

/* simplified pickers + course editing */
.pk{display:flex;flex-wrap:wrap;gap:7px}
.pk-chip{display:flex;align-items:center;gap:7px;border:1px solid rgba(11,30,18,.18);border-radius:22px;background:#fff;
  padding:8px 14px 8px 10px;font-family:'Barlow',sans-serif;font-weight:600;font-size:13.5px;color:#2A3A2C;cursor:pointer}
.pk-chip:active{transform:scale(.97)}
.pk-chip.on{border-color:var(--gold,#C9A84C);box-shadow:0 0 0 1.5px var(--gold,#C9A84C);background:#FFFDF5}
.pk-sw{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.22);flex-shrink:0}
.pk-chip .pk-sub{font-weight:500;font-size:11px;color:#7A857C}
.pk-hint{font-size:11.5px;color:#7A857C;margin-top:7px;line-height:1.5}
.cbtns{display:flex;gap:5px;justify-content:center}
.mini-btn{border:1px solid rgba(11,30,18,.18);background:#fff;border-radius:8px;width:27px;height:27px;font-size:12px;cursor:pointer;color:#42513f}
.mini-btn.del{color:#B4564B;border-color:rgba(180,86,75,.3)}
.wpos{display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:9.5px;
  color:var(--gold);opacity:.85;margin-right:6px;min-width:12px;text-align:right;vertical-align:1px;letter-spacing:.2px}
.mc-lbl{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:9px 0 6px}
.mc-list{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:0.5px solid rgba(11,30,18,.12);border-radius:var(--r);background:#fff}
.mc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:0.5px solid rgba(11,30,18,.07);padding:12px 13px;cursor:pointer;font-family:'Barlow',sans-serif}
.mc-item:last-child{border-bottom:none}
.mc-item:active{background:rgba(201,168,76,.1)}
.mc-nm{font-weight:600;font-size:14px;color:#22301F;line-height:1.25}
.mc-meta{font-size:10.5px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.mc-none{font-size:12.5px;color:#B4564B;padding:12px 4px;line-height:1.55}
.mc-chosen{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid rgba(201,168,76,.5);background:rgba(201,168,76,.08);border-radius:var(--r);padding:11px 13px}
.mc-change{background:none;border:0.5px solid rgba(11,30,18,.2);border-radius:8px;padding:7px 12px;
  font-family:'Barlow',sans-serif;font-weight:600;font-size:12px;color:var(--text2);cursor:pointer;flex-shrink:0}
/* course tab grouped by club */
.cg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:0.5px solid rgba(11,30,18,.07);padding:13px 4px;cursor:pointer;font-family:'Barlow',sans-serif}
.cg-row:last-child{border-bottom:none}
.cg-nm{font-weight:600;font-size:14.5px;color:#22301F}
.cg-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.cg-caret{color:var(--gold);font-size:12px;flex-shrink:0}
.cg-detail{background:rgba(13,43,31,.04);border:0.5px solid rgba(13,43,31,.1);border-radius:var(--r);padding:4px 0;margin:2px 0 8px}
.cg-tee{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 12px;font-size:12.5px;border-bottom:0.5px solid rgba(11,30,18,.06)}
.cg-tee:last-child{border-bottom:none}
.cg-tee .t1{display:flex;align-items:center;gap:7px;font-weight:600;color:#22301F}
.cg-tee .t2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;color:var(--text2);white-space:nowrap}
/* ═══ CROWN — player of the month ═══ */
.cr-fair{border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:13px 14px}
.cr-fair-t{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:16px;color:#22301F;margin-bottom:8px}
.cr-fair-b{font-size:12px;color:var(--text2);line-height:1.6;padding:4px 0}
.cr-fair-b b{color:#22301F}
.cr-fair-w{font-size:11.5px;color:#8A6A22;background:rgba(216,162,74,.09);border:0.5px solid rgba(216,162,74,.3);
  border-radius:9px;padding:9px 11px;margin-top:9px;line-height:1.55}
.cr-warn-dot{color:#D8A24A;font-size:9px}
.cr-pcc{border:0.5px solid rgba(127,176,105,.3);background:rgba(127,176,105,.06);border-radius:9px;padding:10px 11px;margin-top:10px}
.cr-pccrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:11.5px;color:var(--text2);padding:4px 0}
.cr-strip{display:flex;align-items:center;gap:10px;border:0.5px solid rgba(201,168,76,.4);
  background:linear-gradient(100deg,rgba(201,168,76,.12),rgba(201,168,76,.03));border-radius:var(--r);
  padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:#22301F;cursor:pointer;line-height:1.45}
.cr-strip-k{font-size:18px;flex-shrink:0}
.cr-strip-go{margin-left:auto;color:var(--gold);font-size:18px;flex-shrink:0}
.cr-target{font-size:11.5px;color:#4E7A3C;background:rgba(127,176,105,.09);border:0.5px solid rgba(127,176,105,.28);
  border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.55}
.cr-h2h{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);border-bottom:0.5px solid rgba(11,30,18,.06)}
.cr-h2h:last-child{border-bottom:none}
.cr-h2h-c{padding:9px 4px;text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--text2)}
.cr-h2h-hd{font-family:'Barlow',sans-serif;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);background:rgba(11,30,18,.04)}
.cr-h2h-nm{text-align:left;font-family:'Barlow',sans-serif;font-size:12px;color:#22301F;font-weight:600}
.cr-h2h-c.win{color:#4E7A3C}.cr-h2h-c.loss{color:#B4564B}.cr-h2h-c.draw{color:var(--text2)}
.cr-h2h-self{color:rgba(11,30,18,.2)}
.bdg-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bdg{display:flex;align-items:center;gap:9px;border:0.5px solid rgba(201,168,76,.28);background:rgba(201,168,76,.06);
  border-radius:11px;padding:10px 11px}
.bdg-i{font-size:19px;flex-shrink:0}
.bdg-t{display:flex;flex-direction:column;min-width:0}
.bdg-t b{font-size:12.5px;color:#22301F;line-height:1.2}
.bdg-n{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.3}
.cr-rstate{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.cr-rstate.awaiting{background:rgba(216,162,74,.16);color:#8A6A22}
.cr-rstate.posted{background:rgba(127,176,105,.18);color:#4E7A3C}
.cr-rstate.outstanding{background:rgba(207,107,92,.16);color:#B4564B}
.cr-rstate.cancelled{background:rgba(11,30,18,.07);color:var(--text3)}
.cr-check{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:13.5px;color:#22301F;border-bottom:0.5px solid rgba(11,30,18,.06)}
.cr-check:last-of-type{border-bottom:none}
.cr-check input{width:18px;height:18px}
.cr-entrybox{border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.cr-erow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:0.5px solid rgba(11,30,18,.06)}
.cr-erow:last-child{border-bottom:none}
.cr-enm{font-size:13.5px;font-weight:600;color:#22301F}
.cr-etog{border:1px solid rgba(11,30,18,.18);background:#fff;border-radius:20px;padding:6px 14px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:11.5px;color:var(--text3);cursor:pointer;min-width:74px}
.cr-etog.on{background:rgba(201,168,76,.16);border-color:var(--gold);color:#8A6A22}
.cr-etog.fixed{opacity:.75;cursor:default}
.cr-money{border:0.5px solid rgba(201,168,76,.35);background:rgba(201,168,76,.06);border-radius:var(--r);padding:13px 14px;margin-bottom:14px}
.cr-money.trial{border-color:rgba(11,30,18,.15);background:rgba(11,30,18,.03)}
.cr-money-h{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:17px;color:#8A6A22}
.cr-money.trial .cr-money-h{color:var(--text2)}
.cr-money-n{font-size:11.5px;color:var(--text3);line-height:1.55;margin-top:3px}
.cr-owed{margin-top:10px;display:grid;gap:6px}
.cr-owe{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:0.5px solid rgba(11,30,18,.1);border-radius:9px;padding:9px 11px;font-size:12.5px;color:#22301F}
.cr-amt{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.cr-settled{margin-top:10px;font-size:12px;color:#4E7A3C;font-weight:600}
.cr-wrap{max-width:560px;margin:0 auto;padding:2px 0 24px}
.cr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cr-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:25px;color:#22301F;text-align:center}
.cr-sub{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);text-align:center;margin-top:2px}
.cr-nav{background:none;border:0.5px solid rgba(11,30,18,.18);border-radius:9px;width:34px;height:34px;font-size:16px;color:var(--text2);cursor:pointer}
.cr-nav:disabled{opacity:.3}
.cr-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13px}
.cr-btn{border:none;border-radius:10px;padding:9px 14px;font-family:'Barlow',sans-serif;font-weight:700;font-size:12.5px;background:linear-gradient(135deg,var(--gold),#B08F3C);color:#1A1306;cursor:pointer;flex-shrink:0}
.cr-ghost{width:100%;border:0.5px solid rgba(11,30,18,.18);border-radius:12px;background:transparent;color:var(--text2);font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;padding:12px;margin-top:14px;cursor:pointer}
.cr-note{font-size:11px;color:var(--text3);line-height:1.55;margin-top:4px}
.cr-empty{text-align:center;color:var(--text3);font-size:13px;padding:26px 14px;border:0.5px dashed var(--line);border-radius:var(--r);line-height:1.6}
.cr-void{border:0.5px solid rgba(216,162,74,.35);background:rgba(216,162,74,.08);border-radius:var(--r);padding:11px 13px;font-size:12px;color:#8A6A22;line-height:1.55;margin-bottom:12px}
.cr-podium{text-align:center;border:0.5px solid rgba(201,168,76,.45);border-radius:16px;background:linear-gradient(170deg,rgba(201,168,76,.13),rgba(201,168,76,.02));padding:18px 14px;margin-bottom:14px}
.cr-crownicon{font-size:34px;line-height:1}
.cr-winner{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:27px;color:#8A6A22;margin-top:2px}
.cr-score{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:38px;color:var(--gold);line-height:1}
.cr-score span{font-size:15px;color:var(--text3);font-weight:600}
.cr-spoon{font-size:11.5px;color:var(--text2);margin-top:9px;padding-top:9px;border-top:0.5px solid rgba(201,168,76,.25)}
.cr-sec{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:20px 2px 9px}
.cr-table{border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cr-row{display:grid;grid-template-columns:24px 1fr 30px 32px 32px 32px 32px 48px;gap:4px;align-items:center;
  padding:11px 10px;border-bottom:0.5px solid rgba(11,30,18,.06);font-size:12.5px;cursor:pointer}
.cr-row:last-child{border-bottom:none}
.cr-hd{background:rgba(11,30,18,.04);font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);font-weight:700;cursor:default}
.cr-lead{background:rgba(201,168,76,.08)}
.cr-dim{opacity:.62;cursor:default}
.cr-pos{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;color:var(--gold);font-size:15px}
.cr-nm{font-weight:600;color:#22301F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-n{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;text-align:right;color:var(--text2)}
.cr-tot{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;text-align:right;color:#22301F;font-size:15px}
.cr-detail{background:rgba(13,43,31,.04);border-bottom:0.5px solid rgba(11,30,18,.06);padding:4px 10px 10px}
.cr-cat{padding:9px 2px;border-bottom:0.5px solid rgba(11,30,18,.06)}
.cr-cat:last-child{border-bottom:none}
.cr-cat-h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#22301F}
.cr-cat-h span{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;color:var(--gold)}
.cr-cat-b{font-size:10.5px;color:var(--text3);margin-top:2px;line-height:1.5}
.cr-cat-v{font-size:11.5px;color:var(--text2);margin-top:4px}
.cr-how{border:0.5px solid var(--line);border-radius:var(--r);background:var(--panel);padding:13px 14px}
.cr-w{font-size:12.5px;color:var(--text2);line-height:1.6;padding:5px 0}
.cr-w b{display:inline-block;min-width:26px;font-family:'Barlow Semi Condensed',sans-serif;font-size:15px;color:var(--gold)}
/* GPS distances */
.lp-offline{text-align:center;font-size:11px;color:#D8A24A;background:rgba(216,162,74,.09);border:0.5px solid rgba(216,162,74,.3);border-radius:11px;padding:9px;margin-top:11px;line-height:1.5}
.lp-offline b{color:#E6CE80;text-decoration:underline;cursor:pointer}
.gp-link{width:100%;border:none;border-radius:12px;padding:13px;font-family:'Barlow',sans-serif;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,#7FB069,#5E8B4C);color:#08140A;margin-top:11px;cursor:pointer}
.gp-lock{text-align:center;font-size:10.5px;letter-spacing:.5px;color:var(--text3);margin-top:10px;font-weight:600}
.gp-lock.on{color:#7FB069}
.gp-unit{width:100%;border:0.5px solid var(--line);border-radius:11px;background:transparent;color:var(--text3);font-family:'Barlow',sans-serif;font-weight:600;font-size:11.5px;padding:9px;margin-top:9px;cursor:pointer}
.gp-panel{margin-top:13px;border:0.5px solid var(--line);border-radius:16px;background:linear-gradient(170deg,rgba(0,0,0,.28),rgba(0,0,0,.12));padding:15px 14px 14px}
.gp-toggle{width:100%;border:0.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text2);font-family:'Barlow',sans-serif;font-weight:600;font-size:13.5px;padding:12px;margin-top:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gp-toggle.on{border-color:var(--gold);color:#E6CE80;background:rgba(201,168,76,.09)}
.gp-big{text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:74px;line-height:.86;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 34px rgba(201,168,76,.28)}
.gp-big small{font-size:19px;color:var(--text3);letter-spacing:1px;margin-left:4px;font-weight:600}
.gp-cap{text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);font-weight:600;margin-top:2px}
.gp-fb{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.gp-cell{border:0.5px solid var(--line);border-radius:11px;background:rgba(0,0,0,.2);padding:9px;text-align:center}
.gp-cell .v{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:25px;color:var(--text)}
.gp-cell .l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:600;margin-top:1px}
.gp-acc{text-align:center;font-size:10.5px;color:var(--text3);margin-top:11px;line-height:1.5}
.gp-acc b{color:var(--text2)}
.gp-warn{text-align:center;font-size:11.5px;color:var(--bogey,#D8A24A);line-height:1.55;padding:6px 2px}
.gp-cap3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.gp-cbtn{border:0.5px solid var(--line);border-radius:11px;background:#071009;color:var(--text2);font-family:'Barlow',sans-serif;font-weight:600;font-size:12px;padding:11px 4px;cursor:pointer}
.gp-cbtn.set{border-color:#7FB069;color:#7FB069}
.gp-cbtn:active{transform:scale(.95)}
.gp-imp{width:100%;border:none;border-radius:12px;padding:13px;font-family:'Barlow',sans-serif;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,var(--gold),#B08F3C);color:#1A1306;margin-top:11px;cursor:pointer}
.gp-imp:disabled{opacity:.5}
.gp-note{font-size:10.5px;color:var(--text3);text-align:center;margin-top:9px;line-height:1.5}
/* PLAY v2: lobby, wizard, history, summary */
.lp-stepper{display:flex;align-items:center;gap:9px}
.st-btn{flex:0 0 58px;height:54px;border-radius:13px;border:0.5px solid var(--line);background:#071009;color:var(--text2);font-size:27px;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;line-height:1}

<!-- ── PASSPHRASE GATE (client-side; share the password with members) ── -->
<script>
(function(){
  // CHANGE THIS to your club's chosen password.
  // It's a casual gate so the URL isn't publicly editable —
  // not bank-grade security, but enough to keep strangers out.
  var CLUB_PASS = 'fairway';
  var AUTH_KEY  = 'whs_club_auth_v1';

  function isAuthed(){
    try { return localStorage.getItem(AUTH_KEY) === CLUB_PASS; }
    catch(e){ return false; }
  }

  window.LOGOUT_CLUB = function(){
    try { localStorage.removeItem(AUTH_KEY); } catch(e){}
    location.reload();
  };

  window.__SUBMIT_GATE = function(){
    var inp = document.getElementById('gate-pass');
    var err = document.getElementById('gate-err');
    if(!inp) return;
    if(inp.value === CLUB_PASS){
      try { localStorage.setItem(AUTH_KEY, CLUB_PASS); } catch(e){}
      var gate = document.getElementById('gate');
      if(gate){ gate.style.transition='opacity .25s'; gate.style.opacity='0'; setTimeout(function(){ gate.remove(); }, 260); }
    } else {
      err.textContent = 'Incorrect password. Ask a member.';
      err.style.display = 'block';
      inp.value=''; inp.focus();
    }
  };

  if(isAuthed()) return; // already in — let Firebase script run as usual

  var html =
    '<div id="gate" class="gate">'+
      '<div class="gate-card">'+
        '<div class="gate-crest">⛳</div>'+
        '<div class="gate-rule"><div class="gate-rule-line"></div><div class="gate-rule-dot"></div><div class="gate-rule-line r"></div></div>'+
        '<div class="gate-name">The Club</div>'+
        '<div class="gate-sub">Members &nbsp;·&nbsp; Private Access</div>'+
        '<div class="gate-lbl">Password</div>'+
        '<input id="gate-pass" class="gate-input" type="password" autocomplete="current-password" placeholder="Enter passphrase" />'+
        '<div id="gate-err" class="gate-err"></div>'+
        '<button class="gate-btn" type="button" onclick="__SUBMIT_GATE()">Enter</button>'+
        '<div class="gate-foot">By invitation only</div>'+
      '</div>'+
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function(){
    var inp = document.getElementById('gate-pass');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); window.__SUBMIT_GATE(); }
      });
    }
  }, 50);
})();
</script>
