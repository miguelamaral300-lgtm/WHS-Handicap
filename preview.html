function renderPlayerDetail(p){
  const s=calcHI(p.scores,S.courses),L=lk();
  const ls=calcPlayerStats(p,S.courses);
  let h=`<div class="back-nav">
    <button class="back-btn" onclick="CP()">&#8592; Rankings</button>
    <span style="color:rgba(11,30,18,.2);font-size:12px">/</span>
    <span class="breadcrumb">${p.name}</span>
  </div>
  <div class="stats">
    <div class="scard hero"><div class="s-lbl">Handicap Index</div>
      <div class="s-val" style="font-size:${s.hi!==null?34:20}px">${s.hi!==null?s.hi.toFixed(1):'N/A'}</div>
    </div>
    <div class="scard normal"><div class="s-lbl">Rounds</div><div class="s-val">${s.count||0}</div></div>
    <div class="scard normal"><div class="s-lbl">Best N</div><div class="s-val">${s.n||'—'}</div></div>
    <div class="scard normal"><div class="s-lbl">Avg Diff</div><div class="s-val" style="font-size:18px">${s.avg!=null?s.avg.toFixed(2):'—'}</div></div>
  </div>`;

  // ── LIFETIME STATS ──
  if(ls){
    const bestG = ls.bestGross
      ? `<div class="ls-val">${ls.bestGross.score}</div><div class="ls-sub">${ls.bestGross.course}</div>`
      : `<div class="ls-val ls-empty">—</div><div class="ls-sub">No 18-hole rounds yet</div>`;
    const bestD = ls.bestDiff!==null && ls.bestDiff
      ? `<div class="ls-val">${ls.bestDiff.d>=0?'+':''}${ls.bestDiff.d.toFixed(1)}</div><div class="ls-sub">${ls.bestDiff.course}</div>`
      : `<div class="ls-val ls-empty">—</div><div class="ls-sub">No data yet</div>`;
    const lowHI = ls.lowestHI!==null
      ? `<div class="ls-val">${ls.lowestHI.toFixed(1)}</div><div class="ls-sub">Round ${ls.lowestHIAt}</div>`
      : `<div class="ls-val ls-empty">—</div><div class="ls-sub">Need 3+ rounds</div>`;
    const fav = ls.favCourse
      ? `<div class="ls-val" style="font-size:14px;font-family:'Cormorant Garamond',serif;font-style:italic;line-height:1.15;display:flex;align-items:center;min-height:24px">${ls.favCourse}</div><div class="ls-sub">${ls.favCount} round${ls.favCount!==1?'s':''}${(ls.topCourses||[]).length>1?` · then ${ls.topCourses.slice(1).map(x=>`${x.name.split(' ').slice(0,2).join(' ')} ${x.n}`).join(', ')}`:''}</div>`
      : `<div class="ls-val ls-empty">—</div><div class="ls-sub">—</div>`;

    h+=`<div class="subsec">Lifetime</div>
    <div class="lifestats">
      <div class="ls-card"><div class="ls-lbl">Best Round</div>${bestG}</div>
      <div class="ls-card"><div class="ls-lbl">Best Differential</div>${bestD}</div>
      <div class="ls-card"><div class="ls-lbl">Lowest HI Ever</div>${lowHI}</div>
      <div class="ls-card"><div class="ls-lbl">Most Played</div>${fav}</div>
    </div>`;

    // Handicap trend chart
    h+=renderHITrendChart(p,S.courses);
  }

  // ── badges: non-competitive, so everyone collects at their own level ──
  {
    const badges=potmBadges(p,S.courses);
    if(badges.length){
      h+=`<div class="divider"></div>
      <div class="sec-head"><span class="sec-title">Badges</span><span style="font-size:11px;color:var(--text3)">${badges.length}</span></div>
      <div class="bdg-wrap">${badges.map(b=>`<div class="bdg"><span class="bdg-i">${b.icon}</span><span class="bdg-t"><b>${b.name}</b><span class="bdg-n">${b.note}</span></span></div>`).join('')}</div>`;
    }
  }

  h+=`<div class="divider"></div>
  <div class="sec-head">
    <span class="sec-title">Round History</span>
    <button class="btn-p" onclick="OM('score')">+ Add Round</button>
  </div>
  <p style="font-size:11px;color:var(--text3);margin-bottom:12px">🟡 Gold = counting toward Handicap Index &nbsp;·&nbsp; Tap row to expand &middot; Edit from there</p>`;
  if(!p.scores||!p.scores.length)return h+`<div class="empty-state"><div class="empty-icon">⛳</div><div class="empty-title">No rounds recorded</div><div class="empty-sub">Add your first round above</div></div>`;
  const hiRes=calcHI(p.scores,S.courses);
  const issues=hiRes.issues||{};
  // Position in the counting window: 1 = your most recent round, 20 = the one that falls
  // out next. Rounds outside the window carry no number.
  // Derived from PLAYING order, not from the engine's internal list. The engine holds
  // nine-hole rounds back during the warm-up and appends them at the 54-hole crossover,
  // so its ordering can differ from the order you actually played — which made these
  // numbers appear shuffled. Numbering the window by playing order is monotonic by
  // construction: 1 at the top of the list, counting down without gaps.
  const winPos={};
  if(hiRes.window&&hiRes.window.length){
    const inWindow=new Set(hiRes.window.map(x=>x.i));
    const played=orderScores(p.scores).map(x=>x.i).filter(i=>inWindow.has(i)); // oldest → newest
    played.forEach((i,k)=>{ winPos[i]=played.length-k; });
  }
  const issueIdx=Object.keys(issues).map(Number);
  if(issueIdx.length)h+=`<div style="border:0.5px solid rgba(207,107,92,.4);background:rgba(207,107,92,.08);border-radius:var(--r);padding:12px 13px;margin-bottom:10px;font-size:12px;color:#B4564B;line-height:1.6">
    <b>${issueIdx.length} round${issueIdx.length>1?'s':''} excluded from your handicap.</b> Each one cannot be correct as recorded, so it is being left out rather than distorting your index. Tap it to fix the hole configuration.
    <div style="margin-top:8px;display:grid;gap:5px">${issueIdx.map(i=>{const x=p.scores[i];return `<div style="font-size:11.5px;padding:6px 9px;background:rgba(255,255,255,.5);border-radius:6px"><b>${x.course} · ${x.tee} · ${x.holes||'?'} · ${x.score}</b><br>${issues[i]}</div>`;}).join('')}</div>
  </div>`;
  if(p.scores.length&&!scoresAllDated(p.scores)){
    const nd=p.scores.filter(x=>!x.date||isNaN(new Date(x.date).getTime())).length;
    h+=`<div style="border:0.5px solid rgba(216,162,74,.32);background:rgba(216,162,74,.07);border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:12px;color:#8A6A22;line-height:1.55"><b>${nd} round${nd>1?'s':''} without a date.</b> Rounds are being sequenced in the order they were entered. Add the missing dates and the handicap will follow true playing order instead.</div>`;
  }
  h+=`<div class="ccard"><div class="sthead"><span>Course</span><span style="text-align:center">Date</span><span style="text-align:center">Score</span><span style="text-align:center">Diff</span><span></span></div>`;
  // Show the rounds in the SAME order the handicap engine uses — by date when every round
  // has one, otherwise by entry order. Listing by entry order while calculating by date
  // made a fully-dated record look shuffled and put the window numbers out of sequence.
  [...orderScores(p.scores)].reverse().forEach(entry=>{
    const s2=entry.s, oi=entry.i, c=findCourse(S.courses,s2);
    const d=c?calcDiff(s2.score,c.rating,c.slope):null;
    const cfg=cfgOf(s2,c),is9=isNineCfg(cfg),isO=OPEN_SCORE&&OPEN_SCORE.pid===p.id&&OPEN_SCORE.idx===oi;
    const isCounting=s.countingIdx&&s.countingIdx.has(oi);
    const m=s.meta&&s.meta[oi];   // breakdown metadata from calcHI
    const rowStyle = isCounting
      ? 'background:rgba(201,168,76,.07);border-left:2.5px solid var(--gold);margin:0 -18px;padding:10px 18px 10px 14px;'
      : '';
    const textColor = isCounting ? 'var(--gold-lt)' : 'var(--text)';
    h+=`<div class="srow" onclick="TSC('${p.id}',${oi})" style="${rowStyle}">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isCounting?600:500};color:${textColor}">${winPos[oi]?`<span class="wpos">${winPos[oi]}</span>`:''}${s2.course}${cfg!=='18'?` <span class="pill p9" style="font-size:9px;padding:1px 5px">${cfg==='F9'?'Front 9':cfg==='L9'?'Back 9':cfg==='L9x2'?'Back 9 ×2':cfg==='F9x2'?'Front 9 ×2':cfg}</span>`:''}${(!c||issues[oi])?` <span class="pill" style="font-size:9px;padding:1px 5px;background:rgba(207,107,92,.18);color:#B4564B">${issues[oi]?'excluded':'not counting'}</span>`:''}</span>
      <span style="text-align:center;font-size:11px;color:var(--text3)">${s2.date?fmtDate(s2.date):'—'}</span>
      <span style="text-align:center;font-weight:600;color:${textColor}">${s2.score}</span>
      <span style="text-align:center" class="${d!==null&&d<0?'under':''}${d!==null&&isCounting?' counting-diff':''}">${d!==null?d.toFixed(1):'—'}</span>
      <button class="btn-ic" onclick="event.stopPropagation();DS('${p.id}',${oi})">&times;</button>
    </div>`;
    if(isO){
      // Build the math-breakdown panel for 9-hole rounds. Three distinct states under official WHS:
      //   1. Pending conversion — 9-hole round during initial 54 holes, stored unconverted
      //   2. Retroactively converted at 54-hole crossover — initial HI just established
      //   3. Post-warmup — normal 2024 expected-score formula
      let breakdown='';
      if(is9 && m && m.is9){
        if(m.pendingConversion){
          // State 1: stored during warm-up, no conversion yet
          breakdown=`<div style="grid-column:span 3;padding:10px 12px;background:rgba(160,160,160,.05);border-radius:6px;border:0.5px solid rgba(160,160,160,.22);font-size:11px;line-height:1.6">
            <div style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--text2);font-size:13px;margin-bottom:6px;letter-spacing:.3px">Initial Handicap Index period — pending conversion</div>
            <div style="font-size:10px;color:var(--text3)">Per official WHS guidance: the expected-score conversion does not apply until 54 holes have been posted. This 9-hole round will be converted to an 18-hole Score Differential when your initial Handicap Index is established.</div>
            <div style="margin-top:8px;display:flex;justify-content:space-between;color:var(--text2)"><span>9-hole differential (stored)</span><span style="color:var(--text);font-weight:600;font-variant-numeric:tabular-nums">${m.ninehDiff.toFixed(1)}</span></div>
          </div>`;
        } else {
          // States 2 & 3: both show the expected-score math, with a different header label
          const headerLabel = m.retroactivelyConverted
            ? 'Initial Handicap Index established — retroactively converted'
            : 'WHS 9-hole → 18-hole conversion';
          breakdown=`<div style="grid-column:span 3;padding:10px 12px;background:rgba(201,168,76,.08);border-radius:6px;border:0.5px solid rgba(201,168,76,.22);font-size:11px;line-height:1.6">
            <div style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:13px;margin-bottom:6px;letter-spacing:.3px">${headerLabel}</div>
            <div style="display:flex;justify-content:space-between;color:var(--text2)"><span>9-hole differential (this round)</span><span style="color:var(--text);font-weight:600;font-variant-numeric:tabular-nums">${m.ninehDiff.toFixed(1)}</span></div>
            <div style="display:flex;justify-content:space-between;color:var(--text2)"><span>Expected differential for missing 9<br><span style="font-size:10px;color:var(--text3)">(HI ${m.hiAtTime.toFixed(1)} ${m.retroactivelyConverted?'at conversion':'at the time'} &times; 0.52 + 1.2)</span></span><span style="color:var(--text);font-weight:600;font-variant-numeric:tabular-nums">${m.expected.toFixed(1)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:0.5px solid rgba(201,168,76,.25);color:${isCounting?'var(--gold)':'var(--text)'};font-weight:700"><span>18-hole Score Differential${isCounting?' ✦ counting':''}</span><span style="font-variant-numeric:tabular-nums">${m.eighteenhDiff.toFixed(1)}</span></div>
          </div>`;
        }
      }else if(isCounting){
        breakdown=`<div style="grid-column:span 3;padding:8px 10px;background:rgba(201,168,76,.1);border-radius:6px;border:0.5px solid rgba(201,168,76,.25)"><div style="font-size:11px;color:var(--gold);font-weight:600">✦ Counting toward Handicap Index</div></div>`;
      }
      h+=`<div class="icard">
      <div class="ic-full" style="grid-column:span 3"><div class="ie-lbl">Course</div><div class="ie-val" style="font-size:13px">${s2.course}</div></div>
      <div><div class="ie-lbl">Rating</div><div class="ie-val">${c?c.rating.toFixed(2):'—'}</div></div>
      <div><div class="ie-lbl">Slope</div><div class="ie-val">${c?c.slope:'—'}</div></div>
      <div><div class="ie-lbl">Holes</div><div class="ie-val">${is9?'9-hole':'18-hole'}</div></div>
      ${s2.date?`<div style="grid-column:span 3"><div class="ie-lbl">Date played</div><div class="ie-val" style="font-size:13px">${fmtDate(s2.date)}</div></div>`:''}
      ${breakdown}
      <div class="icard-actions">
        <button class="btn-edit" onclick="event.stopPropagation();ES('${p.id}',${oi})">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11.5L3 8.5L9 2.5L11.5 5L5.5 11L2 11.5Z"/><path d="M8 3.5L10.5 6"/></svg>
          Edit
        </button>
        <button class="btn-edit danger" onclick="event.stopPropagation();DS('${p.id}',${oi})">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h8M5.5 4V2.5h3V4M4.5 4l.5 7h4l.5-7"/></svg>
          Delete
        </button>
      </div>
    </div>`;
    }
  });
  return h+`</div>`;
}

// ── UPCOMING TOURNAMENTS ──────────────────────────────────────────────────────
function renderUpcoming(){
  const now=new Date();
  const upcoming=[...S.upcoming]
    .filter(t=>new Date(t.date)>=now||(daysUntil(t.date)||0)>=-1)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let h=`<div class="sec-head">
    <span class="sec-title">Upcoming Events</span>
    <button class="btn-p" onclick="OM('upcoming')">+ Add Event</button>
  </div>`;
  if(!upcoming.length)return h+`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No upcoming events</div><div class="empty-sub">Plan your next round or tournament above</div></div>`;
  return h+upcoming.map(t=>{
    const days=daysUntil(t.date);
    const[y,m,day]=t.date.split('-');
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monStr=months[parseInt(m)-1];
    let countLabel='',countStyle='';
    if(days===0){countLabel='Today!';countStyle='background:rgba(42,96,64,.15);color:var(--success)';}
    else if(days===1){countLabel='Tomorrow';countStyle='background:rgba(201,168,76,.12);color:var(--gold-dim)';}
    else if(days>0&&days<=7){countLabel=`${days} days`;countStyle='background:rgba(201,168,76,.12);color:var(--gold-dim)';}
    else if(days>0){countLabel=`${days} days`;countStyle='background:rgba(11,30,18,.06);color:var(--text3)';}
    return`<div class="upcoming-row">
      <div class="date-block">
        <div class="date-day">${day}</div>
        <div class="date-mon">${monStr}</div>
        <div class="date-yr">${y}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <div class="upcoming-name">${t.name}</div>
          ${countLabel?`<span class="countdown" style="${countStyle}">${countLabel}</span>`:''}
        </div>

// ── PURSE LEADERBOARD ─────────────────────────────────────────────────────────
function renderPurse(){
  const purseData=calcPurse();
  const totalEarned=purseData.reduce((s,p)=>s+p.totalEarned,0);
  const maxEarned=Math.max(...purseData.map(p=>p.totalEarned),1);
  let h=`<div class="sec-head">
    <span class="sec-title">Prize Money</span>
    <button class="btn-p" onclick="SET_PURSE(null)">+ Record Winnings</button>
  </div>`;
  if(totalEarned===0){
    h+=`<div style="background:rgba(201,168,76,.06);border:0.5px solid rgba(201,168,76,.2);border-radius:var(--r2);padding:16px;margin-bottom:16px;font-size:13px;color:var(--text2);line-height:1.6">
      💡 Record each player's exact winnings per tournament — different bets, different amounts. Tap <strong style="color:var(--gold-lt)">+ Record Winnings</strong> above.
    </div>`;
  }
  h+=`<div class="purse-total">
    <div class="purse-lbl">Total Prize Money Distributed</div>
    <div class="purse-amt">${fmtCurrency(totalEarned)}</div>
  </div>
  <div class="ccard">
    <div style="display:grid;grid-template-columns:auto 1fr 90px;gap:12px;padding:11px 0 9px;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);border-bottom:0.5px solid rgba(11,30,18,.1)">
      <span></span><span>Member</span><span style="text-align:right">Earned</span>
    </div>`;
  const maxAbsPnl=Math.max(...purseData.map(p=>Math.abs(p.pnl)),1);
  purseData.forEach((p,i)=>{
    const meds=['medal-1','medal-2','medal-3'];
    const isProfit=p.pnl>=0;

    h+=`<div style="display:grid;grid-template-columns:auto 1fr 70px 70px 28px;gap:10px;align-items:center;padding:14px 0;border-bottom:0.5px solid var(--border)">
      <div class="rank-medal ${i<3?meds[i]:'medal-n'}" style="width:28px;height:28px;font-size:12px;flex-shrink:0">${i+1}</div>
      <div style="min-width:0">
        <div class="purse-name">${p.name}</div>
        <div style="margin-top:5px">
          <div style="height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${isProfit?'linear-gradient(90deg,#3A8050,#5AB870)':'linear-gradient(90deg,#7A2020,#B04040)'};border-radius:3px;transition:width .8s"></div>
          </div>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:4px">${p.wins} win${p.wins!==1?'s':''} · ${p.events} event${p.events!==1?'s':''} · in: ${p.totalBuyIn>0?fmtCurrency(p.totalBuyIn):'—'}</div>
      </div>
      <div style="text-align:right;font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--text2)">${p.totalEarned>0?fmtCurrency(p.totalEarned):'—'}</div>
      <div style="text-align:right;font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:${isProfit?'#5AB870':'#E07070'}">${p.pnl!==0?(isProfit?'+':'')+fmtCurrency(p.pnl):'—'}</div>
      <div style="text-align:right">
        <div class="purse-earned">${p.total>0?fmtCurrency(p.totalEarned):'—'}</div>
        ${p.history.length>0?`<div style="font-size:10px;color:var(--text3);margin-top:3px">${p.history.length} event${p.history.length>1?'s':''}</div>`:''}
      </div>
      <button onclick="TOGGLE_PURSE_DETAIL('${p.name.replace(/ /g,'_')}')" style="background:none;border:none;cursor:pointer;color:rgba(201,168,76,.4);font-size:18px;padding:0 2px;flex-shrink:0">›</button>
    </div>
    ${PURSE_OPEN===p.name.replace(/ /g,'_')?`

      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(201,168,76,.4);margin-bottom:10px">Earnings Breakdown</div>
      ${p.history.length?p.history.map(h=>`
        <div style="display:grid;grid-template-columns:1fr 60px 60px 64px;gap:8px;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)">

        </div>`).join(''):`<div style="font-size:12px;color:var(--text3);padding:8px 0">No data recorded yet</div>`}
      <div style="display:grid;grid-template-columns:1fr 60px 60px 64px;gap:8px;padding:10px 0 0;margin-top:4px;border-top:0.5px solid var(--border)">
        <span style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">Total</span>
        <span style="text-align:right;font-size:12px;color:var(--text3)">${p.totalBuyIn>0?fmtCurrency(p.totalBuyIn):'—'}</span>
        <span style="text-align:right;font-size:12px;color:var(--text2)">${p.totalEarned>0?fmtCurrency(p.totalEarned):'—'}</span>
        <span style="text-align:right;font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:${p.pnl>=0?'#5AB870':'#E07070'}">${p.pnl!==0?(p.pnl>0?'+':'')+fmtCurrency(p.pnl):'—'}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 60px 60px 64px;gap:8px;padding:4px 0 0;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);text-align:right">
        <span></span><span>Buy-in</span><span>Won</span><span>P&amp;L</span>

  return h+`</div>`;
}

// ── CONTESTS ──────────────────────────────────────────────────────────────────
function renderContests(){
  const CTABS=[['drive','Longest Drive'],['pin','Closest to Pin'],['birdie','Most Birdies'],['eagle','Eagles']];
  const filtered=S.contests.filter(c=>c.type===CTAB).sort((a,b)=>b.date.localeCompare(a.date));

  // Tally wins per player per contest type
  const wins={};
  S.players.forEach(p=>{wins[p.id]={name:p.name,drive:0,pin:0,birdie:0,eagle:0};});
  S.contests.forEach(c=>{if(wins[c.winnerId])wins[c.winnerId][c.type]=(wins[c.winnerId][c.type]||0)+1;});

  const leader=Object.values(wins).sort((a,b)=>(b[CTAB]||0)-(a[CTAB]||0))[0];
  const leaderWins=leader?leader[CTAB]||0:0;

  let h=`<div class="sec-head">
    <span class="sec-title">Contests &amp; Stats</span>
    <button class="btn-p" onclick="OM('contest')">+ Add Result</button>
  </div>`;

  // Tab selector
  h+=`<div class="contest-tab">${CTABS.map(([v,l])=>`<button class="ctab${CTAB===v?' on':''}" onclick="SC('${v}')"">${l}</button>`).join('')}</div>`;

  // Leader stat box
  if(leaderWins>0){
    h+=`<div style="background:var(--deep);border-radius:var(--r2);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px">
      <div style="font-size:28px">${CTAB==='drive'?'💥':CTAB==='pin'?'🎯':CTAB==='birdie'?'🐦':'🦅'}</div>
      <div style="flex:1">
        <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.5);margin-bottom:4px">All-time leader</div>
        <div class="stat-leader">${leader.name}</div>
        <div class="stat-count">${leaderWins} win${leaderWins!==1?'s':''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${Object.values(wins).sort((a,b)=>(b[CTAB]||0)-(a[CTAB]||0)).slice(0,3).map((p,i)=>
          p[CTAB]>0?`<div style="font-size:11px;color:rgba(201,168,76,.${i===0?8:i===1?6:4})">${p.name} (${p[CTAB]})</div>`:''
        ).join('')}
      </div>
    </div>`;
  }

  h+=`<div class="sec-head" style="margin-top:4px">
    <span style="font-size:14px;font-weight:500;color:var(--text2)">${CTABS.find(c=>c[0]===CTAB)?.[1]} Results</span>
  </div>`;

  if(!filtered.length)return h+`<div class="empty-state" style="padding:30px 20px"><div class="empty-icon">${CTAB==='drive'?'💥':CTAB==='pin'?'🎯':CTAB==='birdie'?'🐦':'🦅'}</div><div class="empty-title">No ${CTABS.find(c=>c[0]===CTAB)?.[1]} results yet</div><div class="empty-sub">Add your first result above</div></div>`;

  h+=`<div class="ccard">
    <div style="display:grid;grid-template-columns:1fr 110px 28px;gap:8px;padding:10px 0 9px;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);border-bottom:0.5px solid rgba(11,30,18,.1)">
      <span>Course / Event</span><span style="text-align:right">Winner</span><span></span>
    </div>`;
  filtered.forEach(c=>{
    const w=S.players.find(p=>p.id===c.winnerId);
    h+=`<div class="contest-row">
      <div>
        <div class="contest-course">${c.course||c.event||'—'}</div>
        <div class="contest-meta">${fmtDate(c.date)}${c.detail?' &middot; '+c.detail:''}</div>
      </div>
      <div class="contest-winner">${w?w.name:'—'}</div>
      <button class="btn-ic" onclick="DC('${c.id}')">&times;</button>
    </div>`;
  });
  return h+`</div>`;
}

// ── WINNERS TROPHY ────────────────────────────────────────────────────────────
function renderWinners(){
  const sorted=[...S.tournaments].filter(t=>t.winnerId).sort((a,b)=>b.date.localeCompare(a.date));
  const latest=sorted[0],lw=latest?S.players.find(p=>p.id===latest.winnerId):null;
  const wins={};sorted.forEach(t=>{wins[t.winnerId]=(wins[t.winnerId]||0)+1;});
  let h=`<div class="trophy-stage">
    <div class="trophy-eyebrow">Roll of Honour</div>
    ${trophySVG(lw?.name||'',latest?.name||'',latest?.date||'')}
    <div class="trophy-champ">${lw?lw.name:'Awaiting First Champion'}</div>
    ${latest?`<div class="trophy-event">${latest.name}&ensp;&middot;&ensp;${fmtDate(latest.date)}</div>`:''}
  </div>
  <div class="divider"></div>`;
  if(!sorted.length)return h+`<div class="empty-state" style="padding-top:8px"><div class="empty-sub">Add a tournament to begin the Roll of Honour</div></div>`;
  h+=`<div class="sec-head"><span class="sec-title">All Champions</span></div><div class="ccard">`;
  sorted.forEach((t,i)=>{
    const w=S.players.find(p=>p.id===t.winnerId);
    const entry=t.entries.find(e=>e.playerId===t.winnerId);
    const sc=entry?.score??null;
    h+=`<div class="honour-row">
      <div class="honour-pos" style="${i===0?'background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.3)':''}">${i===0?'🥇':'🏆'}</div>
      <div style="flex:1;min-width:0">
        <div class="honour-name">${w?.name||'Unknown'}</div>
        <div class="honour-event">${t.name}${t.prize?` &middot; ${fmtCurrency(t.prize)}`:''}</div>
      </div>
      <div style="text-align:right">
        ${sc!==null?`<div class="honour-score ${scoreClass(sc)}">${fmtScore(sc)}</div>`:''}
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${fmtDate(t.date)}</div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  const leaders=Object.entries(wins).map(([id,c])=>({p:S.players.find(x=>x.id===id),c})).filter(x=>x.p).sort((a,b)=>b.c-a.c);
  if(leaders.length>1){
    h+=`<div class="sec-head" style="margin-top:18px"><span class="sec-title">Championship Wins</span></div><div class="ccard">`;
    leaders.forEach(({p,c})=>{
      h+=`<div class="honour-row">
        <div style="flex:1;font-family:'Playfair Display',serif;font-size:15px;font-weight:500">${p.name}</div>
        <div style="display:flex;gap:3px">${'🏆'.repeat(Math.min(c,5))}${c>5?`<span style="font-size:12px;color:var(--text3)"> +${c-5}</span>`:''}</div>
        <div style="font-size:16px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;min-width:22px;text-align:right;margin-left:10px">${c}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

// ── COURSES ───────────────────────────────────────────────────────────────────
function renderCourses(){
  const q=(document.getElementById('csr')?.value||'').trim().toLowerCase();
  const played=playedNameSet();
  // One entry per CLUB, not per tee — a course with six tees and three configurations was
  // filling ten rows and drowning the list. Tap a club to see what it offers.
  const groups={};
  S.courses.forEach((c,i)=>{ (groups[c.name]=groups[c.name]||[]).push({...c,i}); });
  let names=Object.keys(groups).sort((a,b)=>a.localeCompare(b));
  const totalClubs=names.length;
  if(q) names=names.filter(n=>n.toLowerCase().includes(q));
  else if(!COURSES_ALL) names=names.filter(n=>played.has(n));

  const CFGL={'18':'18 holes','F9':'Front 9','L9':'Back 9','F9x2':'Front 9 ×2','L9x2':'Back 9 ×2'};
  const TEEC={White:'#F2EFE4',Yellow:'#E8C544',Blue:'#5C97B8',Red:'#C4544B',Green:'#6E9E5C',Purple:'#8E6BA8',Black:'#2A2A2A',Gold:'#C9A84C',Orange:'#D98A3C'};

  let h=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
    <input type="search" placeholder="Search all ${totalClubs} courses…" id="csr" value="${(document.getElementById('csr')?.value||'').replace(/"/g,'&quot;')}" oninput="CSR_TYPE()" style="flex:1">
    <button class="btn-p" onclick="OM('course')">+ Add</button>
  </div>
  ${!q?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <button class="lp-chip${!COURSES_ALL?' on':''}" onclick="COURSES_SCOPE(0)">Courses you play</button>
    <button class="lp-chip${COURSES_ALL?' on':''}" onclick="COURSES_SCOPE(1)">All ${totalClubs}</button>
  </div>`:`<div style="font-size:11px;color:var(--text3);margin-bottom:10px">${names.length} club${names.length===1?'':'s'} matching</div>`}
  <div class="ccard" id="cglist">`;

  names.slice(0,120).forEach(n=>{
    const rows=groups[n];
    const tees=[...new Set(rows.map(r=>r.tee))];
    const isFpg=rows.some(r=>r.src==='fpg');
    const isVer=rows.some(r=>r.src==='verified');
    const open=OPEN_COURSE===n;
    const nRounds=(S.players||[]).reduce((a,p)=>a+(p.scores||[]).filter(x=>x.course===n).length,0);
    h+=`<button class="cg-row" onclick="TC('${n.replace(/'/g,"\\'")}')">
      <span><span class="cg-nm">${n}</span>
        <span class="cg-sub">${tees.length} tee${tees.length>1?'s':''} · ${rows.length} rated setup${rows.length>1?'s':''}${nRounds?` · ${nRounds} round${nRounds>1?'s':''} played`:''}${isFpg?' · FPG official':isVer?' · verified':''}</span></span>
      <span class="cg-caret">${open?'▲':'▼'}</span></button>`;
    if(open){
      h+=`<div class="cg-detail">`;
      tees.forEach(te=>{
        rows.filter(r=>r.tee===te)
          .sort((a,b)=>['18','F9','L9','F9x2','L9x2'].indexOf(a.holes||'18')-['18','F9','L9','F9x2','L9x2'].indexOf(b.holes||'18'))
          .forEach(r=>{
            const cfg=r.holes||(r.rating<40?'F9':'18');
            h+=`<div class="cg-tee">
              <span class="t1"><span class="pk-sw" style="background:${TEEC[te]||'#BBB'}"></span>${te}<span style="font-weight:500;color:var(--text3);font-size:11px">${CFGL[cfg]||cfg}</span></span>
              <span class="t2">${r.rating}</span><span class="t2">${r.slope}</span>
              <span style="display:flex;gap:4px"><button class="mini-btn" title="Edit" onclick="event.stopPropagation();EC(${r.i})">✎</button><button class="mini-btn del" title="Delete" onclick="event.stopPropagation();XC(${r.i})">✕</button></span>
            </div>`;
          });
      });
      h+=`<div style="font-size:10px;color:var(--text3);padding:8px 12px 4px;letter-spacing:.5px">RATING · SLOPE shown for each setup</div></div>`;
    }
  });
  if(!names.length)h+=`<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">${q?`No club matches “${document.getElementById('csr')?.value||''}”`:'No courses played yet'}</div>`;
  if(names.length>120)h+=`<div style="padding:12px;text-align:center;color:var(--text3);font-size:11.5px">Showing 120 of ${names.length} — keep typing to narrow it.</div>`;
  return h+`</div>`;
}

// ── BADGES ───────────────────────────────────────────────────────────────────
// Deliberately non-competitive: everyone collects at their own level, so unfairness is
// structurally impossible. This is the part that engages whoever will not win the crown.
function potmBadges(p,courses){
  const out=[];
  const sc=(p.scores||[]).filter(x=>{const c=findCourse(courses,x);return c&&!roundIssue(x,c);});
  if(!sc.length)return out;
  const full=sc.filter(x=>{const c=findCourse(courses,x);return !isNineCfg(cfgOf(x,c));});
  const grosses=full.map(x=>x.score);
  const best=grosses.length?Math.min(...grosses):null;
  [[100,'Under 100'],[90,'Under 90'],[80,'Under 80'],[75,'Under 75']].forEach(([n,lbl])=>{
    if(best!=null&&best<n)out.push({icon:'⛳',name:lbl,note:`Best full round ${best}`});
  });
  // beat your handicap
  const hi=calcHI(p.scores||[],courses);
  if(hi&&hi.hi!=null){
    let beat=0;
    sc.forEach(x=>{const c=findCourse(courses,x);const d=calcDiff(x.score,c.rating,c.slope);
      const nine=isNineCfg(cfgOf(x,c));
      const v=nine?2*d-hi.hi:d-hi.hi;
      if(v<=0)beat++;});
    if(beat>=1)out.push({icon:'🎯',name:'Played to handicap',note:`${beat} round${beat>1?'s':''} at or inside your index`});
    if(beat>=5)out.push({icon:'🎯',name:'Reliable',note:'Five or more inside your index'});
  }
  // volume
  [[25,'Regular'],[50,'Committed'],[100,'Centurion']].forEach(([n,lbl])=>{
    if(sc.length>=n)out.push({icon:'📋',name:lbl,note:`${sc.length} rounds posted`});
  });
  // breadth
  const clubs=new Set(sc.map(x=>x.course));
  if(clubs.size>=5)out.push({icon:'🧭',name:'Explorer',note:`${clubs.size} different courses`});
  if(clubs.size>=10)out.push({icon:'🧭',name:'Well travelled',note:`${clubs.size} different courses`});
  // crowns and spoons
  const res=(S.potm&&S.potm.results)||{};
  const cr=Object.values(res).filter(x=>x.winnerId===p.id).length;
  const sp=Object.values(res).filter(x=>x.spoonId===p.id).length;
  if(cr)out.push({icon:'👑',name:cr>1?`Crowned ×${cr}`:'Crowned',note:'Player of the Month'});
  if(sp)out.push({icon:'🥄',name:sp>1?`Spooned ×${sp}`:'Spooned',note:'Worn with pride'});
  return out;
}

let REG_TEE=null,REG_HOLES=null;
window.REG_COURSE=()=>{
  REG_TEE=null;REG_HOLES=null;REG_PAINT();
};
window.REG_TEE_PICK=t=>{REG_TEE=t;REG_HOLES=null;REG_PAINT();};
window.REG_HOLES_PICK=g=>{REG_HOLES=g;REG_PAINT();};
window.REG_PAINT=()=>{
  const cn=document.getElementById('regC')?.value||'';
  const tBox=document.getElementById('regT'), hBox=document.getElementById('regH');
  if(!tBox||!hBox)return;
  if(!cn){tBox.innerHTML='<div class="pk-hint">Choose a course first.</div>';hBox.innerHTML='';return;}
  const tees=[...new Set((S.courses||[]).filter(c=>c.name===cn).map(c=>c.tee))];
  if(!REG_TEE||!tees.includes(REG_TEE))REG_TEE=tees[0]||null;
  const COL={White:'#F2EFE4',Yellow:'#E8C544',Blue:'#5C97B8',Red:'#C4544B',Green:'#6E9E5C',Purple:'#8E6BA8',Black:'#2A2A2A',Gold:'#C9A84C',Orange:'#D98A3C'};
  tBox.innerHTML=tees.map(t=>`<button type="button" class="pk-chip${t===REG_TEE?' on':''}" onclick="REG_TEE_PICK('${t}')"><span class="pk-sw" style="background:${COL[t]||'#BBB'}"></span>${t}</button>`).join('');
  const cfgs=[...new Set((S.courses||[]).filter(c=>c.name===cn&&c.tee===REG_TEE).map(c=>c.holes||(c.rating<40?'F9':'18')))];
  if(!REG_HOLES||!cfgs.includes(REG_HOLES))REG_HOLES=cfgs[0]||'18';
  const L={'18':'18 holes','F9':'Front 9','L9':'Back 9','F9x2':'Front 9 twice','L9x2':'Back 9 twice'};
  hBox.innerHTML=cfgs.map(g=>`<button type="button" class="pk-chip${g===REG_HOLES?' on':''}" onclick="REG_HOLES_PICK('${g}')">${L[g]||g}</button>`).join('');
};
window.REG_SAVE=()=>{
  const er=document.getElementById('regErr');
  const fail=m=>{if(er){er.textContent=m;er.style.display='block';}};
  const pids=Array.from(document.querySelectorAll('.regp')).filter(x=>x.checked).map(x=>x.value);
  const cn=document.getElementById('regC')?.value||'';
  const date=document.getElementById('regD')?.value||'';
  if(!pids.length)return fail('Tick at least one player.');
  if(!cn)return fail('Choose a course.');
  if(!REG_TEE)return fail('Choose a tee.');
  if(!date)return fail('Set the date.');
  if(date>new Date().toISOString().slice(0,10))return fail('That date is in the future.');
  if(!(S.courses||[]).some(c=>c.name===cn&&c.tee===REG_TEE&&(c.holes||'18')===REG_HOLES))
    return fail('That combination of tee and holes is not rated for this course.');
  const regs={...potmRegs()};
  pids.forEach(pid=>{
    // don't duplicate an identical declaration
    const dup=Object.values(regs).some(r=>r.pid===pid&&r.date===date&&r.course===cn&&r.tee===REG_TEE&&r.holes===REG_HOLES&&!r.cancelled);

async function gpLoad(){

    GPGEO=d||{};

// Precision capture: hold still while we collect ~10s of fixes and average the best of
// them. This makes a hand-set green point considerably tighter than a single reading —
// and tighter than tracing it off satellite imagery.
window.GP_SET=async(which)=>{
  if(!GPPOS||!LR||GPCAP)return;
  const label=which==='f'?'front':which==='b'?'back':'centre';
  GPCAP={which,fixes:[],started:Date.now()};
  GPMSG=`Hold still — measuring ${label} of hole ${LRHOLE}…`;render();
  for(let i=0;i<20;i++){
    await new Promise(r=>setTimeout(r,500));
    if(!GPCAP)return;
    GPMSG=`Hold still — measuring ${label}… ${Math.min(10,Math.round((Date.now()-GPCAP.started)/1000))}s · ${GPCAP.fixes.length} fixes`;
    render();
    if(Date.now()-GPCAP.started>10000)break;
  }
  const good=GPCAP.fixes.filter(f=>f.acc<=GP_MAXACC);
  GPCAP=null;
  if(good.length<3){GPMSG=`Only ${good.length} usable fix${good.length===1?'':'es'} — signal too weak to record ${label} accurately. Nothing saved.`;render();return;}
  let wsum=0,la=0,lo=0;
  for(const f of good){const w=1/(f.acc*f.acc);wsum+=w;la+=f.lat*w;lo+=f.lon*w;}
  const pt={lat:la/wsum,lon:lo/wsum};
  let sq=0;for(const f of good)sq+=Math.pow(gpDist(pt,f),2);
  const spread=Math.round(Math.sqrt(sq/good.length));
  if(spread>8&&!confirm(`Those ${good.length} readings scattered by about ${spread}m, so this point would be rough.\n\nSave it anyway?`)){GPMSG='Not saved.';render();return;}
  GPGEO=GPGEO||{};
  const k=String(LRHOLE);
  GPGEO[k]={...(GPGEO[k]||{}),[which]:pt,src:'capture'};
  if(GPGEO[k].poly)delete GPGEO[k].poly;   // hand-set points supersede an imported outline
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  gpqPush(geoKey(LR.course),k,GPGEO[k]);
  GPMSG=`Hole ${LRHOLE} ${label} recorded from ${good.length} fixes (±${Math.max(2,spread)}m).`;
  render();
  await gpFlush();
};
// Standing on an unnumbered green: match the player's position to the nearest
// unclaimed OSM outline and bind it to this hole. Exact geometry, one tap, no guessing.
window.GP_LINK=async()=>{
  if(!GPPOS||!LR||!GPGEO||!GPGEO._pool||!GPGEO._pool.length)return;
  let best=null;
  GPGEO._pool.forEach((p,idx)=>{
    let lo=Infinity;
    for(const v of p.poly){const d=gpDist(GPPOS,{lat:v[0],lon:v[1]});if(d<lo)lo=d;}
    if(!best||lo<best.d)best={d:lo,idx,p};
  });
  if(!best)return;
  if(best.d>70){GPMSG=`Nearest unidentified green is ${best.d}m away — walk onto the green you want to record, then tap again.`;render();return;}
  if(!GPPOS.locked&&!confirm(`GPS has not settled yet (${GPPOS.n} fixes, ±${GPPOS.acc}m scatter ${GPPOS.spread}m).\n\nIt is safer to wait a few seconds for "Locked". Record hole ${LRHOLE} anyway?`))return;
  const k=String(LRHOLE);
  GPGEO=GPGEO||{};
  GPGEO[k]={c:best.p.c,poly:best.p.poly,src:'linked'};
  GPGEO._pool=GPGEO._pool.filter((_,i)=>i!==best.idx);
  if(navigator.vibrate)try{navigator.vibrate(14)}catch(e){}
  const left=GPGEO._pool.length;
  GPMSG=`Hole ${LRHOLE} green recorded from its exact outline${left?` · ${left} left to identify`:' · every green now identified ✓'}`;
  render();
  gpqPush(geoKey(LR.course),k,GPGEO[k]);
  gpqPush(geoKey(LR.course),'_pool',GPGEO._pool);
  await gpFlush();
};
window.GP_SYNC=async()=>{ await gpFlush(); GPMSG=GPQ.length?`Still no signal — ${GPQ.length} measurement${GPQ.length>1?'s':''} safe on this phone.`:'All green measurements synced. ✓'; render(); };
window.GP_UNIT=()=>{GPUNIT=GPUNIT==='m'?'y':'m';try{localStorage.setItem('gpUnit',GPUNIT)}catch(e){}render();};
window.GP_IMPORT=async()=>{
  const site=OSM_SITES[LR.course]; if(!site)return;
  GPBUSY=true;GPMSG='Querying OpenStreetMap…';render();
  const sel=site.type==='relation'?`rel(${site.id})`:`way(${site.id})`;
  // Query strictly INSIDE the course boundary, so a neighbouring club's greens
  // can never be pulled in by a loose bounding box.
  const q=`[out:json][timeout:60];
${sel}; map_to_area->.a;
(way["golf"="green"](area.a); way["golf"="hole"](area.a); way["golf"="tee"](area.a););
out geom;`;
  const eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
  let data=null;
  for(const ep of eps){
    const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),20000);
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});
      clearTimeout(to);
      const t=await r.text();
      if(t.trim().startsWith('{')){data=JSON.parse(t);break;}
    }catch(e){clearTimeout(to);}
  }
  if(!data){GPBUSY=false;GPMSG='OpenStreetMap is not responding right now. Nothing was changed — try again later, or tap the greens yourself as you play.';render();return;}

  const els=data.elements||[];
  const refOf=e=>{const t=e.tags||{};const v=t.ref||t.name||t['golf:hole']||t.hole;const n=parseInt(v,10);return isNaN(n)?null:n;};
  const greens=els.filter(e=>e.tags&&e.tags.golf==='green'&&e.geometry&&e.geometry.length>2);
  const lines=els.filter(e=>e.tags&&e.tags.golf==='hole'&&e.geometry&&e.geometry.length>1&&refOf(e)!=null);
  const tees=els.filter(e=>e.tags&&e.tags.golf==='tee'&&e.geometry);
  const cent=geo=>({lat:geo.reduce((s,p)=>s+p.lat,0)/geo.length, lon:geo.reduce((s,p)=>s+p.lon,0)/geo.length});
  const N=site.holes, MATCH_LIMIT=35;

  // Strategy A — greens already carry their hole number (cleanest).
  // Strategy B — match each numbered hole centre-line to the green at its far end.
  const numbered=greens.filter(g=>refOf(g)!=null);
  const picked={}; let method='';
  if(numbered.length){
    method='numbered greens';
    numbered.forEach(g=>{const r=refOf(g); if(r>=1&&r<=N&&!picked[r]) picked[r]={green:g,origin:null,match:0};});
  }
  if(Object.keys(picked).length<N&&lines.length>=N){
    method='numbered hole lines';
    for(const L of lines){
      const ref=refOf(L); if(ref<1||ref>N)continue;
      const gm=L.geometry, ends=[gm[0],gm[gm.length-1]];
      let best=null;
      for(const e of ends) for(const g of greens){
        const d=gpDist(e,cent(g.geometry));
        if(!best||d<best.d) best={d,green:g,teeEnd:(e===ends[0]?gm[gm.length-1]:gm[0])};
      }
      if(best&&(!picked[ref]||best.d<picked[ref].match)) picked[ref]={green:best.green,origin:best.teeEnd,match:best.d};
    }
  }

  // ── strict validation: every hole present, a DISTINCT green each, all matches tight ──
  const missing=[], usedIds={}, dupes=[], loose=[];
  for(let hn=1;hn<=N;hn++){
    const p=picked[hn];
    if(!p){missing.push(hn);continue;}
    if(p.match>MATCH_LIMIT){loose.push(hn);continue;}
    if(usedIds[p.green.id]){dupes.push(hn);continue;}
    usedIds[p.green.id]=hn;
  }
  const bad=[...new Set([...missing,...dupes,...loose])].sort((a,b)=>a-b);
  const good=N-bad.length;

  // Greens whose hole number OSM does not record. Rather than guess, keep their exact
  // outlines aside so they can be identified with a single tap while standing on them.
  const pool=greens.filter(g=>!usedIds[g.id]).map(g=>{
    const pts=g.geometry.map(x=>({lat:x.lat,lon:x.lon}));
    return {c:cent(pts),poly:pts.map(x=>[Math.round(x.lat*1e6)/1e6,Math.round(x.lon*1e6)/1e6])};
  });

  if(bad.length){
    const why = pool.length
      ? `OpenStreetMap has ${greens.length} green outlines here but does not record which hole ${pool.length===1?'one of them belongs':'they belong'} to, so ${bad.length} hole${bad.length>1?'s':''} cannot be numbered automatically.`
      : (greens.length<N
        ? `OpenStreetMap only has ${greens.length} green${greens.length===1?'':'s'} mapped for this course, so ${bad.length} hole${bad.length>1?'s':''} cannot be placed at all.`
        : `${bad.length} hole${bad.length>1?'s':''} could not be matched to a distinct green with confidence.`);
    GPBUSY=false;
    const route = pool.length
      ? `\n\nThe ${pool.length} unnumbered outline${pool.length>1?'s are':' is'} exact — while standing on each green you can tap "This green is hole N" once and it is done, with full front and back accuracy.`
      : `\n\nThose holes will need their front, centre and back tapped on the course.`;
    const ok=confirm(`Not a complete map yet.\n\n${why}\n\nNumbered automatically: ${good} of ${N}\nStill to identify: hole${bad.length>1?'s':''} ${bad.join(', ')}${route}\n\nSave what is verified and continue on the course? Nothing has been written yet.`);
    if(!ok){GPMSG='Import cancelled — nothing saved.';render();return;}
  }

  // build records only for holes that passed validation
  const out={};
  Object.keys(usedIds).forEach(id=>{
    const hn=usedIds[id], p=picked[hn], pts=p.green.geometry.map(x=>({lat:x.lat,lon:x.lon}));
    const c=cent(pts);
    let origin=p.origin;
    if(!origin){ const t=tees.find(t=>refOf(t)===hn); if(t) origin=cent(t.geometry); }
    let f=null,b=null;
    if(origin){ let lo=Infinity,hi=-Infinity;
      for(const q2 of pts){const d=gpDist(origin,q2); if(d<lo){lo=d;f=q2;} if(d>hi){hi=d;b=q2;}} }
    out[String(hn)]={c,...(f?{f}:{}),...(b?{b}:{}),
      poly:pts.map(x=>[Math.round(x.lat*1e6)/1e6,Math.round(x.lon*1e6)/1e6]),src:'osm'};
  });

  // never overwrite a position your group captured by hand
  GPGEO=GPGEO||{};
  Object.keys(GPGEO).forEach(k=>{ if(GPGEO[k]&&GPGEO[k].src==='capture') delete out[k]; });
  if(pool.length) out._pool=pool;
  if(!Object.keys(out).length){GPBUSY=false;GPMSG='OpenStreetMap has nothing usable for this course. Tap the front, centre and back of each green as you play — a one-off job, then it is permanent.';render();return;}
  try{ await fetch(`${GEO_URL}/${geoKey(LR.course)}.json`,{method:'PATCH',body:JSON.stringify(out)}); }
  catch(e){ GPBUSY=false;GPMSG='Could not save to the shared database — check your connection and try again.';render();return; }
  GPGEO={...GPGEO,...out};
  GPBUSY=false;
  const n=Object.keys(out).filter(k=>k!=='_pool').length;
  GPMSG=bad.length
    ? `Numbered ${n} of ${N} hole${N>1?'s':''} automatically${pool.length?` · ${pool.length} exact green outline${pool.length>1?'s':''} ready to identify — stand on a green and tap the button`:''}.`
    : `Complete — all ${N} holes mapped from OpenStreetMap (${method}), saved for your whole group. ✓`;
  render();
};

async function lpPull(){
  try{
    if(LPV==='round'&&LRID){
      const d=await(await fetch(`${LRS_URL}/${LRID}.json?t=${Date.now()}`)).json();
      if(!d||!d.active){
        // round finished or discarded elsewhere
        if(LR){LR=null;LRID=null;LPV='list';LRMSG='That round was closed on another phone.';if(V==='play'&&!MOD)render();}
      }else{
        if(Date.now()-LPLASTW<6000){ d.scores=LR?LR.scores:d.scores; } // protect a just-tapped score, generous window
        d.scores=lpApplyQ(d.scores);   // anything not yet synced stays visible
        const changed=JSON.stringify(d)!==JSON.stringify(LR);
        LR=d;
        if(changed&&V==='play'&&!MOD)render();   // stable screen: no change → no rebuild
      }
    }else if(LPV==='list'){
      const d=await(await fetch(`${LRS_URL}.json?t=${Date.now()}`)).json();
      const changed=JSON.stringify(d||{})!==JSON.stringify(ROUNDS||{});
      ROUNDS=d||{};
      if(changed&&V==='play'&&!MOD)render();
    }
  }catch(e){}
}

window.TW_update=()=>{
  const nr=TRN_ROUNDS||1;
  const scores=S.players.map(p=>{
    // Sum all round scores
    let total=0,played=0;
    for(let ri=0;ri<nr;ri++){
      const el=document.getElementById(`tp-${p.id}-r${ri}`);
      const v=el?el.value.trim():'';
      if(v!==''&&!isNaN(parseInt(v))){total+=parseInt(v);played++;}
    }
    if(!played)return null;
    // Show running total
    if(nr>1){
      const tot=document.getElementById('total-'+p.id);
      if(tot)tot.textContent='Total: '+fmtScore(total);
    }
    return{p,n:total};
  }).filter(Boolean);
  const sel=document.getElementById('twinner');
  if(!sel)return;
  if(scores.length){
    const cur=sel.value;
    sel.innerHTML=scores.map(x=>`<option value="${x.p.id}"${x.p.id===cur?' selected':''}>${x.p.name} (${fmtScore(x.n)})</option>`).join('');
    if(!cur||!scores.find(x=>x.p.id===cur)){
      const best=scores.reduce((a,x)=>x.n<a.n?x:a);
      sel.value=best.p.id;

function courseNames(){ return [...new Set(S.courses.map(c=>c.name))].sort((a,b)=>a.localeCompare(b)); }

    <div class="mc-list">${list.map(n=>{

window.UM=()=>{
  const cn=PICK_COURSE||'';
  const sv=document.getElementById('msc')?.value;
  const tr=document.getElementById('mtr'),tc=document.getElementById('mtc');
  const ci=document.getElementById('mci'),dp=document.getElementById('mdp');
  if(!tr||!tc||!ci||!dp)return;
  const cfgRowEl=document.getElementById('mhr');
  if(!cn||!S.courses.some(c=>c.name===cn)){
    tr.style.display='none';ci.style.display='none';dp.style.display='none';
    if(cfgRowEl)cfgRowEl.style.display='none';
    return;
  }
  const cfgN=g=>g==='18'?'18 holes':g==='F9'?'Front 9':g==='L9'?'Back 9':g==='L9x2'?'Back 9 twice':g==='F9x2'?'Front 9 twice':g;
  const TEECOL={White:'#F2EFE4',Yellow:'#E8C544',Blue:'#5C97B8',Red:'#C4544B',Green:'#6E9E5C',Purple:'#8E6BA8',Black:'#2A2A2A',Gold:'#C9A84C',Orange:'#D98A3C'};
  const tees=[...new Set(S.courses.filter(c=>c.name===cn).map(c=>c.tee))];
  let tee=tees[0];
  tr.style.display='block';
  // If editing, prefer the tee and configuration from the existing round
  const editP = (EDIT_IDX!==null && PID) ? S.players.find(p=>p.id===PID) : null;
  const editSc = (editP && editP.scores[EDIT_IDX] && editP.scores[EDIT_IDX].course===cn) ? editP.scores[EDIT_IDX] : null;
  const editTee = editSc ? editSc.tee : null;
  if(PICK_TEE&&tees.includes(PICK_TEE))tee=PICK_TEE;
  else if(editTee&&tees.includes(editTee))tee=editTee;
  tc.innerHTML=tees.map(t=>{
    const row=S.courses.find(x=>x.name===cn&&x.tee===t);
    return `<button class="pk-chip${t===tee?' on':''}" onclick="PT('${t}')"><span class="pk-sw" style="background:${TEECOL[t]||'#BBB'}"></span>${t}${row?`<span class="pk-sub">${row.rating}</span>`:''}</button>`;
  }).join('');

  // ── which holes were played (18 / front 9 / back 9 …) ──
  const cfgRow=document.getElementById('mhr'),cfgBox=document.getElementById('mhc');
  const rows=S.courses.filter(x=>x.name===cn&&x.tee===tee);
  const cfgs=[...new Set(rows.map(x=>x.holes||(x.rating<40?'F9':'18')))];
  let cfg=cfgs[0];
  if(PICK_CFG&&cfgs.includes(PICK_CFG))cfg=PICK_CFG;
  else if(editSc&&editSc.holes&&cfgs.includes(editSc.holes))cfg=editSc.holes;
  if(cfgRow&&cfgBox){
    cfgRow.style.display='block';
    cfgBox.innerHTML=cfgs.map(g=>{
      const row=rows.find(x=>(x.holes||(x.rating<40?'F9':'18'))===g);
      return `<button class="pk-chip${g===cfg?' on':''}" onclick="PH('${g}')">${cfgN(g)}${row?`<span class="pk-sub">${row.rating}/${row.slope}</span>`:''}</button>`;
    }).join('');
    if(cfgs.length===1)cfgBox.innerHTML+=`<div class="pk-hint">Only one configuration is rated for this tee.</div>`;
  }
  const c=rows.find(x=>(x.holes||(x.rating<40?'F9':'18'))===cfg)||rows[0];
  if(c){
    ci.style.display='grid';
    ci.innerHTML=`<div class="scard normal"><div class="s-lbl">Course Rating</div><div style="font-size:16px;font-weight:600;color:var(--text)">${c.rating.toFixed(2)}</div></div>
    <div class="scard normal"><div class="s-lbl">Slope</div><div style="font-size:16px;font-weight:600;color:var(--text)">${c.slope}</div></div>`;
    if(sv&&parseInt(sv)){
      const d=calcDiff(parseInt(sv),c.rating,c.slope);
      dp.style.display='flex';dp.style.alignItems='center';dp.style.gap='10px';
      dp.innerHTML=`<span style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">Differential</span>
        <span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:600" class="${d<0?'under':d>0?'over':'even'}">${d>=0?'+':''}${d.toFixed(1)}</span>
        <span class="pill ${isNineCfg(c.holes||(c.rating<40?'F9':'18'))?'p9':'p18'}" style="margin-left:2px">${(()=>{const g=c.holes||(c.rating<40?'F9':'18');return g==='18'?'18-hole':g==='F9'?'front 9':g==='L9'?'back 9':g==='L9x2'?'back 9 ×2':g==='F9x2'?'front 9 ×2':g;})()}</span>`;
    }else dp.style.display='none';
  }
};

window.SS=pid=>{
  const cn=PICK_COURSE||'';
  const ts=document.getElementById('mts');
  const tees=[...new Set(S.courses.filter(c=>c.name===cn).map(c=>c.tee))];
  const tee=(PICK_TEE&&tees.includes(PICK_TEE))?PICK_TEE:(tees[0]||'');
  const rowsFor=S.courses.filter(x=>x.name===cn&&x.tee===tee);
  const cfgList=[...new Set(rowsFor.map(x=>x.holes||(x.rating<40?'F9':'18')))];
  const holes=(PICK_CFG&&cfgList.includes(PICK_CFG))?PICK_CFG:(cfgList[0]||'18');
  const sv=document.getElementById('msc')?.value;
  const dateVal=document.getElementById('msdate')?.value||'';
  const er=document.getElementById('mer');
  if(!er)return;
  if(!cn){er.textContent='Please choose a course.';er.style.display='block';return;}
  if(!S.courses.some(c=>c.name===cn)){er.textContent=`No course called “${cn}”. Pick one from the list, or add it on the Courses screen.`;er.style.display='block';return;}
  if(!tee){er.textContent='Please choose a tee.';er.style.display='block';return;}
  // A date is mandatory on every new round. Monthly competitions cannot attribute an
  // undated round to a month, and the handicap engine needs it to sequence properly.
  if(!dateVal){er.textContent='Please set the date this round was played.';er.style.display='block';return;}
  {
    const today=new Date().toISOString().slice(0,10);
    if(dateVal>today){er.textContent='That date is in the future. A round can only be posted after it has been played.';er.style.display='block';return;}
    if(isNaN(new Date(dateVal).getTime())){er.textContent='That date is not valid.';er.style.display='block';return;}
  }
  // Catch the mistake that caused this: a nine-hole score filed as a full round.
  {
    const nine=(holes==='F9'||holes==='L9');
    const g=parseInt(sv,10);
    if(isFinite(g)){
      const rowP=S.courses.find(c=>c.name===cn&&c.tee===tee&&(c.holes||'18')===holes);
      const parP=(rowP&&rowP.par)||(nine?36:72);
      if(!nine&&g<parP-10){er.textContent=`${g} is too low for ${cfgLabelOf(holes)} at par ${parP}. If you played nine holes, choose Front 9 or Back 9 above.`;er.style.display='block';return;}
      if(nine&&g>100){er.textContent=`${g} is too high for nine holes. If you played the full round, choose 18 holes above.`;er.style.display='block';return;}
      const row=S.courses.find(c=>c.name===cn&&c.tee===tee&&(c.holes||'18')===holes);
      if(row){
        const dd=calcDiff(g,row.rating,row.slope);
        if(dd<-5){er.textContent=`That gives a differential of ${dd.toFixed(1)}, which is not possible. Check the score and the number of holes.`;er.style.display='block';return;}
      }
    }
  }
  const s=parseInt(sv);
  if(!s||s<1||s>250){er.textContent='Enter a valid score (1–250).';er.style.display='block';return;}
  const entry={course:cn,tee,holes,score:s};
  if(dateVal)entry.date=dateVal;
  if(EDIT_IDX!==null){
    // EDIT mode: replace the round at EDIT_IDX
    upd({...S,players:S.players.map(p=>p.id===pid?{...p,scores:p.scores.map((sc,i)=>i===EDIT_IDX?entry:sc)}:p)});
    EDIT_IDX=null;
  }else{
    // ADD mode: append
    upd({...S,players:S.players.map(p=>p.id===pid?{...p,scores:[...p.scores,entry]}:p)});
  }
  MOD=null;
};

window.ES=(pid,idx)=>{
  // Open the score modal in edit mode for a specific round.
  // Reset picker state so one edit cannot inherit the previous round's selection.
  PICK_TEE=null; PICK_CFG=null; PICK_Q='';
  const pl=S.players.find(x=>x.id===pid), sc=pl&&pl.scores?pl.scores[idx]:null;
  PICK_COURSE=sc?sc.course:null;
  if(sc){PICK_TEE=sc.tee||null;PICK_CFG=sc.holes||null;}
  PID=pid; EDIT_IDX=idx; MOD='score'; render();
};

window.DS=(pid,idx)=>{
  if(!confirm('Remove this round?'))return;
  upd({...S,players:S.players.map(p=>p.id===pid?{...p,scores:p.scores.filter((_,i)=>i!==idx)}:p)});
};

window.EC=i=>{EDIT_COURSE=i;MOD='course';render();};
window.XC=i=>{
  const c=S.courses[i];if(!c)return;
  const used=S.players.reduce((n,p)=>n+(p.scores||[]).filter(s=>s.course===c.name&&s.tee===c.tee&&(s.holes||'18')===(c.holes||(c.rating<40?'F9':'18'))).length,0);
  if(used){alert(`Cannot delete — ${used} round${used>1?'s':''} recorded on ${c.name} (${c.tee}). Edit those rounds first, or correct this tee instead of removing it.`);return;}
  if(!confirm(`Remove ${c.name} · ${c.tee} · ${c.holes||'18'}?`))return;
  upd({...S,courses:S.courses.filter((_,x)=>x!==i)});
};
window.SC2=()=>{
  const name=document.getElementById('an')?.value.trim();
  const tee=document.getElementById('at')?.value;
  const holes=document.getElementById('ah')?.value||'18';
  const r=parseFloat(document.getElementById('ar')?.value);
  const sl=parseInt(document.getElementById('as')?.value);
  const parV=parseInt(document.getElementById('ap')?.value);
  const er=document.getElementById('aer');
  if(!er)return;
  const fail=m=>{er.textContent=m;er.style.display='block';};
  if(!name)return fail('Course name is required.');
  if(isNaN(r))return fail('Course rating is required.');
  if(isNaN(sl)||sl<55||sl>155)return fail('Slope must be between 55 and 155.');
  // a nine and a full round occupy very different rating ranges — catch the classic mix-up
  const nine=holes==='F9'||holes==='L9';
  if(nine&&(r<25||r>45))return fail(`A single nine is rated roughly 25–45. You entered ${r} — did you mean 18 holes?`);
  if(!nine&&(r<55||r>85))return fail(`A full round is rated roughly 55–85. You entered ${r} — did you mean a single nine?`);
  const dup=S.courses.findIndex(c=>c.name===name&&c.tee===tee&&(c.holes||(c.rating<40?'F9':'18'))===holes);
  if(dup!==-1&&dup!==EDIT_COURSE)return fail(`${name} · ${tee} · ${holes} already exists. Edit that entry instead.`);
  const row={name,tee,holes,rating:r,slope:sl,...(parV?{par:parV}:{}),src:'manual'};
  if(EDIT_COURSE!==null){
    const old=S.courses[EDIT_COURSE];
    const renamed = old.name!==name||old.tee!==tee||(old.holes||'18')!==holes;
    const players = renamed ? S.players.map(p=>({...p,scores:(p.scores||[]).map(s=>
      (s.course===old.name&&s.tee===old.tee&&(s.holes||'18')===(old.holes||(old.rating<40?'F9':'18')))
        ? {...s,course:name,tee,holes} : s)})) : S.players;
    upd({...S,players,courses:S.courses.map((c,i)=>i===EDIT_COURSE?row:c)});
    EDIT_COURSE=null;
  }else{
    upd({...S,courses:[...S.courses,row]});
  }
  MOD=null;
};
</script>
