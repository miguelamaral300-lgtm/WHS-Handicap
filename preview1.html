.cr-money{border:0.5px solid rgba(14,122,62,.35);background:rgba(14,122,62,.06);border-radius:var(--r);padding:13px 14px;margin-bottom:14px}
.cr-money.trial{border-color:rgba(12,26,18,.15);background:rgba(12,26,18,.03)}
.cr-money-h{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:17px;color:#0B6534}
.cr-money.trial .cr-money-h{color:var(--text2)}
.cr-money-n{font-size:11.5px;color:var(--text3);line-height:1.55;margin-top:3px}
.cr-owed{margin-top:10px;display:grid;gap:6px}
.cr-owe{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:0.5px solid rgba(12,26,18,.1);border-radius:9px;padding:9px 11px;font-size:12.5px;color:#0C1A12}
.cr-amt{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.cr-settled{margin-top:10px;font-size:12px;color:#0E7A3E;font-weight:600}
.cr-wrap{max-width:560px;margin:0 auto;padding:2px 0 24px}
.cr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cr-title{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:25px;color:#0C1A12;text-align:center}
.cr-sub{font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--text3);text-align:center;margin-top:2px}
.cr-nav{background:none;border:0.5px solid rgba(12,26,18,.18);border-radius:9px;width:34px;height:34px;font-size:16px;color:var(--text2);cursor:pointer}
.cr-nav:disabled{opacity:.3}
.cr-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13px}
.cr-btn{border:none;border-radius:10px;padding:9px 14px;font-family:'Geist',sans-serif;font-weight:700;font-size:12.5px;background:linear-gradient(135deg,var(--gold),#0B6534);color:#FFFFFF;cursor:pointer;flex-shrink:0}
.cr-ghost{width:100%;border:0.5px solid rgba(12,26,18,.18);border-radius:12px;background:transparent;color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:13px;padding:12px;margin-top:14px;cursor:pointer}
.cr-note{font-size:11px;color:var(--text3);line-height:1.55;margin-top:4px}
.cr-empty{text-align:center;color:var(--text3);font-size:13px;padding:26px 14px;border:0.5px dashed var(--line);border-radius:var(--r);line-height:1.6}
.cr-void{border:0.5px solid rgba(226,59,46,.35);background:rgba(226,59,46,.08);border-radius:var(--r);padding:11px 13px;font-size:12px;color:#0B6534;line-height:1.55;margin-bottom:12px}
.cr-podium{text-align:center;border:0.5px solid rgba(14,122,62,.45);border-radius:16px;background:linear-gradient(170deg,rgba(14,122,62,.13),rgba(14,122,62,.02));padding:18px 14px;margin-bottom:14px}
.cr-crownicon{font-size:34px;line-height:1}
.cr-winner{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:27px;color:#0B6534;margin-top:2px}
.cr-score{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:38px;color:var(--gold);line-height:1}
.cr-score span{font-size:15px;color:var(--text3);font-weight:600}
.cr-spoon{font-size:11.5px;color:var(--text2);margin-top:9px;padding-top:9px;border-top:0.5px solid rgba(14,122,62,.25)}
.cr-sec{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin:20px 2px 9px}
.cr-table{border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cr-row{display:grid;grid-template-columns:24px 1fr 30px 32px 32px 32px 32px 48px;gap:4px;align-items:center;
  padding:11px 10px;border-bottom:0.5px solid rgba(12,26,18,.06);font-size:12.5px;cursor:pointer}
.cr-row:last-child{border-bottom:none}
.cr-hd{background:rgba(12,26,18,.04);font-size:9px;letter-spacing:.8px;text-transform:none;color:var(--text3);font-weight:700;cursor:default}
.cr-lead{background:rgba(14,122,62,.08)}
.cr-dim{opacity:.62;cursor:default}
.cr-pos{font-family:'Geist',serif;font-style:normal;font-weight:700;color:var(--gold);font-size:15px}
.cr-nm{font-weight:600;color:#0C1A12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-n{font-family:'Geist Mono',sans-serif;font-weight:600;text-align:right;color:var(--text2)}
.cr-tot{font-family:'Geist Mono',sans-serif;font-weight:700;text-align:right;color:#0C1A12;font-size:15px}
.cr-detail{background:rgba(12,26,18,.04);border-bottom:0.5px solid rgba(12,26,18,.06);padding:4px 10px 10px}
.cr-cat{padding:9px 2px;border-bottom:0.5px solid rgba(12,26,18,.06)}
.cr-cat:last-child{border-bottom:none}
.cr-cat-h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#0C1A12}
.cr-cat-h span{font-family:'Geist Mono',sans-serif;font-weight:700;color:var(--gold)}
.cr-cat-b{font-size:10.5px;color:var(--text3);margin-top:2px;line-height:1.5}
.cr-cat-v{font-size:11.5px;color:var(--text2);margin-top:4px}
.cr-how{border:0.5px solid var(--line);border-radius:var(--r);background:var(--panel);padding:13px 14px}
.cr-w{font-size:12.5px;color:var(--text2);line-height:1.6;padding:5px 0}
.cr-w b{display:inline-block;min-width:26px;font-family:'Geist Mono',sans-serif;font-size:15px;color:var(--gold)}
/* ── live results: tabs, formats, scorecard ── */
/* leaderboard rows */
.lbr{display:grid;grid-template-columns:24px 1fr auto;grid-template-rows:auto auto;gap:0 12px;align-items:center;background:#fff;border:0.5px solid rgba(12,26,18,.08);border-radius:13px;padding:11px 14px;margin-bottom:7px}
.lbr.lead{border-color:var(--gold,#0E7A3E);background:linear-gradient(100deg,rgba(14,122,62,.1),#fff)}
.lbr-pos{grid-row:1/3;font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:19px;color:var(--gold,#0E7A3E);text-align:center}
.lbr-nm{font-weight:600;font-size:14.5px;color:#0C1A12}
.lbr-sub{font-size:10.5px;color:#5F6E64}
.lbr-main{grid-row:1;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:22px;color:#0C1A12;text-align:right}
.lbr-main small{font-size:11px;color:#5F6E64;font-weight:600}
.lbr-main .u{color:#E23B2E}.lbr-main .d{color:#0E7A3E}.lbr-main .e{color:#5F6E64}
.lbr-sub2{grid-row:2;font-size:10.5px;color:#5F6E64;text-align:right}
/* full scorecard */
.sccard{background:#FFFFFF;border:0.5px solid rgba(14,122,62,.22);border-radius:16px;overflow:hidden;padding-bottom:4px}
.sccard .tblwrap{overflow:hidden}
table.scc{border-collapse:collapse;width:100%;table-layout:fixed}
table.scc td{text-align:center;padding:0;font-variant-numeric:tabular-nums}
.scr-l{text-align:left !important;padding-left:11px !important;font-size:9px;letter-spacing:.4px;text-transform:none;color:#5F6E64;font-weight:600;width:38px}
.scr-h td{padding:8px 0 5px;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:11px;color:#0E7A3E;border-bottom:0.5px solid rgba(14,122,62,.15)}
.scr-h .scr-l{color:#5F6E64}
.scr-p td{padding:5px 0;font-size:11px;color:#5F6E64;border-bottom:0.5px solid rgba(255,255,255,.05)}
.scr-s td{padding:6px 1px}
.scr-s .scr-l{color:#0E7A3E;font-family:'Geist',serif;font-style:normal;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0}
.scr-sp{background:rgba(14,122,62,.08);font-family:'Geist Mono',sans-serif;font-weight:700;color:#0E7A3E !important}
.scr-h .scr-sp,.scr-p .scr-sp{color:#0E7A3E !important}
.scmk{display:inline-grid;place-items:center;width:22px;height:22px;font-size:12.5px;font-weight:700;color:#0C1A12}
.scmk.birdie{color:#FFFFFF;background:#0E7A3E;border-radius:50%}
.scmk.eagle{color:#FFFFFF;background:#0E7A3E;border-radius:50%}
.scmk.bogey{color:#0C1A12;border:1.5px solid #5F6E64;border-radius:6px}
.scmk.double{color:#fff;background:#E23B2E;border-radius:6px}
.scr-t td{padding:10px 1px;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:14px;color:#0C1A12;background:rgba(14,122,62,.1);border-top:0.5px solid rgba(14,122,62,.2)}
.scr-t .scr-l{color:#0E7A3E;letter-spacing:0}
.scr-t .gr{color:#0E7A3E;font-size:16px}
.scc-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:11px 8px 7px;font-size:10px;color:#5F6E64}
.scc-legend span{display:flex;align-items:center;gap:5px}
.scc-legend i{width:13px;height:13px;border-radius:50%;display:block}
.scc-legend i.eagle{background:#0E7A3E}.scc-legend i.birdie{background:#0E7A3E}
.scc-legend i.bogey{border:1.5px solid #5F6E64;border-radius:4px}.scc-legend i.double{background:#E23B2E;border-radius:4px}
.pswitch{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 11px}
.pswitch .pchip{flex:0 0 auto;border:0.5px solid rgba(12,26,18,.12);background:#fff;border-radius:20px;padding:7px 14px;font-family:'Geist',sans-serif;font-weight:600;font-size:12.5px;color:#5F6E64;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.pswitch .pchip.on{border-color:var(--gold,#0E7A3E);background:rgba(14,122,62,.14);color:#0B6534}
/* GPS distances */
.lp-offline{text-align:center;font-size:11px;color:#E23B2E;background:rgba(226,59,46,.09);border:0.5px solid rgba(226,59,46,.3);border-radius:11px;padding:9px;margin-top:11px;line-height:1.5}
.lp-offline b{color:#0E7A3E;text-decoration:underline;cursor:pointer}
.gp-link{width:100%;border:none;border-radius:12px;padding:13px;font-family:'Geist',sans-serif;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,#0E7A3E,#0B6534);color:#FFFFFF;margin-top:11px;cursor:pointer}
.gp-lock{text-align:center;font-size:10.5px;letter-spacing:.5px;color:var(--text3);margin-top:10px;font-weight:600}
.gp-lock.on{color:#0E7A3E}
.gp-unit{width:100%;border:0.5px solid var(--line);border-radius:11px;background:transparent;color:var(--text3);font-family:'Geist',sans-serif;font-weight:600;font-size:11.5px;padding:9px;margin-top:9px;cursor:pointer}
.gp-panel{margin-top:13px;border:0.5px solid var(--line);border-radius:16px;background:#fff;padding:15px 14px 14px}
.gp-toggle{width:100%;border:0.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:13.5px;padding:12px;margin-top:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gp-toggle.on{border-color:var(--gold);color:#0E7A3E;background:rgba(14,122,62,.09)}
.gp-big{text-align:center;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:74px;line-height:.86;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 34px rgba(14,122,62,.28)}
.gp-big small{font-size:19px;color:var(--text3);letter-spacing:0;margin-left:4px;font-weight:600}
.gp-cap{text-align:center;font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin-top:2px}
.gp-fb{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.gp-cell{border:0.5px solid var(--line);border-radius:11px;background:rgba(12,26,18,.035);padding:9px;text-align:center}
.gp-cell .v{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:25px;color:var(--text)}
.gp-cell .l{font-size:9px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin-top:1px}
.gp-acc{text-align:center;font-size:10.5px;color:var(--text3);margin-top:11px;line-height:1.5}
.gp-acc b{color:var(--text2)}
.gp-warn{text-align:center;font-size:11.5px;color:var(--bogey,#E23B2E);line-height:1.55;padding:6px 2px}
.gp-cap3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.gp-cbtn{border:0.5px solid var(--line);border-radius:11px;background:#FFFFFF;color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:12px;padding:11px 4px;cursor:pointer}
.gp-cbtn.set{border-color:#0E7A3E;color:#0E7A3E}
.gp-cbtn:active{transform:scale(.95)}
.gp-imp{width:100%;border:none;border-radius:12px;padding:13px;font-family:'Geist',sans-serif;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,var(--gold),#0B6534);color:#FFFFFF;margin-top:11px;cursor:pointer}
.gp-imp:disabled{opacity:.5}
.gp-note{font-size:10.5px;color:var(--text3);text-align:center;margin-top:9px;line-height:1.5}
/* PLAY v2: lobby, wizard, history, summary */
.lp-stepper{display:flex;align-items:center;gap:9px}
.st-btn{flex:0 0 58px;height:54px;border-radius:13px;border:0.5px solid var(--line);background:#FFFFFF;color:var(--text2);font-size:27px;font-weight:600;cursor:pointer;font-family:'Geist',sans-serif;line-height:1}
.st-btn:active{transform:scale(.93);border-color:var(--gold);color:#0E7A3E}
.st-val{flex:1;height:54px;border-radius:13px;border:0.5px solid var(--line);background:rgba(12,26,18,.035);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:27px;color:var(--text);line-height:1;cursor:pointer}
.st-val small{font-size:8.5px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin-top:3px;font-family:'Geist',sans-serif}
.st-val.empty{color:var(--text3)}
.st-val.b1{border-color:#0E7A3E;color:#0E7A3E;border-radius:50px}
.st-val.b2{border-color:var(--gold);color:var(--gold);border-radius:50px;box-shadow:inset 0 0 0 2px rgba(14,122,62,.35)}
.st-val.o1{border-color:#E23B2E;color:#E23B2E}
.st-val.o2{border-color:#E23B2E;color:#E23B2E;box-shadow:inset 0 0 0 2px rgba(226,59,46,.3)}
.st-clr{flex:0 0 36px;height:36px;border-radius:50%;border:0.5px solid rgba(226,59,46,.3);background:transparent;color:#E23B2E;font-size:13px;cursor:pointer}
.lp-empty{text-align:center;color:var(--text3);font-size:13px;padding:22px 10px;border:0.5px dashed var(--line);border-radius:14px;margin-bottom:10px}
.lp-back{border:none;background:none;color:var(--text3);font-family:'Geist',sans-serif;font-weight:600;font-size:13px;padding:2px 0 12px;cursor:pointer}
.lp-ghost{width:100%;border:0.5px solid var(--line);border-radius:13px;background:transparent;color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:13.5px;padding:13px;margin-top:10px;cursor:pointer}
.lp-ghost.sm{padding:10px;font-size:12.5px;margin-top:8px}
.lp-step{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--text2);font-weight:700;margin:20px 2px 10px}
.lp-step .n{width:22px;height:22px;border-radius:50%;background:rgba(14,122,62,.16);border:0.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:'Geist',serif;font-style:normal;font-size:13px}
.lp-cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp-ccard{border:0.5px solid var(--line);border-radius:13px;background:var(--panel);padding:13px 12px;cursor:pointer}
.lp-ccard.on{border-color:var(--gold);background:rgba(14,122,62,.1);box-shadow:0 0 0 1px var(--gold)}
.lp-ccard .cc-nm{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:16px;color:var(--text);line-height:1.15}
.lp-ccard.on .cc-nm{color:var(--gold-lt,#0E7A3E)}
.lp-ccard .cc-sub{font-size:10.5px;color:var(--text3);margin-top:4px}
.lp-chip small{color:var(--text3);font-weight:500}
.lp-prow .tick{width:20px;color:var(--gold);font-weight:700}
.lp-prow .gtag,.lp-pl .gtag{font-size:8.5px;letter-spacing:0;text-transform:none;background:rgba(14,122,62,.16);color:#5F6E64;border-radius:10px;padding:1px 7px;font-weight:700;vertical-align:middle}
.lp-prow .gdel{color:#E23B2E;font-size:15px;padding:4px 2px 4px 8px}
.lp-rcard{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0.5px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 14px;margin-bottom:8px;cursor:pointer}
.lp-rcard.on{border-color:var(--gold)}
.lp-rcard .rc-course{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:16.5px;color:var(--gold-lt,#0E7A3E)}
.lp-rcard .rc-sub{font-size:11px;color:var(--text3);margin-top:3px}
.lp-rcard .rc-thru{text-align:right;color:var(--text2);font-size:11px}
.lp-rcard .rc-thru b{font-family:'Geist Mono',sans-serif;font-size:18px;color:var(--text)}
.lp-rcard .rc-live{display:block;font-size:8.5px;letter-spacing:0;color:#0E7A3E;font-weight:700;margin-top:2px;animation:lplive 2s ease-in-out infinite}
@keyframes lplive{0%,100%{opacity:1}50%{opacity:.4}}
.lp-schips{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.lp-schips::-webkit-scrollbar{display:none}
.lp-sc{flex:0 0 42px;max-width:none}
.lp-sc.isp{border-color:rgba(14,122,62,.45);color:var(--text)}
.lp-hint{text-align:center;font-size:10.5px;color:var(--text3);margin-top:8px;line-height:1.5}
.lp-trophy{text-align:center;font-size:44px;margin-top:8px}
.lp-fw{text-align:center;font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:28px;color:var(--gold);text-shadow:0 0 28px rgba(14,122,62,.3)}
.lp-fd{text-align:center;font-size:12px;color:var(--text2);margin-top:3px}
.lp-start.share{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#0C1A12,#0C1A12);color:#FFFFFF}
.lp-tblwrap{overflow-x:auto;margin-top:12px}
.lp-tbl{width:100%;border-collapse:collapse;font-size:12px}
.lp-tbl th{font-size:9px;letter-spacing:.5px;text-transform:none;color:var(--text3);padding:5px 4px;border-bottom:0.5px solid var(--line);text-align:center}
.lp-tbl td{padding:5px 4px;text-align:center;color:var(--text2);border-bottom:0.5px solid rgba(14,122,62,.06)}
.lp-tbl .hn{font-family:'Geist Mono',sans-serif;font-weight:700;color:var(--gold)}
.lp-tbl .pr{color:var(--text3)}
.lp-tbl .mk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;font-family:'Geist Mono',sans-serif;font-weight:700;color:var(--text)}
.lp-tbl .mk.b1{border:1.5px solid #0E7A3E;border-radius:50%;color:#0E7A3E}
.lp-tbl .mk.b2{border:1.5px solid var(--gold);border-radius:50%;color:var(--gold)}
.lp-tbl .mk.o1{border:1.5px solid #E23B2E;border-radius:4px;color:#E23B2E}
.lp-tbl .mk.o2{border:1.5px solid #E23B2E;border-radius:4px;color:#E23B2E}
.lp-tbl .tot td{font-weight:700;color:var(--text);background:rgba(12,26,18,.035)}

/* ═══ live results 2.0 — dark, mobile-first, clean ═══ */
.rv-tabs{display:flex;gap:4px;background:rgba(12,26,18,.035);border:0.5px solid var(--border2);border-radius:13px;padding:4px;margin:18px 0 9px}
.rv-tab{flex:1;border:none;background:none;font-family:'Geist',sans-serif;font-weight:600;font-size:13.5px;color:var(--text2);padding:11px;border-radius:10px;cursor:pointer;touch-action:manipulation;transition:.2s}
.rv-tab.on{background:linear-gradient(160deg,var(--gold),var(--gold-dim));color:#FFFFFF}
.rv-fmt{display:flex;gap:6px;margin-bottom:14px}
.rv-fbtn{flex:1;border:0.5px solid var(--border2);background:var(--mid);color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:12px;padding:9px 4px;border-radius:9px;cursor:pointer;touch-action:manipulation;transition:.2s}
.rv-fbtn.on{border-color:var(--gold);background:rgba(14,122,62,.16);color:var(--gold-lt)}
/* leaderboard */
.rv-lb{display:flex;flex-direction:column;gap:8px}
.rv-row{display:grid;grid-template-columns:26px 1fr auto;grid-template-rows:auto auto;gap:1px 13px;align-items:center;
  background:var(--mid);border:0.5px solid var(--border2);border-radius:15px;padding:13px 16px}
.rv-row.lead{border-color:var(--border);background:linear-gradient(100deg,rgba(14,122,62,.1),var(--mid))}
.rv-pos{grid-row:1/3;font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:21px;color:var(--gold);text-align:center}
.rv-nm{font-weight:600;font-size:15.5px;color:var(--text)}
.rv-sub{grid-row:2;font-size:11px;color:var(--text3)}
.rv-main{grid-row:1;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:24px;color:var(--gold-lt);text-align:right;line-height:1}
.rv-main small{font-size:11px;color:var(--text3);font-weight:600;margin-left:2px}
.rv-main .u{color:#E23B2E}.rv-main .d{color:#0E7A3E}
.rv-sub2{grid-row:2;font-size:11px;color:var(--text3);text-align:right}
/* scorecard — stacked full-width nine-blocks */
.rv-pchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.rv-pchips::-webkit-scrollbar{display:none}
.rv-pchip{flex:0 0 auto;border:0.5px solid var(--border2);background:var(--mid);border-radius:20px;padding:8px 15px;font-weight:600;font-size:13px;color:var(--text2);white-space:nowrap;cursor:pointer;touch-action:manipulation}
.rv-pchip.on{border-color:var(--gold);background:rgba(14,122,62,.16);color:var(--gold-lt)}
.sccard2{background:var(--mid);border:0.5px solid var(--border);border-radius:18px;padding:16px}
.scc2-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.scc2-nm{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:19px;color:var(--gold-lt)}
.scc2-meta{font-size:12px;color:var(--text2)}
.scblock{margin-bottom:16px}
.scb-hd{display:flex;justify-content:space-between;font-size:11px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin-bottom:8px}
.scb-hd span:last-child{color:var(--gold-lt);font-family:'Geist Mono',sans-serif;font-size:14px;letter-spacing:0}
.scb-hd small{color:var(--text3);font-weight:500}
.scb-holes,.scb-pars,.scb-scores{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.scnum{text-align:center;font-family:'Geist Mono',sans-serif;font-weight:600;font-size:10px;color:var(--text3);padding-bottom:3px}
.scpar{text-align:center;font-size:10px;color:var(--text2);padding-bottom:5px}
.sccell{display:flex;justify-content:center}
.scmk{display:grid;place-items:center;width:100%;aspect-ratio:1;max-width:30px;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:14px;color:var(--text)}
.scmk.eagle{background:var(--gold-lt);color:#FFFFFF;border-radius:50%}
.scmk.birdie{background:#0E7A3E;color:#FFFFFF;border-radius:50%}
.scmk.bogey{border:1.5px solid #5F6E64;border-radius:7px}
.scmk.double{background:#E23B2E;color:#fff;border-radius:7px}
.scc2-tot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:4px;border-top:0.5px solid var(--border);
  font-size:11px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600}
.scc2-big{font-family:'Geist Mono',sans-serif;font-size:22px;color:var(--gold-lt);letter-spacing:0;text-transform:none}
.scc2-big small{font-size:11px;color:var(--text3)}
.scc2-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;font-size:10px;color:var(--text2)}
.scc2-legend span{display:flex;align-items:center;gap:5px}
.scc2-legend i{width:13px;height:13px;border-radius:50%;display:block}
.scc2-legend i.eagle{background:var(--gold-lt)}.scc2-legend i.birdie{background:#0E7A3E}
.scc2-legend i.bogey{border:1.5px solid #5F6E64;border-radius:4px}.scc2-legend i.double{background:#E23B2E;border-radius:4px}


/* ════════════════════════════════════════════════════════════════════════
   THE CLUB · DESIGN FOUNDATION (revamp stage 1)
   Everything below restyles existing classes and adds the new ui-* parts.
   Colours: ink #0C1A12 · ink2 #5F6E64 · ink3 #A3ADA6 · line #E7ECE8 · off #F4F6F3
            green #0E7A3E (#138A47 → #0B6534) · green tint #E4F2E8 · red #E23B2E · red tint #FCE9E7
   ════════════════════════════════════════════════════════════════════════ */
@font-face{font-family:'Geist';src:url('fonts/Geist.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('fonts/CormorantItalic.ttf') format('truetype');font-weight:300 700;font-style:italic;font-display:swap}

html{background:var(--off)}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--off);color:var(--ink);letter-spacing:-.01em;font-feature-settings:'ss01'}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px calc(128px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){#app{padding-bottom:140px}}
button{font-family:inherit;color:inherit}
::selection{background:var(--gl)}

/* Old fonts in inline styles → new system (engraving on the trophy keeps Cormorant via its own class) */
[style*="Cormorant"],[style*="Playfair"],[style*="'Barlow'"]{font-family:'Geist',sans-serif!important;font-style:normal!important;letter-spacing:-.02em!important}
[style*="font-style:italic"]{font-style:normal!important}
[style*="color:#5AB870"],[style*="color:#7FB069"],[style*="color:#6FA368"]{color:var(--g)!important}
[style*="color:#E07070"],[style*="color:#CF6B5C"],[style*="color:#C77"]{color:var(--red)!important}

/* ── typography helpers ── */
.ui-xl{font-weight:500;letter-spacing:-.06em;line-height:.86;font-feature-settings:'tnum'}
.ui-h1{font-weight:600;font-size:29px;letter-spacing:-.035em;line-height:1.05;color:var(--ink)}
.ui-t{font-weight:600;font-size:15.5px;letter-spacing:-.02em}
.ui-s{font-size:13px;color:var(--ink2)}
.ui-mono,.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:-.03em}
.ui-lbl{font-size:12.5px;color:var(--ink2);font-weight:500;margin:22px 4px 8px}
.ui-note{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:12px 4px 0}

/* ── cards ── */
.ui-card{background:#fff;border-radius:22px;box-shadow:var(--sh-card)}
.ui-pad{padding:16px 18px}
.ui-list{background:#fff;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ui-row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px;background:none;border:none;border-top:1px solid var(--line);text-align:left;cursor:pointer;font-size:15px;color:var(--ink)}
.ui-row:first-child{border-top:none}
.ui-row:active{background:var(--off)}
.ui-row-t{flex:1;min-width:0;font-weight:600;letter-spacing:-.02em;display:flex;flex-direction:column;gap:2px}
.ui-row-t small{font-size:12.5px;font-weight:400;color:var(--ink2);letter-spacing:-.01em}
.ui-row-v{font-size:13px;color:var(--ink2);text-align:right}
.ui-row svg.ui-chev{width:16px;height:16px;stroke:var(--ink3);stroke-width:2;fill:none;flex-shrink:0}

/* ── pills, chips, segmented ── */
.ui-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gl);color:var(--g)}
.ui-pill.red{background:var(--redl);color:var(--red)}
.ui-pill.gw{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ui-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ink3);flex-shrink:0}
.ui-dot.ok{background:#1DB45A}.ui-dot.err{background:var(--red)}.ui-dot.wait{background:var(--ink3)}
.ui-chip{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);border:none;cursor:pointer}
.ui-chip.on{background:var(--ink);color:#fff;box-shadow:none}
.ui-seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.ui-seg button{height:32px;padding:0 14px;border:none;background:none;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.ui-seg button.on{background:var(--ink);color:#fff}

/* ── buttons ── */
.ui-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:none;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:-.02em;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;transition:transform .12s}
.ui-btn:active{transform:scale(.98)}
.ui-btn-g{background:var(--g);color:#fff}
.ui-btn-w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ui-btn-sm{width:auto;height:36px;padding:0 16px;font-size:13.5px}
.ui-ico{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border:none;cursor:pointer;color:var(--ink);padding:0}
.ui-ico svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ui-ico.gw{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24);color:#fff}
.ui-link{background:none;border:none;color:var(--g);font-weight:600;font-size:14px;cursor:pointer;padding:10px 4px}
.ui-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex-shrink:0;background:var(--off);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);letter-spacing:0;border:none}
.ui-av.g{background:var(--g);color:#fff;box-shadow:none}
.ui-av.w{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);cursor:pointer}

/* ── signature: fairway-green panel with yardage-book contours ── */
.ui-panel{position:relative;overflow:hidden;color:#fff;background-color:var(--g);background-image:var(--topo),var(--grad);background-size:cover,100% 100%;background-position:center,center}

/* ── top bar ── */
.ui-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;margin:0 0 6px}
.ui-top-t{flex:1;text-align:center;font-weight:600;font-size:16px;letter-spacing:-.02em}
.ui-top-r{display:flex;align-items:center;gap:8px}
.ui-brand{font-weight:600;font-size:17px;letter-spacing:-.03em;color:var(--ink)}
.ui-brand.w{color:#fff}
.ui-sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);padding:0 4px}
.ui-sync.w{color:rgba(255,255,255,.85)}
.ui-sync.w .ui-dot.ok{background:#8FF0B4}

/* ── home hero ── */
.ui-hero{margin:calc(-6px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(env(safe-area-inset-top,0px) + 8px) 20px 26px;border-radius:0 0 34px 34px}
.ui-hero-top{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.ui-greet{font-size:14.5px;color:rgba(255,255,255,.86);margin-top:26px}
.ui-bigrow{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.ui-hero .ui-xl{font-size:104px;color:#fff}
.ui-hero-sub{font-size:14px;color:rgba(255,255,255,.86);margin-top:14px}
.ui-hero .ui-h1{color:#fff;margin-top:8px}
.ui-hero .ui-btn-w{margin-top:20px;box-shadow:none;color:var(--g)}
.ui-home-body{margin-top:16px}
.ui-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ui-tile{background:#fff;border-radius:20px;box-shadow:var(--sh-card);padding:15px 16px;border:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:86px;color:var(--ink)}
.ui-tile:active{transform:scale(.98)}
.ui-tile .k{font-size:12px;color:var(--ink2)}
.ui-tile .v{font-weight:600;font-size:15.5px;letter-spacing:-.02em;line-height:1.2}
.ui-tile svg{width:22px;height:22px;stroke:var(--g);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.ui-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ui-tiles .ui-tile{box-shadow:inset 0 0 0 1px var(--line)}

/* ── floating bottom bar + green Play button ── */
.ui-dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:10px;padding:0 16px;max-width:560px;margin:0 auto;pointer-events:none}
.ui-bar{flex:1;height:64px;border-radius:999px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);display:flex;align-items:center;justify-content:space-around;box-shadow:0 16px 36px -16px rgba(12,26,18,.38),inset 0 0 0 1px rgba(12,26,18,.06);pointer-events:auto}
.ui-ti{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;height:56px;border:none;background:none;cursor:pointer;padding:0}
.ui-ti svg{width:22px;height:22px;fill:none;stroke:var(--ink3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ui-ti span{font-size:10.5px;font-weight:500;color:var(--ink3);letter-spacing:0}
.ui-ti.on svg{stroke:var(--g)} .ui-ti.on span{color:var(--g);font-weight:600}
.ui-play{width:64px;height:64px;border-radius:50%;background:var(--g);border:none;display:grid;place-items:center;box-shadow:0 14px 28px -12px rgba(14,122,62,.75);cursor:pointer;pointer-events:auto;flex-shrink:0;transition:transform .12s}
.ui-play:active{transform:scale(.94)}
.ui-play svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.ui-play.on{box-shadow:0 0 0 4px var(--gl),0 14px 28px -12px rgba(14,122,62,.75)}
.bnav,.nav-wrap{display:none!important}

/* ── bottom sheets (every form/modal) ── */
.ov{background:rgba(12,26,18,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);align-items:flex-end!important;padding:0!important;z-index:100;animation:uiFade .18s ease both}
.mo{background:var(--off);border:none!important;border-radius:28px 28px 0 0!important;padding:10px 20px calc(30px + env(safe-area-inset-bottom,0px));max-width:560px;max-height:92vh!important;overflow-y:auto;box-shadow:0 -20px 60px -20px rgba(12,26,18,.35);color:var(--ink);animation:uiRise .26s cubic-bezier(.2,.8,.25,1) both;position:relative}
.mo::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:rgba(12,26,18,.16);margin:0 auto 18px}
@media(min-width:640px){.ov{align-items:center!important;padding:24px!important}.mo{border-radius:28px!important}}
.mo-title{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;font-size:26px;letter-spacing:-.035em;color:var(--ink);margin-bottom:18px;line-height:1.1}
.ui-sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ui-sheet-h .mo-title{margin-bottom:16px}
@keyframes uiFade{from{opacity:0}to{opacity:1}}
@keyframes uiRise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ── forms ── */
select,input,textarea{font-family:'Geist',sans-serif;font-size:16px;min-height:52px;padding:0 16px;border:none;border-radius:16px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);letter-spacing:-.01em}
textarea{padding:14px 16px}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px;padding:0;box-shadow:none;accent-color:var(--g)}
select:focus,input:focus,textarea:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--g)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.fl{font-size:12.5px;font-weight:500;color:var(--ink2);text-transform:none;letter-spacing:0;margin-bottom:7px}
.fr{margin-bottom:16px}

/* ── buttons (existing classes) ── */
.btn-p{background:var(--ink);color:#fff;border-radius:999px;height:40px;padding:0 18px;font-family:'Geist',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:-.01em;text-transform:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-p::after{display:none}
.btn-p:hover{background:#1c2c22}
.mo .btn-p,.ui-confirm{background:var(--g)}
.btn-s{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;height:40px;padding:0 18px;font-size:13.5px;font-weight:600;color:var(--ink)}
.btn-s:hover{background:var(--off)}
.mo .btn-p,.mo .btn-s{height:52px;font-size:15px}
.btn-ic:hover{color:var(--red);background:var(--redl)}
.btn-edit{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-family:'Geist',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;border-radius:999px;padding:8px 14px}
.btn-edit:hover{background:var(--off);color:var(--ink)}
.btn-edit.danger{background:var(--redl);box-shadow:none;color:var(--red)}
.hdr-iconbtn{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}

/* ── section headers used by the existing screens ── */
.sec-head{border-bottom:none;padding-bottom:0;margin:6px 0 14px;gap:12px}
.sec-title{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;font-size:27px;letter-spacing:-.035em;color:var(--ink);line-height:1.1}
.subsec,.trend-title,.breadcrumb{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.divider{background:var(--line);height:1px}
.back-btn{font-size:13.5px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 14px}
.back-nav{margin-bottom:14px}

/* ── existing cards → white cards ── */
.ccard,.empty-state,.trend-card,.ls-card,.scard.normal,.trn-row,.upcoming-row,.lp-rcard,.cs,.cr-board,.cr-table,.cr-how,.cr-fair,.cr-entrybox,.cr-entry,.sccard2,.rv-row,.lbr,.lp-prow,.lp-ccard,.lp-hole,.mc-list,.cr-owe,.gp-panel{background:#fff;border:none!important;box-shadow:var(--sh-card)}
.ccard,.empty-state{border-radius:22px}
.trn-row,.upcoming-row,.lp-rcard,.cs,.ls-card,.trend-card,.scard.normal,.cr-board,.cr-table,.cr-how,.cr-fair,.cr-entrybox,.cr-entry{border-radius:20px}
.ls-card::before,.trend-card::before,.gate-card::before,.hdr::before,.hdr::after,.empty-state::before{display:none!important}
.empty-state{padding:40px 24px}
.empty-icon{display:none}
.empty-title{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;font-size:17px;color:var(--ink);letter-spacing:-.02em}
.empty-sub{font-family:'Geist',sans-serif;font-size:13px;color:var(--ink2);letter-spacing:0}

/* rankings rows → hairline list rows */
.rank-row{background:#fff;border:none;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px;gap:12px}
.rank-row.p1{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.rank-row::before{display:none!important}
@media(hover:hover){.rank-row:hover{background:#fff;box-shadow:inset 0 0 0 1px #d5ddd7;transform:none}}
.rank-medal-wrap{width:48px;padding:14px 0 14px 12px}
.rank-medal,.medal-1,.medal-2,.medal-3,.medal-n{background:var(--off)!important;color:var(--ink2)!important;box-shadow:inset 0 0 0 1px var(--line);width:34px;height:34px;font-size:13px;font-weight:600}
.rank-pos{display:none}
.rank-name{font-family:'Geist',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.rank-sub{font-size:12.5px;color:var(--ink2);letter-spacing:0}
.rank-hi{background:none;border:none;padding:14px 8px 14px 4px;min-width:64px;text-align:right}
.hi-label{display:none}
.hi-val{font-family:'Geist',sans-serif;font-weight:500;font-size:30px;letter-spacing:-.06em;color:var(--ink)}
.hi-na{font-family:'Geist',sans-serif;color:var(--ink3)}
.rank-chev{color:var(--ink3)}
.hi-carried{color:var(--g)}

/* profile stats */
.scard{border-radius:20px}
.scard.hero{border:none!important;box-shadow:var(--sh-card)}
.scard.hero,.cr-hero,.purse-total{background-color:var(--g);background-image:var(--topo),var(--grad);background-size:cover,100% 100%;color:#fff}
.scard.hero .s-lbl,.purse-lbl{color:rgba(255,255,255,.85)!important;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
.scard.hero .s-val,.purse-amt{font-family:'Geist',sans-serif;font-style:normal;color:#fff!important;font-weight:500;letter-spacing:-.06em}
.s-lbl,.ls-lbl,.ie-lbl{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2)!important}
.s-val,.ls-val{font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-.04em;color:var(--ink)!important}
.ie-val{color:var(--ink)}
.icard{background:var(--off);border:none;border-radius:14px}
.purse-total{border:none;border-radius:24px;box-shadow:var(--sh-card)}
.purse-amt{font-size:56px}

/* crown hero on green */
.cr-hero{border-radius:24px;box-shadow:var(--sh-card)}
.cr-hero-n{font-family:'Geist',sans-serif;font-style:normal;color:#fff;font-weight:600;letter-spacing:-.03em;font-size:22px}
.cr-hero-s{font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-.06em;font-size:64px}
.cr-hero-s span,.cr-hero-sp,.cr-hero-m{color:rgba(255,255,255,.8)!important}
.cr-title{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;font-size:24px;letter-spacing:-.035em;color:var(--ink)}
.cr-sub,.cr-sec,.lp-sec,.lp-step{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--ink2)}
.lp-sec::after{display:none}
.cr-nav{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:50%;width:40px;height:40px;color:var(--ink)}
.cr-strip{background:#fff;border:none;box-shadow:var(--sh-card);border-radius:20px;padding:14px 16px;font-size:13.5px;color:var(--ink)}
.cr-strip-go{color:var(--ink3)}
.cr-pos,.cr-b-pos,.lp-lb .pos,.rv-pos,.lbr-pos{font-family:'Geist',sans-serif;font-style:normal;color:var(--ink2);font-weight:500}

/* pills, chips, tabs */
.pill{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;letter-spacing:0}
.p9,.p18,.prun{background:var(--off);color:var(--ink2)}
.pwon{background:var(--gl);color:var(--g)}
.lp-chip,.pk-chip,.ctab,.pswitch .pchip,.rv-pchip,.rv-fbtn,.cr-etog{border:none!important;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);border-radius:999px;font-family:'Geist',sans-serif;font-weight:500;font-size:13.5px;letter-spacing:0;text-transform:none}
.ctab{padding:9px 16px}
.lp-chip.on,.pk-chip.on,.ctab.on,.pswitch .pchip.on,.rv-pchip.on,.rv-fbtn.on,.cr-etog.on{background:var(--ink)!important;color:#fff!important;box-shadow:none!important}
.pk-chip .pk-sub{color:inherit;opacity:.7}
.rv-tabs{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px}
.rv-tab{border-radius:999px;color:var(--ink2);font-weight:500}
.rv-tab.on{background:var(--ink);color:#fff}

/* primary / confirm buttons in existing screens */
.lp-start,.gp-link,.lp-fbtn.post,.cr-btn,.gp-imp,.gate-btn{background:var(--g)!important;color:#fff!important;border:none;border-radius:999px;font-family:'Geist',sans-serif;font-weight:600;letter-spacing:-.02em;text-transform:none}
.lp-start{height:56px;padding:0 18px;font-size:15px}
.lp-start.share{background:var(--ink)!important}
.lp-nbtn,.lp-ghost,.cr-ghost,.gp-toggle,.gp-unit,.lp-fbtn.disc,.mc-change{background:#fff;border:none!important;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);border-radius:999px;font-family:'Geist',sans-serif;font-weight:600}
.lp-ghost{height:52px}
.lp-nbtn.next{background:var(--ink);color:#fff;box-shadow:none}
.lp-fbtn.disc{color:var(--red)}
.lp-back{color:var(--ink);font-weight:600}

/* live scoring, readable on white */
.lp-hole{border-radius:22px}
.lp-hh .big{font-family:'Geist',sans-serif;font-style:normal;font-weight:500;letter-spacing:-.06em;color:var(--ink)}
.lp-pl{background:var(--off);border:none;border-radius:16px}
.lp-sc,.st-btn,.gp-cbtn{background:var(--off);border:none;color:var(--ink);font-family:'Geist',sans-serif;font-weight:500}
.lp-sc.sel{background:var(--ink);color:#fff}
.st-val{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);font-family:'Geist',sans-serif;font-weight:500}
.lp-pip{background:#fff;border:none;box-shadow:inset 0 0 0 1px var(--line);font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.lp-pip.done{background:var(--gl);color:var(--g);box-shadow:none}
.lp-pip.cur{background:var(--ink);color:#fff;box-shadow:none}
.lp-tl{color:var(--ink2)} .lp-tl b{color:var(--ink)} .lp-tl-h{color:var(--ink3)}
.lp-msg{background:var(--gl);border:none;color:var(--g);font-family:'Geist',sans-serif;font-style:normal;font-size:14px;font-weight:500;border-radius:16px}
.lp-empty,.cr-empty{border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;color:var(--ink2)}
.lp-rcard .rc-course,.lp-ccard .cc-nm,.scc2-nm,.lp-fw,.trn-name,.upcoming-name,.honour-name,.purse-name,.win-name,.trophy-champ,.cr-winner,.cr-fair-t,.cr-money-h{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;letter-spacing:-.02em;color:var(--ink);text-shadow:none}
.lp-rcard .rc-live{color:var(--g)}
.lp-hh .meta b,.lp-pl .pnet b,.rv-main,.scc2-big,.scb-hd span:last-child{color:var(--ink)}
.sccard{background:#fff;border:none;box-shadow:var(--sh-card)}
.scr-p td,.scr-h td,.scr-t td,.scmk{color:var(--ink)}
.gp-big{color:var(--ink);text-shadow:none;font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-.06em}
.gp-cell{background:var(--off);border:none}

/* warnings: red only */
.pending-warn,.cr-fair-w,.cr-void,.lp-offline,.mc-none{background:var(--redl);border:none;color:var(--red);border-radius:14px}
.gp-warn,.cr-warn-dot{color:var(--red)}
.cr-goal,.cr-target,.cr-pcc{background:var(--gl);border:none;color:var(--g);border-radius:12px}

/* upcoming date block */
.upcoming-row{border-left:none}
.date-block{background:var(--gl)}
.date-day{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;color:var(--g);letter-spacing:-.04em}
.date-mon,.date-yr{color:var(--g)}
.countdown,.player-tag{background:var(--off);border:none;color:var(--ink2);border-radius:999px}
.win-box{background:var(--gl);border:none;box-shadow:none;border-radius:18px}
.trophy-stage{background:#fff;border:none;box-shadow:var(--sh-card);border-radius:24px}
.trophy-stage::before{display:none}
.trophy-image-wrap{filter:drop-shadow(0 14px 28px rgba(12,26,18,.22))}
.stat-leader,.contest-winner,.honour-score,.tscore-val,.purse-earned{font-family:'Geist',sans-serif;font-style:normal;color:var(--ink)}
.under{color:var(--red);font-weight:600}.over{color:var(--ink)}.even{color:var(--ink2)}
.counting-diff{color:var(--g)!important}

/* ── old header is replaced by the top bar ── */
.hdr{display:none}

/* ── loading ── */
.ui-loading{padding:90px 20px;text-align:center;color:var(--ink2);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ui-spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--gl);border-top-color:var(--g);animation:uiSpin .8s linear infinite}
@keyframes uiSpin{to{transform:rotate(360deg)}}

/* ── passphrase gate → green welcome ── */
.gate{background-color:var(--g);background-image:var(--topo-tall),var(--grad);background-size:cover,100% 100%;padding:0;align-items:stretch}
.gate::before{display:none}
.gate-card{background:none;border:none;box-shadow:none;max-width:420px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18vh) 20px calc(40px + env(safe-area-inset-bottom,0px));color:#fff}
.gate-crest{width:64px;height:64px;border:none;background:none;margin:0 auto}
.gate-crest::before{display:none}
.gate-crest svg{width:64px;height:64px}
.gate-name{font-family:'Geist',sans-serif;font-style:normal;font-weight:600;font-size:40px;letter-spacing:-.035em;color:#fff;margin-top:22px}
.gate-sub{font-family:'Geist',sans-serif;font-size:14.5px;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.82);margin:8px 0 0}
.gate-input{height:52px;border-radius:16px;background:rgba(255,255,255,.14);border:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff;font-size:16px;padding:0 16px}
.gate-input::placeholder{color:rgba(255,255,255,.72)}
.gate-input:focus{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px #fff}
.gate-err{color:#fff;background:rgba(226,59,46,.9);border-radius:12px;padding:9px 12px;font-family:'Geist',sans-serif;font-size:13px}
.gate-btn{background:#fff!important;color:var(--g)!important;height:56px;font-size:15px;margin-top:10px}
.gate-top{text-align:center}
.gate-err{margin-bottom:0}
.gate-foot{font-family:'Geist',sans-serif;font-style:normal;font-size:12.5px;color:rgba(255,255,255,.72);text-align:center;margin-top:14px}

/* ── profile tab: the player page without the "back" crumb ── */
.ui-profile .back-nav{display:none}
.ui-foot{text-align:center;margin-top:18px}

/* emoji → line icons (screen content keeps its emoji until its own stage) */
.cr-strip-k{font-size:0;width:22px;height:22px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230E7A3E%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m4 8 4 3.5L12 5l4 6.5L20 8v10H4z%22/%3E%3C/svg%3E") center/22px no-repeat}
.cr-hero-k{font-size:0;height:30px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m4 8 4 3.5L12 5l4 6.5L20 8v10H4z%22/%3E%3C/svg%3E") center/30px no-repeat}
.cr-crownicon{font-size:0;height:34px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230E7A3E%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m4 8 4 3.5L12 5l4 6.5L20 8v10H4z%22/%3E%3C/svg%3E") center/34px no-repeat}
.medal-1,.medal-2,.medal-3{font-size:0!important}
.medal-1::after,.medal-2::after,.medal-3::after{font-size:13px;font-weight:600;color:var(--ink2)}
.medal-1::after{content:'1'}.medal-2::after{content:'2'}.medal-3::after{content:'3'}
.ui-tiles .ui-tile:last-child:nth-child(odd){grid-column:span 2;min-height:0}

/* ════════ STAGE 2 · Home, Rankings, Profile, Round history, Add player ════════ */
.ui-pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 12px}
.ui-btn-sm svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ui-btn-red{background:var(--redl);color:var(--red)}
.ui-seg-full{display:flex;width:100%}.ui-seg-full button{flex:1;height:44px;font-size:14px}
.ui-na{color:var(--ink3);font-weight:400}
.ui-star{font-style:normal;color:var(--g);font-size:.5em;vertical-align:super;margin-left:1px}
.ui-star.w{color:rgba(255,255,255,.8)}
.ui-strong{color:var(--ink);font-weight:600;font-size:15px}
.ui-av.lg{width:60px;height:60px;font-size:20px}
.ui-av svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ui-row svg.ui-chev.g{stroke:var(--g)}

/* movement */
.ui-mv{font-weight:600;white-space:nowrap}
.ui-mv.dn{color:var(--g)} .ui-mv.up{color:var(--red)}

/* rankings */
.ui-rrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px 10px 12px;background:#fff;border:none;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink)}
.ui-rrow:first-child{border-top:none}
.ui-rrow:active{background:var(--off)}
.ui-rrow.me{background:var(--gl);border-top-color:var(--gl)}
.ui-rrow.me + .ui-rrow{border-top-color:transparent}
.ui-rpos{width:16px;text-align:center;font-size:12.5px;color:var(--ink3);font-feature-settings:'tnum';flex-shrink:0}
.ui-rbig{font-weight:500;font-size:29px;letter-spacing:-.06em;font-feature-settings:'tnum';white-space:nowrap}
.ui-rbig.red{color:var(--red)}
.ui-rbig.sm{font-size:20px;letter-spacing:-.04em}
.ui-rk{width:92px;flex-shrink:0;font-size:12.5px;color:var(--ink2)}

/* home */
.ui-target{margin-top:18px;padding:13px 15px;border-radius:18px;background:#fff;box-shadow:var(--sh-card);font-size:14px;line-height:1.45;color:var(--ink)}
.ui-target b{font-weight:600}
.ui-target small{display:block;margin-top:4px;font-size:12px;color:var(--ink2)}
.ui-target.gw{background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#fff}
.ui-target.gw small{color:rgba(255,255,255,.78)}
.ui-duo.one{grid-template-columns:1fr}
.ui-tbig{font-weight:500;font-size:30px;letter-spacing:-.05em;margin-right:4px}
.ui-tile .v{display:flex;align-items:baseline;flex-wrap:wrap}
.ui-live{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;background:#fff;border:none;border-radius:22px;box-shadow:var(--sh-card);padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.ui-live .ui-pill{height:22px;font-size:11px}
.ui-live-t{font-weight:600;font-size:16px;letter-spacing:-.02em}
.ui-live-n{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:34px;font-weight:500;letter-spacing:-.05em}
.ui-live-n.red{color:var(--red)}
.ui-live-go{position:absolute;right:16px;bottom:14px;font-size:13.5px;font-weight:600;color:var(--g)}
.ui-home-body .ui-list .ui-row .ui-av.g svg{stroke:#fff}

/* profile */
.ui-phead{display:flex;align-items:center;gap:14px;margin:4px 2px 16px}
.ui-hicard{border-radius:24px;padding:16px 18px 16px;box-shadow:var(--sh-card);position:relative}
.ui-hic-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:rgba(255,255,255,.85)}
.ui-hic-sub{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:6px}
.ui-spark{display:block;width:100%;height:74px;margin-top:6px}
.ui-hicard{overflow:hidden}
.ui-spark-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);margin-left:0;pointer-events:none;display:none}
.ui-stat3{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);margin-top:12px}
.ui-stat3>div{padding:12px 14px;border-left:1px solid var(--line)}
.ui-stat3>div:first-child{border-left:none}
.ui-stat3 span{display:block;font-size:12px;color:var(--ink2)}
.ui-stat3 b{display:block;font-weight:500;font-size:27px;letter-spacing:-.05em;margin-top:2px}
.ui-badges{display:flex;flex-wrap:wrap;gap:7px}
.ui-badge{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:500;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}

/* head to head */
.ui-chips-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -2px 12px;padding:2px}
.ui-chips-x::-webkit-scrollbar{display:none}
.ui-chip.sm{height:32px;padding:0 12px;font-size:13px;flex-shrink:0}
.ui-h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center;margin:4px 0 8px}
.ui-h2h b{display:block;font-weight:500;font-size:44px;letter-spacing:-.06em;line-height:1}
.ui-h2h span{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px}
.ui-h2h .mid{padding:0 18px}.ui-h2h .mid b{font-size:24px;color:var(--ink3)}
.ui-h2hl{border-top:1px solid var(--line)}
.ui-h2hr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ui-h2hr:last-child{border-bottom:none}
.ui-h2hr .ui-mono{font-size:14px;color:var(--ink2)}
.ui-h2hr .ui-mono b{font-weight:500;color:var(--ink2)}
.ui-h2hr .ui-mono b.win{color:var(--g);font-weight:700}

/* round history */
.ui-alert{border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:12px;background:var(--off);color:var(--ink)}
.ui-alert.red{background:var(--redl);color:#9E2A20}
.ui-alert.red b{color:var(--red)}
.ui-alert-i{margin-top:6px;font-size:12.5px}
.ui-legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:0 4px 10px}
.ui-legend span{display:flex;align-items:center;gap:6px}
.ui-legend i{width:10px;height:10px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ui-legend i.g{background:var(--g);box-shadow:none}.ui-legend i.r{background:var(--red);box-shadow:none}
.ui-hist{background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;padding:4px 0}
.ui-hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 16px 9px 12px;background:none;border:none;text-align:left;cursor:pointer;color:var(--ink);position:relative;border-top:1px solid var(--line)}
.ui-hist>.ui-hrow:first-child{border-top:none}
.ui-hrow.cnt{background:var(--gl);border-top-color:#fff}
.ui-hrow.cnt::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--g)}
.ui-hrow.bad{background:var(--redl);border-top-color:#fff}
.ui-hrow.open{box-shadow:inset 0 -1px 0 var(--line)}
.ui-hpos{width:18px;text-align:center;font-size:12px;color:var(--ink3);flex-shrink:0;font-feature-settings:'tnum'}
.ui-hrow.cnt .ui-hpos{color:var(--g);font-weight:600}
.ui-hrow.bad .ui-hpos{color:var(--red);font-weight:700}
.ui-hrow em{font-style:normal;color:var(--red);font-weight:600}
.ui-hsc{font-weight:500;font-size:18px;letter-spacing:-.03em;min-width:34px;text-align:right;font-feature-settings:'tnum'}
.ui-hdf{font-family:'Geist Mono',monospace;font-size:13px;color:var(--ink2);min-width:42px;text-align:right}
.ui-hrow.cnt .ui-hdf{color:var(--g);font-weight:600}
.ui-hdet{padding:12px 16px 16px;background:var(--off)}
.ui-hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ui-hgrid span{display:block;font-size:11.5px;color:var(--ink2)}
.ui-hgrid b{display:block;font-weight:500;font-size:14px;margin-top:2px}
.ui-bd{margin-top:12px;padding:12px 14px;background:#fff;border-radius:14px;font-size:12.5px;line-height:1.5}
.ui-bd>b{display:block;font-weight:600;margin-bottom:6px}
.ui-bd p{color:var(--ink2);margin-bottom:6px}
.ui-bdr{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--ink2)}
.ui-bdr small{display:block;font-size:11px;color:var(--ink3)}
.ui-bdr span:last-child{font-family:'Geist Mono',monospace;color:var(--ink)}
.ui-bdr.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:600;color:var(--ink)}
.ui-cnt{margin-top:12px;font-size:12.5px;font-weight:600;color:var(--g)}
.ui-hact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

<!-- ── PASSPHRASE GATE (client-side; share the password with members) ── -->
<script>
(function(){
  // CHANGE THIS to your club's chosen password.
  // It's a casual gate so the URL isn't publicly editable —
  // not bank-grade security, but enough to keep strangers out.
  var CLUB_PASS = 'fairway';
  var AUTH_KEY  = 'whs_club_auth_v1';

  function isAuthed(){
    try { return localStorage.getItem(AUTH_KEY) === CLUB_PASS; }
    catch(e){ return false; }
  }

  window.LOGOUT_CLUB = function(){
    try { localStorage.removeItem(AUTH_KEY); } catch(e){}
    location.reload();
  };

  window.__SUBMIT_GATE = function(){
    var inp = document.getElementById('gate-pass');
    var err = document.getElementById('gate-err');
    if(!inp) return;
    if(inp.value === CLUB_PASS){
      try { localStorage.setItem(AUTH_KEY, CLUB_PASS); } catch(e){}
      var gate = document.getElementById('gate');
      if(gate){ gate.style.transition='opacity .25s'; gate.style.opacity='0'; setTimeout(function(){ gate.remove(); }, 260); }
    } else {
      err.textContent = 'Incorrect password. Ask a member.';
      err.style.display = 'block';
      inp.value=''; inp.focus();
    }
  };

  if(isAuthed()) return; // already in — let Firebase script run as usual

  var html =
    '<div id="gate" class="gate">'+
      '<div class="gate-card">'+
        '<div class="gate-top">'+
          '<div class="gate-crest"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="none" stroke="rgba(255,255,255,.4)"/><path d="M26 46V18l16 6-16 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg></div>'+
          '<div class="gate-name">The Club</div>'+
          '<div class="gate-sub">Members only &nbsp;·&nbsp; Lisbon &amp; London</div>'+
        '</div>'+
        '<div class="gate-form">'+
          '<input id="gate-pass" class="gate-input" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" />'+
          '<div id="gate-err" class="gate-err"></div>'+
          '<button class="gate-btn" type="button" onclick="__SUBMIT_GATE()">Enter</button>'+
          '<div class="gate-foot">Asked once per phone</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function(){
    var inp = document.getElementById('gate-pass');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); window.__SUBMIT_GATE(); }
      });
    }
  }, 50);
})();
</script>
