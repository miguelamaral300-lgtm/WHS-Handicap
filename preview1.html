function rd(v,d=1){return Math.round(v*Math.pow(10,d))/Math.pow(10,d);}
function calcDiff(score,cr,sl){return rd((score-cr)*113/sl);}
function fmtScore(s){return s===0?'E':s>0?`+${s}`:`${s}`;}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}
function scoreClass(s){return s<0?'under':s>0?'over':'even';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtCurrency(n){return'€'+n.toLocaleString('en-GB',{minimumFractionDigits:0});}

// Helper: compute current HI from a list of effective differentials.
// Used during chronological processing to determine HI for the 9-hole expected calc.
function priorHI(eff){
  if(eff.length===0)return 54.0;          // bootstrap: WHS max HI for brand-new player
  const r20=eff.slice(-20),cnt=r20.length;
  if(cnt<3)return 54.0;
  const e=WHS[Math.min(cnt,20)-3],n=e?e[1]:1;
  const sorted=[...r20].sort((a,b)=>a.d-b.d).slice(0,n);
  const avg=sorted.reduce((s,x)=>s+x.d,0)/n;
  return Math.min(avg,54);
}

// Which configuration a round was played in. '18' = full round, 'F9'/'L9' = a single nine,
// 'F9x2'/'L9x2' = the same nine twice. Rounds saved before the restructure carry no
// `holes` field, so we fall back to the legacy behaviour and infer it from the rating.
function cfgOf(s,c){
  if(s&&s.holes)return s.holes;
  if(c&&c.holes)return c.holes;
  return (c&&c.rating<40)?'F9':'18';
}
function isNineCfg(cfg){ return cfg==='F9'||cfg==='L9'; }
function cfgLabelOf(g){ return g==='18'?'a full round':g==='F9'?'a front nine':g==='L9'?'a back nine':g==='F9x2'?'a front nine played twice':g==='L9x2'?'a back nine played twice':g; }
// How many holes were actually scored in a configuration.
function holesScored(cfg){ return isNineCfg(cfg)?9:18; }
// A score has to be possible for the number of holes it claims. A 46 cannot be a full
// round and a 95 cannot be nine holes — that mismatch means the round is tagged wrong,
// and left alone it produces a nonsense differential that corrupts the whole record.
// Returns null when the round is sound, or a plain-English reason when it is not.
function roundIssue(s,c){
  if(!c)return 'course, tee or hole configuration no longer exists';
  const cfg=cfgOf(s,c), n=holesScored(cfg);
  const g=Number(s.score);
  if(!isFinite(g)||g<=0)return 'score is missing or not a number';
  // There is NO upper limit on a score. A bad day is a bad day and it belongs in the
  // record — an earlier version capped the differential at 60 and wrongly rejected a
  // legitimate 132. The gate exists only to catch rounds that cannot be true at all:
  // a nine filed as a full round, or vice versa.
  const par=c.par||(n===9?36:72);
  if(n===18&&g<par-10)return `${g} is too low for a full round at par ${par} — this looks like a nine-hole score`;
  if(n===9&&g>100)return `${g} is too high for nine holes — this looks like an 18-hole score`;
  if(n===9&&g<par-8)return `${g} is too low for nine holes at par ${par}`;
  const d=calcDiff(g,c.rating,c.slope);
  // Beating the course rating by five shots would make you a plus-five handicap; combined
  // with the checks above this reliably identifies a wrongly tagged round.
  if(d<-5)return `differential ${d.toFixed(1)} is impossible — the score and the number of holes do not match`;
  return null;
}
// Resolve a round to its rated course row. Prefers an exact course|tee|configuration
// match; falls back to course|tee so nothing recorded under the old model is lost.
function findCourse(courses,s){
  const cfg=s.holes||null;
  if(cfg){
    const exact=courses.find(c=>c.name===s.course&&c.tee===s.tee&&(c.holes||'18')===cfg);
    if(exact)return exact;
  }
  return courses.find(c=>c.name===s.course&&c.tee===s.tee)||null;
}
// Put a player's rounds in true playing order.
// WHS is sequential — the expected-score rules depend on what came before — so if a
// round is corrected or added out of order, the whole sequence must re-order with it.
// Sorting by date does that. It is only safe when EVERY round carries a date: with a
// mixed record, dated rounds would leap ahead of an undated history and corrupt the
// order, so in that case we fall back to entry order and flag it in the UI.
function scoresAllDated(scores){
  return (scores||[]).length>0 && scores.every(s=>s&&s.date&&!isNaN(new Date(s.date).getTime()));
}
function orderScores(scores){
  const arr=(scores||[]).map((s,i)=>({s,i}));
  if(!scoresAllDated(scores))return arr;                       // entry order
  return arr.sort((a,b)=>(new Date(a.s.date)-new Date(b.s.date))||(a.i-b.i));
}
function calcHI(scores,courses){
  scores=scores||[];
  const twoYearsAgo=new Date();twoYearsAgo.setFullYear(twoYearsAgo.getFullYear()-2);

  // ─── Build records in playing order, filtered to last 2 years ───
  const records=[];
  const issues={};
  orderScores(scores).forEach(({s,i})=>{
    const c=findCourse(courses,s);
    // A round that cannot be right is never allowed into the calculation. Silently using
    // it would distort every later nine-hole conversion as well as the index itself.
    const bad=roundIssue(s,c);
    if(bad){issues[i]=bad;return;}
    if(s.date){const sd=new Date(s.date);if(sd<twoYearsAgo)return;}
    const d=calcDiff(s.score,c.rating,c.slope);
    const is9=isNineCfg(cfgOf(s,c));
    records.push({i,d,is9});      // `i` stays the ORIGINAL index so the UI still lines up
  });

  // ─── Process records in insertion order, applying the OFFICIAL WHS 2024 rules ───
  //
  // OFFICIAL USGA FAQ (verbatim, also published by USGA's affiliated associations):
  //   "To establish a Handicap Index, a player must play and post a total of 54 holes,
  //    which can be made up of 9- and/or 18-hole scores. The use of expected score does
  //    not come into play until a golfer plays and posts 54 individual hole scores."
  //   "Once the player has posted scores from a total of 54 holes and an expected score
  //    can be determined for the player, an 18-hole Score Differential will be calculated
  //    for each 9-hole score and displayed within their scoring record. At this time the
  //    player will have established their initial Handicap Index."
  //
  // So:
  //   • Warm-up phase (first 54 holes posted): 18-hole rounds get standard 18-hole
  //     differentials; 9-hole rounds are stored as raw 9-hole differentials (no expected-
  //     score conversion yet, no Handicap Index yet).
  //   • At the 54-hole crossover: ALL stored 9-hole rounds get retroactively converted
  //     to 18-hole Score Differentials via the expected-score formula. The Handicap Index
  //     used for that conversion is computed from the just-accumulated record.
  //   • Post-warmup: 9-hole rounds use the 2024 expected-score formula immediately,
  //     based on the player's current HI.
  const eff=[];
  const meta={};
  let cumulativeHoles=0;
  let pendingNine=[];   // 9-hole rounds posted during warmup, awaiting retro conversion
  let warmupConverted=false;

  for(const r of records){
    const holes=r.is9?9:18;
    const inWarmup=cumulativeHoles<54;

    if(inWarmup){
      // WARM-UP — 9-hole rounds stored unconverted; 18-hole rounds direct
      if(r.is9){
        pendingNine.push(r);
        meta[r.i]={is9:true, ninehDiff:r.d, warmup:true, pendingConversion:true};
      }else{
        eff.push({i:r.i, d:r.d});
        meta[r.i]={is9:false, eighteenhDiff:r.d, warmup:true};
      }
    }else{
      // POST WARM-UP — 2024 expected-score formula for 9-hole rounds
      if(r.is9){
        const hi=priorHI(eff);
        const expected9=rd(0.52*hi+1.2);
        const dToInsert=rd(r.d+expected9);
        eff.push({i:r.i, d:dToInsert});
        meta[r.i]={is9:true, ninehDiff:r.d, expected:expected9, hiAtTime:rd(hi), eighteenhDiff:dToInsert, warmup:false};
      }else{
        eff.push({i:r.i, d:r.d});
        meta[r.i]={is9:false, eighteenhDiff:r.d, warmup:false};
      }
    }

    cumulativeHoles+=holes;

    // 54-hole crossover: retroactively convert every stored 9-hole round via expected-score.
    // The HI input is the player's initial Handicap Index, established at this moment.
    //  • If warm-up already contains ≥3 18-hole differentials, use those directly.
    //  • Otherwise (the initial period is mostly/entirely 9-hole rounds) there's nothing
    //    to bootstrap from, so derive a SELF-CONSISTENT initial HI by iteration: guess an
    //    HI, convert the pending 9-hole rounds, recompute the HI, and repeat until it
    //    stabilises. This avoids defaulting to the 54.0 cap, which would wrongly inflate a
    //    brand-new player's earliest rounds.
    if(!warmupConverted && cumulativeHoles>=54 && pendingNine.length>0){
      let warmupHI;
      if(eff.length>=3){
        warmupHI=priorHI(eff);
      }else{
        warmupHI=54.0;                      // initial guess
        for(let iter=0; iter<25; iter++){
          const ex=0.52*warmupHI+1.2;
          const trial=[...eff];
          pendingNine.forEach(s=>trial.push({i:s.i, d:rd(s.d+ex)}));
          const next=priorHI(trial);
          if(Math.abs(next-warmupHI)<0.01){ warmupHI=next; break; }
          warmupHI=next;
        }
      }
      const expected9=rd(0.52*warmupHI+1.2);
      for(const stored of pendingNine){
        const dToInsert=rd(stored.d+expected9);
        eff.push({i:stored.i, d:dToInsert});
        meta[stored.i]={
          is9:true, ninehDiff:stored.d, expected:expected9, hiAtTime:rd(warmupHI),
          eighteenhDiff:dToInsert, warmup:true, retroactivelyConverted:true
        };
      }
      pendingNine=[];
      warmupConverted=true;
    }
  }

  // ─── Take the most recent 20 effective differentials ───
  const r20=eff.slice(-20),cnt=r20.length;
  if(cnt<3)return{hi:null,count:cnt,n:0,countingIdx:new Set(),meta,window:r20,issues};
  const e=WHS[Math.min(cnt,20)-3],n=e?e[1]:1;
  const sorted=[...r20].sort((a,b)=>a.d-b.d);
  const counting=sorted.slice(0,n);
  const countingIdx=new Set(counting.map(x=>x.i));
  const avg=counting.reduce((s,x)=>s+x.d,0)/n;

  // `window` = the effective differentials in scoring order, oldest first. The oldest is
  // the one that drops out when the next round is posted.
  return{hi:rd(Math.min(avg,54)),count:cnt,n,avg:rd(avg,2),countingIdx,meta,window:r20,issues};
}

// ═══════════════════════════════════════════════════════════════════════════════
// PLAYER OF THE MONTH — the Crown Score
//
// Design constraints, in priority order:
//   1. Volume must not win it. Miguel has the only membership and plays ~4x more than
//      anyone else. Metrics therefore AVERAGE the month's rounds rather than taking a
//      "best 3" — a best-of format hands the frequent player a large edge purely from
//      sampling (at ~4.5 strokes of spread, best-3-of-15 runs ~6 strokes better than
//      best-3-of-3, which is bigger than the real spread of ability in this group).
//   2. Ability must not win it. Every metric is measured against the player's OWN
//      handicap, then RANKED, so a 6-handicap and a 37-handicap compete on level terms.
//   3. Everything must be inspectable. Each category exposes its raw value, rank and
//      points so "why did I lose" is answerable on screen.
// ═══════════════════════════════════════════════════════════════════════════════
const POTM_DEFAULTS={
  weights:{scoring:55,h2h:20,form:10,bonus:15},
  minRounds:2,          // rounds needed in the month to be ranked (4 weekends, short days)
  dropWorst:true,       // ignore your worst round once you've played 4+
  spoonBasis:'last',    // 'last' = bottom qualifier · 'fewest' = fewest rounds
  stake:5,              // the sum at stake each month
  currency:'€',
  stakeMode:'spoon',    // 'spoon' = spoon pays the winner · 'pot' = everyone buys in
  trial:true,           // trial month: everything computed, nothing owed
  pcc:true,             // adjust for playing conditions using shared rounds
  shrink:true,          // pull small samples toward the group average
  shrinkK:3,            // strength of that pull, in rounds
  shrinkCap:8,          // rounds beyond this earn no extra trust
  floorShare:0.15,      // last place in a category still scores this share, never zero
  h2hMinShared:1,       // shared rounds needed before head-to-head is scored
  h2hShrinkK:2,         // how hard a thin head-to-head record is pulled toward even
  settleDays:3          // days after month end before results lock
};
function potmSettings(){
  const raw=(S.potm&&S.potm.settings)||{};
  return {...POTM_DEFAULTS,...raw,weights:{...POTM_DEFAULTS.weights,...(raw.weights||{})}};
}
const potmYM=d=>String(d||'').slice(0,7);
function potmThisYM(){ return new Date().toISOString().slice(0,7); }
function potmMonthName(ym){
  const [y,m]=ym.split('-');
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][+m-1]+' '+y;
}
function potmMonthEnd(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);   // last day of that month
}
// Is this player entered for the month? Entry is per-month and locks when it begins.
function potmEnteredIn(pid,ym){
  const e=(S.potm&&S.potm.entries&&S.potm.entries[ym])||null;
  if(e&&e[pid]!==undefined)return !!e[pid];
  // no explicit entry: carry the previous month's choice forward
  const [y,m]=ym.split('-').map(Number);
  const prev=new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7);
  const pe=(S.potm&&S.potm.entries&&S.potm.entries[prev])||null;
  if(pe&&pe[pid]!==undefined)return !!pe[pid];
  return false;
}
// ── PRE-REGISTRATION ─────────────────────────────────────────────────────────
// Declaring intent before you tee off, as real WHS requires. It matters here because the
// Crown averages your month rather than taking your best rounds: that creates a reason
// not to post a bad card, and registering first removes it. It also records who played
// together, which is what head-to-head needs — inferring it from course-plus-date is
// guesswork.
//
// Outstanding rounds are treated leniently on purpose. Phones die, thunderstorms happen,
// people walk in after nine. A round left unfilled is shown publicly and blocks the
// bonus rate, but it is never scored as a disaster — punishing that would just stop
// people registering at all, which loses the mechanism entirely.
function potmRegs(){ return (S.potm&&S.potm.regs)||{}; }
function potmRegList(ym){
  const r=potmRegs();
  return Object.keys(r).map(id=>({id,...r[id]}))
    .filter(x=>!ym||potmYM(x.date)===ym)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||0)-(a.at||0));
}
// Has a registration been fulfilled by a posted round?
function potmRegMatched(reg,players){
  const p=(players||S.players||[]).find(x=>x.id===reg.pid);
  if(!p)return null;
  const hit=(p.scores||[]).find(sc=>sc.date===reg.date&&sc.course===reg.course&&sc.tee===reg.tee&&(sc.holes||'18')===reg.holes);
  return hit||null;
}
function potmRegState(reg,players){
  if(reg.cancelled)return 'cancelled';
  if(potmRegMatched(reg,players))return 'posted';
  const days=(Date.now()-new Date(reg.date+'T00:00:00Z').getTime())/86400000;
  return days>7?'outstanding':'awaiting';
}
// Rounds that were declared in advance, per player, for a month.
function potmDeclared(pid,ym){
  return potmRegList(ym).filter(r=>r.pid===pid&&!r.cancelled);
}

// Can entries still be changed for this month?
//   A future month is always open.
//   The CURRENT month is open only while the competition is in trial mode — otherwise a
//   player could see how the month was going before deciding to join, which is exactly
//   what the lock exists to prevent. During a trial there is nothing at stake, and the
//   feature itself arrives mid-month, so joining has to be possible or nobody can start.
//   Past months are closed.
function potmEntryOpen(ym){
  const now=potmThisYM();
  if(ym>now)return {open:true,reason:'future'};
  if(ym===now)return potmSettings().trial?{open:true,reason:'trial'}:{open:false,reason:'locked'};
  return {open:false,reason:'past'};
}
// Leaving a month already under way is never allowed, trial or not. Otherwise someone has
// a bad fortnight, quietly withdraws, and never loses.
function potmCanLeave(ym){ return ym>potmThisYM(); }

// Handicap Index as it stood immediately before a given date. Rounds dated on or after
// that date are withheld; undated rounds are historical so they always count. This is
// computed on demand rather than snapshotted, so a month can be settled retrospectively.
function potmIndexBefore(p,courses,isoDate){
  const sc=(p.scores||[]).filter(s=>!s.date||s.date<isoDate);
  const r=calcHI(sc,courses);
  return r?r.hi:null;
}
function potmIndexUpTo(p,courses,isoDate){
  const sc=(p.scores||[]).filter(s=>!s.date||s.date<=isoDate);
  const r=calcHI(sc,courses);
  return r?r.hi:null;
}
// The month's valid rounds. A round excluded by the plausibility gate never counts.
function potmRounds(p,courses,ym){
  const out=[];
  (p.scores||[]).forEach((s,i)=>{
    if(!s.date||potmYM(s.date)!==ym)return;
    const c=findCourse(courses,s);
    if(!c||roundIssue(s,c))return;
    const cfg=cfgOf(s,c);
    out.push({i,s,c,cfg,nine:isNineCfg(cfg),diff:calcDiff(s.score,c.rating,c.slope)});
  });
  return out;
}
// Shots better (negative) or worse (positive) than your own handicap, expressed per 18
// holes so nines and full rounds sit on one scale.
function potmVsHcp(r,index){
  if(index==null)return null;
  return r.nine ? rd(2*r.diff-index,2) : rd(r.diff-index,2);
}
// SCORING — the month's rounds averaged, worst dropped once you have 4+. Lower is better.
//
// Nines count as HALF a round. Doubling a nine's deviation puts it on an 18-hole scale
// but also doubles its noise: variance of a doubled nine is about twice that of a full
// round. Inverse-variance weighting therefore gives it half the weight — which happens to
// be the intuitive answer too. Without this, anyone playing a lot of nines (Jamor,
// Estoril) gets a bouncier score than someone playing eighteens, for no good reason.
function potmRoundWeight(r){ return r.nine?0.5:1; }
function potmScoring(rounds,index,st,pccAdj){
  if(!rounds.length||index==null)return null;
  // Neutralise the day's conditions where we could measure them.
  let set=rounds.map(r=>{
    const raw=potmVsHcp(r,index);
    const a=(pccAdj&&pccAdj[potmRoundKey(r)])||0;
    return {v:raw==null?null:rd(raw-a,2),w:potmRoundWeight(r)};
  }).filter(x=>x.v!=null);
  if(!set.length)return null;
  if(st.dropWorst&&set.length>=4){
    set=[...set].sort((a,b)=>a.v-b.v).slice(0,set.length-1);   // drop the single worst
  }
  const sw=set.reduce((a,x)=>a+x.w,0);
  if(!sw)return null;
  return rd(set.reduce((a,x)=>a+x.v*x.w,0)/sw,2);
}
// What the next round must produce for this player to reach a target average.
// Approximate by design — it assumes an 18-hole round and ignores the drop-worst rule.
function potmTargetForAvg(rounds,index,targetAvg,st,pccAdj){
  if(index==null)return null;
  const set=rounds.map(r=>{
    const raw=potmVsHcp(r,index);
    const a=(pccAdj&&pccAdj[potmRoundKey(r)])||0;
    return {v:raw==null?null:raw-a,w:potmRoundWeight(r)};
  }).filter(x=>x.v!=null);
  const sw=set.reduce((a,x)=>a+x.w,0), sv=set.reduce((a,x)=>a+x.v*x.w,0);
  const x=targetAvg*(sw+1)-sv;          // solve for a new round of weight 1
  return rd(x,2);
}
// FORM — percentage of index shed across the month. Deliberately only 10 points: it is
// driven largely by which old round ages out of the 20-round window, not by this month.
function potmForm(p,courses,ym){
  const a=potmIndexBefore(p,courses,ym+'-01');
  const b=potmIndexUpTo(p,courses,potmMonthEnd(ym));
  if(a==null||b==null||a<=0)return null;
  return rd((a-b)/a*100,2);
}
// BONUSES — RATE based, never counts, so playing more cannot inflate them.
//   70%  proportion of the month's rounds played at or inside your handicap
//   30%  a personal-best 18-hole gross set during the month
// A "lowest ever index" component was removed: it measured the same thing as Form and
// would have double-counted the same good month.
function potmBonus(p,courses,ym,index,rounds){
  if(!rounds.length||index==null)return null;
  const inside=rounds.filter(r=>{const v=potmVsHcp(r,index);return v!=null&&v<=0;}).length;
  // A declared round left unfilled counts against the rate as though it were outside your
  // handicap. It costs something without wrecking the month.
  const unfilled=potmDeclared(p.id,ym).filter(r=>potmRegState(r)==='outstanding').length;
  const rate=inside/(rounds.length+unfilled);
  const full=rounds.filter(r=>!r.nine);
  let pb=0;
  if(full.length){
    const bestThis=Math.min(...full.map(r=>r.s.score));
    const priorFull=(p.scores||[]).filter(x=>{
      if(!x.date||potmYM(x.date)>=ym)return false;
      const c=findCourse(courses,x);
      return c&&!roundIssue(x,c)&&!isNineCfg(cfgOf(x,c));
    }).map(x=>x.score);
    if(priorFull.length&&bestThis<Math.min(...priorFull))pb=1;
  }
  return rd(0.7*rate+0.3*pb,3);
}
// HEAD-TO-HEAD — only rounds two entrants played together: same course, same date, same
// hole configuration. Lower shots-vs-handicap wins the round.
function potmH2H(entrants,courses,ym,st){
  const data={};
  entrants.forEach(e=>{data[e.pid]={played:0,pts:0,rate:null,opponents:{}};});
  for(let a=0;a<entrants.length;a++){
    for(let b=a+1;b<entrants.length;b++){
      const A=entrants[a],B=entrants[b];
      A.rounds.forEach(ra=>{
        B.rounds.forEach(rb=>{
          // Same course, same day, same holes. Tees deliberately do NOT have to match:
          // a differential is already adjusted for the rating and slope of the tee played,
          // and each player is measured against their own handicap, so yellow against
          // white is a perfectly fair comparison. Requiring identical tees simply lost
          // real pairings.
          if(ra.s.date!==rb.s.date)return;
          if(ra.s.course!==rb.s.course)return;
          if(ra.cfg!==rb.cfg)return;
          const va=potmVsHcp(ra,A.indexStart), vb=potmVsHcp(rb,B.indexStart);
          if(va==null||vb==null)return;
          data[A.pid].played++; data[B.pid].played++;
          if(va<vb){data[A.pid].pts+=1;}
          else if(vb<va){data[B.pid].pts+=1;}
          else {data[A.pid].pts+=0.5;data[B.pid].pts+=0.5;}
          const recA=data[A.pid].opponents[B.pid]||(data[A.pid].opponents[B.pid]={w:0,l:0,h:0,margin:0});
          const recB=data[B.pid].opponents[A.pid]||(data[B.pid].opponents[A.pid]={w:0,l:0,h:0,margin:0});
          if(va<vb){recA.w++;recB.l++;} else if(vb<va){recB.w++;recA.l++;} else {recA.h++;recB.h++;}
          // Margin in net shots — the golf equivalent of goal difference. Positive means
          // you played that many shots better than them, relative to your own handicaps.
          const m=rd(vb-va,2);
          recA.margin=rd(recA.margin+m,2); recB.margin=rd(recB.margin-m,2);
          data[A.pid].margin=rd((data[A.pid].margin||0)+m,2);
          data[B.pid].margin=rd((data[B.pid].margin||0)-m,2);
        });
      });
    }
  }
  // A single shared round makes the raw win rate 100% or 0%, which would be a coin flip
  // worth a fifth of the competition. Rather than refuse to score it — which, for friends
  // in different countries, means the fairest category never counts at all — the rate is
  // pulled toward even in proportion to the evidence behind it. One round nudges the
  // needle; four move it properly. Same principle already used for Scoring.
  const k=st.h2hShrinkK==null?2:st.h2hShrinkK;
  Object.values(data).forEach(d=>{
    if(d.played<st.h2hMinShared){ d.rate=null; d.rawRate=null; return; }
    const raw=rd(d.pts/d.played*100,1);
    d.rawRate=raw;
    d.rate=rd(50+(raw-50)*(d.played/(d.played+k)),1);
  });
  return data;
}
// Share of a category's points by finishing position. Last still scores the floor, never
// zero — a zero makes the gap unrecoverable and kills interest by mid-month.
function potmShare(n,rank,floor){
  if(n<=1)return 1;
  return floor+(1-floor)*((n-rank)/(n-1));
}
// Rank a set of values, ties sharing the average position.
function potmRank(vals,lowerBetter){
  const idx=Object.keys(vals);
  const sorted=[...idx].sort((x,y)=>lowerBetter?vals[x]-vals[y]:vals[y]-vals[x]);
  const ranks={};
  let i=0;
  while(i<sorted.length){
    let j=i;
    while(j+1<sorted.length&&vals[sorted[j+1]]===vals[sorted[i]])j++;
    const avg=(i+1+j+1)/2;
    for(let k=i;k<=j;k++)ranks[sorted[k]]=avg;
    i=j+1;
  }
  return ranks;
}
// What is owed for a month, and by whom.
//   'spoon' — the bottom qualifier pays the winner. One transaction, both ends matter.
//   'pot'   — every qualifier buys in, the winner takes the pot.
// A void month (too few qualifiers) pays nobody and rolls its pot into the next month.
function potmPrevYM(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7);
}
function potmRollover(ym,depth){
  // sum the stakes of consecutive void months immediately before this one
  if((depth||0)>24)return 0;
  const prev=potmPrevYM(ym);
  const res=(S.potm&&S.potm.results&&S.potm.results[prev])||null;
  if(res){ return res.void ? (res.pot||0)+potmRollover(prev,(depth||0)+1) : 0; }
  return 0;
}
function potmMoney(r){
  const st=r.settings;
  const q=r.qualified.length;
  const rolled=potmRollover(r.ym);
  if(st.trial) return {trial:true,stake:st.stake,cur:st.currency,pot:0,rolled,owed:[],note:'Trial month — nothing is owed.'};
  if(r.void)   return {trial:false,stake:st.stake,cur:st.currency,pot:st.stake*Math.max(q,0)+rolled,rolled,owed:[],
                       note:'Month void — the pot rolls into next month.'};
  if(st.stakeMode==='pot'){
    const pot=st.stake*q+rolled;
    return {trial:false,stake:st.stake,cur:st.currency,pot,rolled,
      owed:r.qualified.map(e=>({from:e.name,fromId:e.pid,to:r.winner.name,toId:r.winner.pid,
                                amount:e.pid===r.winner.pid?0:st.stake})).filter(x=>x.amount>0),
      note:`Everyone in buys ${st.currency}${st.stake}. Winner takes ${st.currency}${pot}.`};
  }
  const amount=st.stake+rolled;
  return {trial:false,stake:st.stake,cur:st.currency,pot:amount,rolled,
    owed:(r.spoon&&r.winner&&r.spoon.pid!==r.winner.pid)?[{from:r.spoon.name,fromId:r.spoon.pid,
          to:r.winner.name,toId:r.winner.pid,amount}]:[],
    note:`Wooden spoon pays the winner ${st.currency}${amount}${rolled?` (includes ${st.currency}${rolled} rolled over)`:''}.`};
}

// ── PLAYING CONDITIONS ────────────────────────────────────────────────────────
// Real WHS neutralises the weather with a Playing Conditions Calculation: it looks at how
// the whole field scored that day and shifts every differential by -1 to +3. Six friends
// are not a field, but when two or more of you play the SAME course on the SAME day we
// have exactly the signal PCC uses, just less of it.
//
// So: take the group's median performance against their own handicaps for that round. If
// everyone played badly, the day was hard. Shrink that estimate by group size — two
// players prove little, four prove more — and cap it the way WHS does. A day cannot be
// declared more than 3 strokes hard or 1 stroke easy.
//
// This is the single largest source of unfairness in a competition spanning Portugal and
// the UK, and it is the only part of it we can actually measure.
function potmRoundKey(r){ return r.s.date+'|'+r.s.course+'|'+r.s.tee+'|'+r.cfg; }
function potmPCC(entrants,st){
  const groups={},adj={},detail=[];
  entrants.forEach(e=>e.rounds.forEach(r=>{
    const v=potmVsHcp(r,e.indexStart);
    if(v==null)return;
    const k=potmRoundKey(r);
    (groups[k]=groups[k]||[]).push({pid:e.pid,name:e.name,v});
  }));
  Object.keys(groups).forEach(k=>{
    const g=groups[k];
    if(g.length<2)return;                       // one player is no evidence at all
    const vals=g.map(x=>x.v).sort((a,b)=>a-b);
    const med=vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2;
    const shrink=g.length/(g.length+3);         // 2 players → 40%, 4 → 57%, 6 → 67%
    let a=med*shrink;
    a=Math.max(-1,Math.min(3,a));               // the WHS range, in the same direction
    a=rd(a,2);
    if(Math.abs(a)<0.2)return;                  // nothing worth adjusting
    adj[k]=a;
    detail.push({key:k,date:k.split('|')[0],course:k.split('|')[1],players:g.length,median:rd(med,2),adj:a});
  });
  return {adj,detail:detail.sort((x,y)=>y.date.localeCompare(x.date))};
}

// ── FAIRNESS DIAGNOSTICS ──────────────────────────────────────────────────────
// What Course Rating and Slope genuinely equalise, and what they do not.
//
// EQUALISED: course difficulty. A differential is designed to mean the same thing at
// Jamor (slope 105) as at Boavista (143). This is the whole point of the system and it
// works reasonably well.
//
// NOT EQUALISED, and worth being open about:
//   1. CONDITIONS. Real WHS applies a Playing Conditions Calculation using the day's
//      field scores, adjusting differentials by -1 to +3. Six friends are not a field,
//      so this app cannot compute it. An Algarve morning and a London February afternoon
//      produce differentials as though the weather were identical. This is the single
//      largest unfairness in a competition spanning two countries in winter.
//   2. SLOPE CALIBRATION. Slope is anchored on a "bogey golfer" of about 20. The further
//      from that you are, the less precisely it converts. At 6 and at 37 — both ends of
//      this group — hard courses are equalised least well.
//   3. COURSE FAMILIARITY. Knowing the lines and the greens is worth real strokes and
//      WHS never adjusts for it. It does, however, LARGELY CANCEL in this competition:
//      Scoring measures you against your own index, and your index is itself built from
//      the same courses. Play Jamor constantly and your index already reflects your
//      Jamor-familiar level, so beating it is correspondingly harder. The residual
//      asymmetry is that a narrow-course index makes AWAY rounds look worse.
//
// Head-to-head is the one category immune to all three: same course, same day, same
// weather, handicaps applied.
function potmFairness(r){
  const out=[];
  const allSlopes=[];
  r.qualified.forEach(e=>{
    const byCourse={};
    e.rounds.forEach(x=>{byCourse[x.s.course]=(byCourse[x.s.course]||0)+1;});
    const names=Object.keys(byCourse);
    const top=names.sort((a,b)=>byCourse[b]-byCourse[a])[0]||null;
    const conc=top?byCourse[top]/e.rounds.length:0;
    const slopes=e.rounds.map(x=>x.c.slope).filter(Boolean);
    slopes.forEach(v=>allSlopes.push(v));
    const nines=e.rounds.filter(x=>x.nine).length;
    out.push({pid:e.pid,name:e.name,rounds:e.rounds.length,courses:names.length,
      topCourse:top,topShare:rd(conc*100,0),
      slopeMin:slopes.length?Math.min(...slopes):null,
      slopeMax:slopes.length?Math.max(...slopes):null,
      nines,
      h2hPlayed:e.h2hMeta?e.h2hMeta.played:0});
  });
  const spread=allSlopes.length?Math.max(...allSlopes)-Math.min(...allSlopes):0;
  const anySingleCourse=out.some(x=>x.topShare>=70&&x.rounds>=3);
  const anyNoH2H=out.some(x=>x.h2hPlayed<r.settings.h2hMinShared);
  return {rows:out,slopeSpread:spread,anySingleCourse,anyNoH2H,
    wideSpread:spread>=25};
}
// Where two entrants played the SAME course in the month — not necessarily the same day.
// Weaker than head-to-head because conditions differ, but it strips out course difficulty
// entirely, so it is a useful cross-check on the main table.
function potmSameCourse(r){
  const byCourse={};
  r.qualified.forEach(e=>{
    e.rounds.forEach(x=>{
      const k=x.s.course;
      byCourse[k]=byCourse[k]||{};
      (byCourse[k][e.pid]=byCourse[k][e.pid]||{name:e.name,vals:[]}).vals.push(potmVsHcp(x,e.indexStart));
    });
  });
  const out=[];
  Object.keys(byCourse).forEach(k=>{
    const players=Object.keys(byCourse[k]);
    if(players.length<2)return;
    out.push({course:k,players:players.map(pid=>{
      const v=byCourse[k][pid].vals.filter(x=>x!=null);
      return {pid,name:byCourse[k][pid].name,n:v.length,
              avg:v.length?rd(v.reduce((a,b)=>a+b,0)/v.length,2):null};
    }).sort((a,b)=>(a.avg??99)-(b.avg??99))});
  });
  return out.sort((a,b)=>b.players.length-a.players.length);
}

// Once a month has been settled its result is frozen. Recomputing it later would let an
// edit to an old score silently change a result that has already been paid out.
function potmSettledRecord(ym){
  return (S.potm&&S.potm.results&&S.potm.results[ym])||null;
}
// ── SAMPLE-SIZE SHRINKAGE ─────────────────────────────────────────────────────
// Averaging is volume-neutral in expectation, but NOT in variance. Three rounds produce a
// far noisier average than twelve, so a small sample has a much better chance of throwing
// up a flattering number — and in a ranked competition, that is a real edge for whoever
// played least. Fixing volume without fixing this only moved the unfairness.
//
// The standard remedy is empirical-Bayes shrinkage: pull each average toward the group's
// own average by an amount set by how much evidence sits behind it.
//
//     shrunk = groupMean + (raw − groupMean) × n / (n + k)
//
// The prior is the group's actual mean this month, so it is self-calibrating rather than
// assuming what "average" ought to be. And n is CAPPED — reliability is rewarded up to a
// point and then stops, so nobody can simply out-play the field on volume.
function potmShrink(raw,n,groupMean,st){
  if(raw==null)return null;
  if(!st.shrink)return raw;
  const nEff=Math.min(n,st.shrinkCap||8);
  const k=st.shrinkK==null?3:st.shrinkK;
  return rd(groupMean+(raw-groupMean)*(nEff/(nEff+k)),2);
}
// Effective sample size, counting a nine as half a round — same logic as the weighting.
function potmSampleN(rounds){
  return rounds.reduce((a,r)=>a+potmRoundWeight(r),0);
}

// ── TIEBREAKS ─────────────────────────────────────────────────────────────────
// Two players can finish level: each category pays one of a small set of fixed shares,
// so identical totals are perfectly possible. Resolved the way a football table is —
// points first, then the head-to-head between the players involved, then margin.
//   1. Crown Score
//   2. Head to head between the two of them — if you beat him, you finish above him
//   3. Net margin across all their matches — golf's goal difference
//   4. Scoring — who played the better golf against their own handicap
//   5. Rounds played — turning up counts for something
// If all five are level it is a genuine dead heat, and the app says so rather than
// inventing a winner.
function potmTieBreak(a,b){
  if(a.total!==b.total)return {cmp:b.total-a.total,by:null};
  // head to head between these two specifically
  const ab=(a.h2hMeta&&a.h2hMeta.opponents||{})[b.pid];
  if(ab&&(ab.w!==ab.l))return {cmp:ab.l-ab.w,by:'head to head'};
  // margin across every match each played
  const am=(a.h2hMeta&&a.h2hMeta.margin)||0, bm=(b.h2hMeta&&b.h2hMeta.margin)||0;
  if(am!==bm)return {cmp:bm-am,by:'margin'};
  // better golf against their own handicap (lower is better)
  if(a.scoring!=null&&b.scoring!=null&&a.scoring!==b.scoring)return {cmp:a.scoring-b.scoring,by:'scoring'};
  // more rounds played
  if(a.rounds.length!==b.rounds.length)return {cmp:b.rounds.length-a.rounds.length,by:'rounds played'};
  return {cmp:0,by:'dead heat'};
}

// The whole month, computed from scratch.
function potmCompute(ym){
  const st=potmSettings(), courses=S.courses||[];
  const entrants=(S.players||[]).filter(p=>potmEnteredIn(p.id,ym)).map(p=>{
    const indexStart=potmIndexBefore(p,courses,ym+'-01');
    const rounds=potmRounds(p,courses,ym);
    return {pid:p.id,name:p.name,indexStart,rounds,
            indexEnd:potmIndexUpTo(p,courses,potmMonthEnd(ym))};
  });
  const h2h=potmH2H(entrants,courses,ym,st);
  const pcc = st.pcc ? potmPCC(entrants,st) : {adj:{},detail:[]};
  entrants.forEach(e=>{
    e.qualified = e.rounds.length>=st.minRounds && e.indexStart!=null;
    e.scoringRaw = potmScoring(e.rounds,e.indexStart,st);              // before conditions
    e.scoring = potmScoring(e.rounds,e.indexStart,st,pcc.adj);         // after conditions
    e.sampleN = potmSampleN(e.rounds);
    e.form    = potmForm((S.players||[]).find(p=>p.id===e.pid),courses,ym);
    e.bonus   = potmBonus((S.players||[]).find(p=>p.id===e.pid),courses,ym,e.indexStart,e.rounds);
    e.h2h     = h2h[e.pid]?h2h[e.pid].rate:null;
    e.h2hMeta = h2h[e.pid]||{played:0,pts:0};
  });
  const q=entrants.filter(e=>e.qualified);
  // Shrink the scoring metric toward the qualifiers' own mean, weighted by evidence.
  if(q.length){
    const withVals=q.filter(e=>e.scoring!=null);
    if(withVals.length){
      const gm=rd(withVals.reduce((a,e)=>a+e.scoring,0)/withVals.length,3);
      q.forEach(e=>{
        e.scoringUnshrunk=e.scoring;
        e.scoring=potmShrink(e.scoring,e.sampleN,gm,st);
      });
      q.groupMean=gm;
    }
  }
  const cats=[
    {key:'scoring',w:st.weights.scoring,lower:true},
    {key:'h2h',    w:st.weights.h2h,    lower:false},
    {key:'form',   w:st.weights.form,   lower:false},
    {key:'bonus',  w:st.weights.bonus,  lower:false}
  ];
  // rank inside each category, among the qualifiers who have a value for it
  cats.forEach(c=>{
    const vals={};
    q.forEach(e=>{ if(e[c.key]!=null)vals[e.pid]=e[c.key]; });
    c.n=Object.keys(vals).length;
    c.ranks=c.n?potmRank(vals,c.lower):{};
  });
  // award points; a category a player cannot be scored in has its weight redistributed
  // across their remaining categories, so nobody is punished for missing data
  q.forEach(e=>{
    e.cat={};
    const scored=cats.filter(c=>e[c.key]!=null&&c.ranks[e.pid]!==undefined);
    const missedW=cats.filter(c=>!scored.includes(c)).reduce((a,c)=>a+c.w,0);
    const scoredW=scored.reduce((a,c)=>a+c.w,0)||1;
    scored.forEach(c=>{
      const w=c.w+(missedW*c.w/scoredW);      // proportional redistribution
      const share=potmShare(c.n,c.ranks[e.pid],st.floorShare);
      e.cat[c.key]={value:e[c.key],rank:c.ranks[e.pid],of:c.n,weight:rd(w,1),points:rd(w*share,1)};
    });
    cats.filter(c=>!scored.includes(c)).forEach(c=>{ e.cat[c.key]={value:null,rank:null,of:c.n,weight:0,points:0}; });
    e.total=rd(Object.values(e.cat).reduce((a,x)=>a+x.points,0),1);
    e.redistributed=missedW>0;
  });
  q.sort((a,b)=>potmTieBreak(a,b).cmp);
  // note where a tie actually had to be broken, so the table can explain itself
  for(let i=1;i<q.length;i++){
    if(q[i].total===q[i-1].total){
      const tb=potmTieBreak(q[i-1],q[i]);
      q[i-1].tieBroke=tb.by; q[i].tieBroke=tb.by;
    }
  }
  // spoon
  let spoon=null;
  if(q.length>=2){
    if(st.spoonBasis==='fewest'){
      const pool=[...entrants].sort((a,b)=>a.rounds.length-b.rounds.length);
      spoon=pool.length?pool[0]:null;
    }else{
      spoon=q[q.length-1];
    }
  }
  const settleFrom=new Date(potmMonthEnd(ym)+'T00:00:00Z');
  settleFrom.setUTCDate(settleFrom.getUTCDate()+st.settleDays);
  const locked=new Date()>settleFrom;
  const out={ym,settings:st,entrants,qualified:q,
          notQualified:entrants.filter(e=>!e.qualified),
          winner:q.length?q[0]:null,spoon,
          void:q.length<3, locked,
          settleDate:settleFrom.toISOString().slice(0,10)};
  out.pcc=pcc;
  out.money=potmMoney(out);
  out.settled=!!(S.potm&&S.potm.results&&S.potm.results[ym]);
  out.record=(S.potm&&S.potm.results&&S.potm.results[ym])||null;
  return out;
}

// A one-line nudge on the Rankings screen. The competition is invisible unless someone
// goes looking for it, and that was the main reason to build this at all.
function renderCrownStrip(){
  const ym=potmThisYM();
  const rec=potmSettledRecord(ym);
  if(rec)return '';
  let r;
  try{ r=potmCompute(ym); }catch(e){ return ''; }
  if(!r.entrants.length)return '';
  if(!r.qualified.length){
    const need=r.settings.minRounds;
    return `<div class="cr-strip" onclick="SV('crown')">
      <span class="cr-strip-k">👑</span>
      <span><b>${potmMonthName(ym).split(' ')[0]} Crown</b> — ${r.entrants.length} entered, nobody has reached ${need} rounds yet</span>
      <span class="cr-strip-go">›</span></div>`;
  }
  const lead=r.qualified[0];
  const second=r.qualified[1];
  const gap=second?rd(lead.total-second.total,1):null;
  return `<div class="cr-strip" onclick="SV('crown')">
    <span class="cr-strip-k">👑</span>
    <span><b>${potmMonthName(ym).split(' ')[0]} Crown</b> — ${lead.name} leads on ${lead.total.toFixed(1)}${second?`, ${gap} clear of ${second.name}`:''}</span>
    <span class="cr-strip-go">›</span></div>`;
}

function crownSec(id,title,sub,body,open){
  if(!body)return '';
  const isOpen=CROWN_SEC===id;
  return `<div class="cs">
    <button class="cs-h" onclick="CROWN_SEC_TOGGLE('${id}')">
      <span class="cs-t">${title}</span>
      <span class="cs-s">${sub||''}</span>
      <span class="cs-c">${isOpen?'▲':'▼'}</span>

    ${isOpen?`<div class="cs-b">${body}</div>`:''}
  </div>`;
}
function renderCrown(){
  const st=potmSettings();
  const ym=CROWN_YM||potmThisYM();
  const frozen=potmSettledRecord(ym);
  const head=(subtitle)=>`<div class="cr-head">
      <button class="cr-nav" onclick="CROWN_STEP(-1)">‹</button>
      <div><div class="cr-title">${potmMonthName(ym)}</div><div class="cr-sub">${subtitle}</div></div>
      <button class="cr-nav" ${ym>=potmThisYM()?'disabled':''} onclick="CROWN_STEP(1)">›</button>
    </div>`;

  // ── a settled month is shown exactly as it was settled ──
  if(frozen&&ym<potmThisYM()){
    let fh=`<div class="cr-wrap">`+head('Final');
    if(frozen.void){
      fh+=`<div class="cr-void">Void — too few players reached the minimum. The pot rolled forward.</div>`;
    }else{
      fh+=`<div class="cr-hero"><div class="cr-hero-k">👑</div>
        <div class="cr-hero-n">${frozen.winner}</div>
        <div class="cr-hero-s">${(frozen.total||0).toFixed(1)}</div>

      if((frozen.owed||[]).length)fh+=`<div class="cr-paid">${frozen.owed.map(o=>`${o.from} → ${o.to} <b>${frozen.currency||''}${o.amount}</b>`).join(' · ')} · settled</div>`;
      fh+=`<div class="cr-board">${(frozen.standings||[]).map((x,i)=>`
        <div class="cr-b-row${i===0?' lead':''}"><span class="cr-b-pos">${i+1}</span>
        <span class="cr-b-nm">${x.name}</span><span class="cr-b-rd">${x.rounds}</span>
        <span class="cr-b-tot">${x.total.toFixed(1)}</span></div>`).join('')}</div>`;
      fh+=`<button class="cr-ghost" onclick="CROWN_SHARE('${ym}')">Share result</button>`;
    }
    return fh+`</div>`;
  }

  const r=potmCompute(ym);
  let h=`<div class="cr-wrap">`+head(r.locked?'Final':'Live');

  if(!r.entrants.length){
    return h+`<div class="cr-empty"><div style="font-size:30px;margin-bottom:8px">👑</div>
      Nobody has entered ${potmMonthName(ym).split(' ')[0]} yet.</div>
      ${crownSec('entries','Entries','tap to set who is in',crownEntries(r,st,ym),true)}</div>`;
  }

  // ── hero: who is winning ──
  if(r.winner){
    const M=r.money;
    h+=`<div class="cr-hero">
      <div class="cr-hero-k">👑</div>
      <div class="cr-hero-n">${r.winner.name}</div>
      <div class="cr-hero-s">${r.winner.total.toFixed(1)}<span>/100</span></div>
      ${r.spoon&&r.spoon.pid!==r.winner.pid?`<div class="cr-hero-sp">🥄 ${r.spoon.name}</div>`:''}
      <div class="cr-hero-m">${M.trial?'Trial month — nothing at stake':(M.owed.length?`${M.owed[0].from} pays ${M.owed[0].to} ${M.cur}${M.owed[0].amount}`:`${M.cur}${M.pot} at stake`)}</div>
    </div>`;
  }else{
    h+=`<div class="cr-empty">No qualifiers yet — ${st.minRounds} rounds needed.</div>`;
  }

  // ── the board: one row each, a bar showing where points came from ──
  const COLS={scoring:'#C9A84C',h2h:'#6E9E5C',form:'#5C97B8',bonus:'#B08FC7'};
  if(r.qualified.length){
    h+=`<div class="cr-board">`;
    r.qualified.forEach((e,i)=>{
      const segs=['scoring','h2h','form','bonus'].map(k=>{
        const c=e.cat[k]; if(!c||!c.points)return '';
        return `<span style="width:${c.points}%;background:${COLS[k]}"></span>`;
      }).join('');
      h+=`<div class="cr-b-row${i===0?' lead':''}" onclick="CROWN_DETAIL('${e.pid}')">
        <span class="cr-b-pos">${i+1}</span>
        <span class="cr-b-nm">${e.name}<span class="cr-b-bar">${segs}</span></span>
        <span class="cr-b-rd">${e.rounds.length}</span>
        <span class="cr-b-tot">${e.total.toFixed(1)}${e.tieBroke?`<span class="cr-tb" title="separated on ${e.tieBroke}">*</span>`:''}</span></div>`;
      if(CROWN_OPEN===e.pid)h+=crownDetail(e,r,st,i);
    });
    h+=`</div>`;
    const broke=r.qualified.filter(e=>e.tieBroke);
    if(broke.length)h+=`<div class="cr-tbnote">* level on points — separated on <b>${broke[0].tieBroke}</b></div>`;
    h+=`<div class="cr-key">${Object.keys(COLS).map(k=>`<span><i style="background:${COLS[k]}"></i>${({scoring:'Scoring',h2h:'Head to head',form:'Form',bonus:'Bonus'})[k]}</span>`).join('')}</div>`;
  }
  if(r.notQualified.length){
    h+=`<div class="cr-waiting">${r.notQualified.map(e=>`<span>${e.name} <b>${e.rounds.length}/${st.minRounds}</b></span>`).join('')}</div>`;
  }
  if(r.winner)h+=`<button class="cr-ghost" onclick="CROWN_SHARE('${ym}')">Share standings</button>`;

  // ── everything else, folded away ──
  h+=crownSec('entries','Entries',`${r.entrants.length} in`,crownEntries(r,st,ym));
  h+=crownSec('declared','Declared rounds',`${potmRegList(ym).filter(x=>!x.cancelled).length}`,crownDeclared(ym));
  h+=crownSec('h2h','Head to head','who beat whom',crownMatrix(r));
  h+=crownSec('fair','Fairness','what is levelled out',crownFair(r,st));
  h+=crownSec('honour','Roll of honour','past winners',crownHonour());
  h+=crownSec('rules','How it is scored',`${st.weights.scoring}/${st.weights.h2h}/${st.weights.form}/${st.weights.bonus}`,crownRules(st));
  h+=`<button class="cr-ghost" onclick="OM('crownset')">Settings</button>`;
  return h+`</div>`;
}

// ── the pieces, each returning plain markup ──
function crownDetail(e,r,st,i){
  const CAT={scoring:['Scoring','shots vs your handicap',true],h2h:['Head to head','% won',false],
             form:['Form','% index change',false],bonus:['Bonus','rate',false]};
  const fmt=(k,v)=>v==null?'—':k==='scoring'?(v>0?'+':'')+v.toFixed(2):k==='h2h'?v.toFixed(0)+'%':k==='form'?(v>0?'+':'')+v.toFixed(2)+'%':(v*100).toFixed(0)+'%';
  let d=`<div class="cr-det">`;
  Object.keys(CAT).forEach(k=>{
    const c=e.cat[k],m=CAT[k];
    d+=`<div class="cr-d-row"><span class="cr-d-n">${m[0]}</span>
      <span class="cr-d-v">${fmt(k,c?c.value:null)}</span>
      <span class="cr-d-r">${c&&c.rank?`${c.rank===Math.floor(c.rank)?c.rank:c.rank.toFixed(1)}/${c.of}`:'—'}</span>
      <span class="cr-d-p">${c?c.points.toFixed(1):'0'}</span></div>`;
  });
  const above=r.qualified[i-1];
  if(above&&e.cat.scoring&&above.cat.scoring&&e.indexStart!=null){
    const need=potmTargetForAvg(e.rounds,e.indexStart,above.cat.scoring.value,st,r.pcc&&r.pcc.adj);
    if(need!=null)d+=`<div class="cr-goal">Next round around <b>${need>0?'+':''}${need.toFixed(1)}</b> to pass ${above.name}</div>`;
  }else if(!above)d+=`<div class="cr-goal">Leading.</div>`;
  return d+`</div>`;
}
function crownEntries(r,st,ym){

    +(S.players||[]).map(p=>{

      return `<div class="cr-erow"><span class="cr-enm">${p.name}</span>
        <button class="cr-etog${inIt?' on':''}${locked?' fixed':''}" onclick="CROWN_TOGGLE('${target}','${p.id}')">${inIt?(locked?'In ✓':'In'):'Out'}</button></div>`;

}
function crownDeclared(ym){

function crownMatrix(r){
  const st=r.settings;
  const any=r.qualified.some(e=>e.h2hMeta&&Object.keys(e.h2hMeta.opponents||{}).length);
  if(!any)return `<div class="cs-note">No two entrants have played the same course on the same day yet. A pairing is found automatically — same course, same date, same number of holes. Tees can differ.</div>`;
  const short=r.qualified.filter(e=>e.h2hMeta&&e.h2hMeta.played>0&&e.h2hMeta.played<st.h2hMinShared);
  const thin=r.qualified.filter(e=>e.h2hMeta&&e.h2hMeta.played>0&&e.h2hMeta.rawRate!=null&&e.h2hMeta.rawRate!==e.h2hMeta.rate);
  let note='';
  if(short.length)note+=`<div class="cs-note">${short.map(e=>`${e.name} has ${e.h2hMeta.played} shared round${e.h2hMeta.played===1?'':'s'}`).join(', ')} — ${st.h2hMinShared} needed before this scores.</div>`;
  note+=`<div class="cs-note">Small figure is the net margin in shots — golf's goal difference. It never decides the category, only separates players who finish level.</div>`;
  if(thin.length)note+=`<div class="cs-note">${thin.map(e=>`${e.name.split(' ')[0]} ${e.h2hMeta.rawRate}% → <b>${e.h2hMeta.rate}%</b> (${e.h2hMeta.played} shared)`).join(' · ')}<br>A thin record is pulled toward even, so one round counts without deciding the month. Play together more and it carries full weight.</div>`;
  return `<div class="cr-h2hwrap"><div class="cr-h2h"><div class="cr-h2h-c cr-h2h-hd"></div>${r.qualified.map(o=>`<div class="cr-h2h-c cr-h2h-hd">${o.name.split(' ')[0].slice(0,4)}</div>`).join('')}</div>
    ${r.qualified.map(e=>`<div class="cr-h2h"><div class="cr-h2h-c cr-h2h-nm">${e.name.split(' ')[0]}</div>
      ${r.qualified.map(o=>{
        if(o.pid===e.pid)return `<div class="cr-h2h-c cr-h2h-self">—</div>`;
        const rec=(e.h2hMeta.opponents||{})[o.pid];
        if(!rec)return `<div class="cr-h2h-c" style="color:var(--text3)">·</div>`;
        const mg=rec.margin||0;
        return `<div class="cr-h2h-c ${rec.w>rec.l?'win':rec.l>rec.w?'loss':'draw'}">${rec.w}–${rec.l}<span class="cr-mg">${mg>0?'+':''}${mg.toFixed(1)}</span></div>`;
      }).join('')}</div>`).join('')}</div>`+note;
}
function crownFair(r,st){

    ${fx.rows.map(x=>`<div class="cr-h2h"><div class="cr-h2h-c cr-h2h-nm" style="min-width:70px">${x.name}</div>
      <div class="cr-h2h-c">${x.rounds}</div><div class="cr-h2h-c">${x.courses}</div>
      <div class="cr-h2h-c">${x.slopeMin!=null?(x.slopeMin===x.slopeMax?x.slopeMin:x.slopeMin+'–'+x.slopeMax):'—'}</div></div>`).join('')}</div>`;
  const sc=potmSameCourse(r);

      d+=`<div class="cs-note" style="margin-top:6px"><b>${c.course}</b> — ${c.players.map(p=>`${p.name} ${p.avg>0?'+':''}${p.avg.toFixed(1)}`).join(' · ')}</div>`;
    });
  }
  return d;
}
function crownHonour(){
  const res=(S.potm&&S.potm.results)||{};
  const past=Object.keys(res).filter(k=>!res[k].void);
  if(!past.length)return `<div class="cs-note">No months settled yet.</div>`;
  const crowns={},spoons={};
  past.forEach(k=>{const x=res[k];
    if(x.winner)crowns[x.winner]=(crowns[x.winner]||0)+1;
    if(x.spoon)spoons[x.spoon]=(spoons[x.spoon]||0)+1;});
  const names=[...new Set([...Object.keys(crowns),...Object.keys(spoons)])];
  return names.sort((a,b)=>(crowns[b]||0)-(crowns[a]||0)).map(nm=>
    `<div class="cr-erow"><span class="cr-enm">${nm}</span>
     <span>${'👑'.repeat(Math.min(crowns[nm]||0,5))}${(crowns[nm]||0)>5?` ×${crowns[nm]}`:''} ${'🥄'.repeat(Math.min(spoons[nm]||0,3))}</span></div>`).join('');
}
function crownRules(st){
  const W={scoring:['Scoring','your rounds averaged against your own handicap, worst dropped from 4+, a nine counting as half'],
           h2h:['Head to head','win rate against others in the same round'],
           form:['Form','how much your index came down'],
           bonus:['Bonus','share of rounds inside your handicap, plus personal bests']};
  return Object.keys(W).map(k=>`<div class="cr-w"><b>${st.weights[k]}</b> ${W[k][0]} — ${W[k][1]}</div>`).join('')
   +`<div class="cs-sub">If two finish level</div>
     <div class="cs-note">Settled like a league table: the head to head between those two, then net margin across all their matches, then who played better against their own handicap, then rounds played. If all of that is level it is called a dead heat.</div>`
   +`<div class="cs-note" style="margin-top:8px">Each category is ranked, so every handicap competes equally. Last place still scores ${Math.round(st.floorShare*100)}%. Rounds are averaged, never cherry-picked — playing more can't improve your score.</div>`;
}

// ── LIFETIME STATS ────────────────────────────────────────────────────────────
// Compute fun all-time stats from a player's scores + the course catalogue.
function calcPlayerStats(p,courses){
  if(!p.scores||!p.scores.length)return null;

  let bestGross=null, bestDiff=null;
  const counts={};
  p.scores.forEach(s=>{
    const c=findCourse(courses,s);if(!c)return;
    const is18=!isNineCfg(cfgOf(s,c));
    counts[s.course]=(counts[s.course]||0)+1;
    if(is18){
      if(!bestGross||s.score<bestGross.score) bestGross={score:s.score,course:s.course,date:s.date||null};
      const d=calcDiff(s.score,c.rating,c.slope);
      if(bestDiff===null||d<bestDiff.d) bestDiff={d,course:s.course,date:s.date||null};
    }
  });

  // Lowest HI ever — replay history round-by-round.
  let lowestHI=null, lowestHIAt=null;
  for(let i=3;i<=p.scores.length;i++){
    const r=calcHI(p.scores.slice(0,i),courses);
    if(r.hi!==null&&(lowestHI===null||r.hi<lowestHI)){
      lowestHI=r.hi; lowestHIAt=i;
    }
  }

  // Most-played course. Count against the resolved course row, so the same club recorded
  // under different spellings still tallies as one place.
  const topCourses=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>({name:k,n:v}));
  const favCourse=topCourses.length?topCourses[0].name:null;
  const favCount=topCourses.length?topCourses[0].n:0;

  // Recent form — avg differential over last 5 valid 18-hole rounds
  const valid=[];
  p.scores.forEach(s=>{
    const c=findCourse(courses,s);if(!c||isNineCfg(cfgOf(s,c)))return;
    valid.push(calcDiff(s.score,c.rating,c.slope));
  });
  const recentForm = valid.length>=3
    ? rd(valid.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,valid.length),1)
    : null;

  return {bestGross,bestDiff,lowestHI,lowestHIAt,favCourse,favCount,topCourses,recentForm};
}

// ── HANDICAP TREND CHART (hand-drawn SVG, matches the gold/forest palette) ──
function renderHITrendChart(p,courses){
  const pts=[];
  if(!p.scores) return '';
  const ord=orderScores(p.scores).map(x=>x.s);   // walk the record in playing order
  for(let i=3;i<=ord.length;i++){
    const r=calcHI(ord.slice(0,i),courses);
    if(r.hi!==null) pts.push({n:i,hi:r.hi});
  }
  if(pts.length<2) return ''; // need at least two points to draw a line

  const W=700, H=200, padL=42, padR=18, padT=22, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const minV=Math.min(...pts.map(p=>p.hi));
  const maxV=Math.max(...pts.map(p=>p.hi));
  const span=Math.max(1, maxV-minV);
  // Add 10% breathing room top/bottom
  const yMin=minV - span*0.1, yMax=maxV + span*0.1, yRange=yMax-yMin;
  const xAt=i=>padL + (pts.length===1?iw/2 : (i/(pts.length-1))*iw);
  const yAt=v=>padT + ((yMax-v)/yRange)*ih;

  // Y-axis ticks (5)
  const ticks=[];
  for(let k=0;k<=4;k++){
    const v=yMax-(yRange*k/4);
    const yy=padT+(ih*k/4);
    ticks.push(
      `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="rgba(201,168,76,0.08)"/>`+
      `<text x="${padL-7}" y="${yy+3}" text-anchor="end" fill="#605848" font-size="9" font-family="Barlow,sans-serif">${v.toFixed(1)}</text>`
    );
  }

  // Line + gradient fill underneath
  const linePts=pts.map((p,i)=>`${xAt(i).toFixed(1)},${yAt(p.hi).toFixed(1)}`).join(' ');
  const fillPts=`${padL},${padT+ih} ${linePts} ${(padL+iw).toFixed(1)},${padT+ih}`;

  const dots=pts.map((p,i)=>{
    const cx=xAt(i).toFixed(1), cy=yAt(p.hi).toFixed(1);
    const isLast=i===pts.length-1;
    return isLast
      ? `<circle cx="${cx}" cy="${cy}" r="5" fill="rgba(201,168,76,0.18)"/><circle cx="${cx}" cy="${cy}" r="3" fill="#E0C870"/>`
      : `<circle cx="${cx}" cy="${cy}" r="2.2" fill="#C9A84C"/>`;
  }).join('');

  const last=pts[pts.length-1];
  const lastLabel=`<text x="${(xAt(pts.length-1)-8).toFixed(1)}" y="${(yAt(last.hi)-10).toFixed(1)}" text-anchor="end" fill="#E0C870" font-size="11" font-family="'Cormorant Garamond',serif" font-style="italic" font-weight="600">${last.hi.toFixed(1)}</text>`;

  return `
  <div class="trend-card">
    <div class="trend-head">
      <span class="trend-title">Handicap Trend</span>
      <span class="trend-sub">${pts.length} data points · current ${last.hi.toFixed(1)}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:auto;display:block">
      <defs>
        <linearGradient id="trendFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${ticks.join('')}
      <polygon points="${fillPts}" fill="url(#trendFill)"/>
      <polyline points="${linePts}" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${lastLabel}
      <text x="${padL}" y="${H-9}" fill="#605848" font-size="9" font-family="Barlow,sans-serif" letter-spacing="1">RD ${pts[0].n}</text>
      <text x="${W-padR}" y="${H-9}" text-anchor="end" fill="#605848" font-size="9" font-family="Barlow,sans-serif" letter-spacing="1">RD ${last.n}</text>
    </svg>
  </div>`;
}

function daysUntil(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr),now=new Date();

  return Math.round((d-now)/(1000*60*60*24));
}

// ── PURSE CALCULATIONS ────────────────────────────────────────────────────────
function calcPurse(){
  const earnings={};
  S.players.forEach(p=>{earnings[p.id]={
    id:p.id,name:p.name,
    totalEarned:0,totalBuyIn:0,pnl:0,
    wins:0,events:0,history:[]
  };});
  S.tournaments.forEach(t=>{
    const emap=t.earnings||{};
    const bmap=t.buyins||{};
    S.players.forEach(p=>{
      const earned=emap[p.id]||0;
      const buyin=bmap[p.id]||0;
      if(!earnings[p.id])return;
      if(earned>0){
        earnings[p.id].totalEarned+=earned;
      }
      if(buyin>0){
        earnings[p.id].totalBuyIn+=buyin;
      }
      if(earned>0||buyin>0){
        earnings[p.id].history.push({
          tournament:t.name,date:t.date,
          earned,buyin,pnl:earned-buyin
        });
      }
    });
    // Legacy prize format
    if(!Object.keys(emap).length&&t.prize&&t.winnerId&&earnings[t.winnerId]){
      earnings[t.winnerId].totalEarned+=t.prize;
      earnings[t.winnerId].history.push({tournament:t.name,date:t.date,earned:t.prize,buyin:0,pnl:t.prize});
    }
    if(t.winnerId&&earnings[t.winnerId])earnings[t.winnerId].wins+=1;
    t.entries.forEach(e=>{if(earnings[e.playerId])earnings[e.playerId].events+=1;});
  });
  // Player of the Month settlements feed the same ledger, so Crown money shows up in
  // profit and loss alongside tournaments rather than living in a separate system.
  const res=(S.potm&&S.potm.results)||{};
  Object.keys(res).forEach(ym=>{
    const r=res[ym];
    if(!r||r.trial||r.void||!Array.isArray(r.owed))return;
    r.owed.forEach(o=>{
      if(earnings[o.toId]){
        earnings[o.toId].totalEarned+=o.amount;
        earnings[o.toId].history.push({tournament:'Crown — '+ym,date:ym+'-'+'28',earned:o.amount,buyin:0,pnl:o.amount});
      }
      if(earnings[o.fromId]){
        earnings[o.fromId].totalBuyIn+=o.amount;
        earnings[o.fromId].history.push({tournament:'Crown — '+ym,date:ym+'-'+'28',earned:0,buyin:o.amount,pnl:-o.amount});
      }
    });
    if(r.winnerId&&earnings[r.winnerId])earnings[r.winnerId].wins+=1;
  });
  // Compute overall P&L
  Object.values(earnings).forEach(e=>{e.pnl=e.totalEarned-e.totalBuyIn;});
  return Object.values(earnings).sort((a,b)=>b.pnl-a.pnl);
}

function trophySVG(wn='',tn='',dt=''){

  // gives plain text but names with & or < shouldn't break the markup).
  const safe = String(nm).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

      <source srcset="./trophy.webp" type="image/webp">
      <img class="trophy-image" src="./trophy.png" alt="${altText}" loading="eager" onload="window.fitTrophyEngraving&&fitTrophyEngraving(this)"/>

// Auto-shrink the engraving text if a long name would overflow the brushed nameplate.
// Called when the trophy image finishes loading (so we know layout dimensions are real).
window.fitTrophyEngraving = function(img){
  try{
    const wrap = img.closest('.trophy-image-wrap');
    if(!wrap) return;
    const eng = wrap.querySelector('.trophy-engraving');
    if(!eng) return;
    // The brushed silver nameplate occupies ~41% of the trophy image width, and the
    // engraving sits inside a decorative inner border, so target ~38% for breathing room.
    const maxW = wrap.clientWidth * 0.38;
    // Reset to the CSS default first (in case this is a re-render with a new name).
    eng.style.fontSize = '';
    // Shrink in 0.5px steps until it fits, with a hard floor so it stays readable.
    let size = parseFloat(getComputedStyle(eng).fontSize);
    let guard = 30;
    while(eng.scrollWidth > maxW && size > 7 && guard-- > 0){
      size -= 0.5;
      eng.style.fontSize = size + 'px';
    }
  }catch(e){/* layout race — non-fatal */}
};

function lpHoleSet(name,cfg,tee){
  const ch=S.courseHoles&&S.courseHoles[name]; if(!ch)return null;
  const par=(tee==='Red'&&ch.parRed)?ch.parRed:ch.par;
  if(ch.holes===9){

function lpBoard(r){
  const n=r.holes;
  return r.players.map(p=>{
    let thru=0,gross=0,grossPar=0,netToPar=0,stb=0;
    for(let h=1;h<=n;h++){
      if(!lpHasScore(r.scores,h,p.id))continue;
      const g=r.scores[h][p.id],par=r.parArr[h-1],stk=lpStrokes(p.ch,r.siArr[h-1],n);
      thru++;gross+=g;grossPar+=par;             // par of holes PLAYED, not all 18
      netToPar+=(g-stk-par);                      // net vs par, over holes played
      stb+=Math.max(0,par+stk-g+2);
    }
    // toPar here = GROSS vs par of holes played (never a full-18 par against 3 holes)
    return {...p,thru,gross,grossPar,toPar:gross-grossPar,netToPar,stb};
  }).sort((a,b)=>a.thru===0&&b.thru===0?0:b.thru===0?-1:a.thru===0?1:(a.netToPar-b.netToPar)||(b.stb-a.stb));
}
function lpThru(r){ let t=0; for(let h=1;h<=r.holes;h++){ if(r.players.every(p=>lpHasScore(r.scores,h,p.id)))t++; } return t; }

}

try{const u=localStorage.getItem('gpUnit');if(u==='y'||u==='m')GPUNIT=u;}catch(e){}
const GP_MAXACC=25;      // metres — fixes worse than this are discarded outright
const GP_WINDOW=15000;   // only fixes from the last 15s are trusted
// Combine recent fixes by inverse-variance weighting: a ±3m fix counts far more than a ±12m one.
// Averaging independent fixes shrinks random error roughly as 1/sqrt(n), so standing still
// for a few seconds gives a materially tighter number than any single reading.
function gpFix(){
  const now=Date.now();
  GPBUF=GPBUF.filter(f=>now-f.t<GP_WINDOW&&f.acc<=GP_MAXACC);
  if(!GPBUF.length)return null;
  let wsum=0,la=0,lo=0;
  for(const f of GPBUF){const w=1/(f.acc*f.acc);wsum+=w;la+=f.lat*w;lo+=f.lon*w;}
  const pos={lat:la/wsum,lon:lo/wsum};
  // scatter of the individual fixes around the combined point = real-world stability
  let sq=0;for(const f of GPBUF)sq+=Math.pow(gpDist(pos,f),2);
  const spread=Math.sqrt(sq/GPBUF.length);
  const best=Math.min(...GPBUF.map(f=>f.acc));
  // honest error estimate: never claim better than 2m from a phone
  const sigma=Math.max(2,Math.round(Math.min(best,1/Math.sqrt(wsum))/Math.sqrt(Math.min(GPBUF.length,8))*10)/10);
  return {...pos,acc:Math.round(sigma*10)/10,n:GPBUF.length,spread:Math.round(spread),
          locked:GPBUF.length>=5&&spread<=4&&sigma<=6};
}
const gpUnit=m=>GPUNIT==='y'?Math.round(m/0.9144):m;
const geoKey=n=>n.replace(/[.#$/\[\]]/g,'_');
function gpDist(a,b){ // metres, haversine
  const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
  const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
function gpHole(){ return (GPGEO&&GPGEO[String(LRHOLE)])||null; }
function gpStart(){
  if(!navigator.geolocation){GPERR='This device has no GPS support.';render();return;}
  GPERR=null;
  GPWATCH=navigator.geolocation.watchPosition(
    p=>{
      const acc=Math.round(p.coords.accuracy);
      GPBUF.push({lat:p.coords.latitude,lon:p.coords.longitude,acc,t:Date.now()});
      if(GPBUF.length>14)GPBUF.shift();
      GPPOS=gpFix();
      if(GPCAP)GPCAP.fixes.push({lat:p.coords.latitude,lon:p.coords.longitude,acc});
      GPERR=(!GPPOS&&acc>GP_MAXACC)?`GPS is only accurate to ±${acc}m here — too rough to trust. Waiting for a better signal…`:null;
      if(V==='play'&&LPV==='round')render();
    },
    e=>{GPERR=e.code===1?'Location permission denied — enable it in your browser settings to use GPS.':'Waiting for a GPS signal…';if(V==='play')render();},
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000}
  );
}

function renderGPS(){
  if(!GPON) return `<button class="gp-toggle" onclick="GP_ON()">📍 &nbsp;Show GPS distances</button>`;
  const g=gpHole();
  let h=`<div class="gp-panel">`;
  if(GPERR) h+=`<div class="gp-warn">${GPERR}</div>`;
  else if(!GPPOS) h+=`<div class="gp-warn">Acquiring GPS…</div>`;

  else{
    const dc=gpDist(GPPOS,g.c);
    // With the full green outline we measure front and back from where the player is
    // actually standing, so a dog-leg can never mislabel the near and far edges.
    let df=null,db=null;
    if(g.poly&&g.poly.length){
      let lo=Infinity,hi=-Infinity;
      for(const v of g.poly){const d=gpDist(GPPOS,{lat:v[0],lon:v[1]});if(d<lo)lo=d;if(d>hi)hi=d;}
      df=lo;db=hi;
    }else{
      df=g.f?gpDist(GPPOS,g.f):null; db=g.b?gpDist(GPPOS,g.b):null;
    }
    h+=`<div class="gp-big">${gpUnit(dc)}<small>${GPUNIT==='y'?'yd':'m'}</small></div>`;
    h+=`<div class="gp-cap">to centre &nbsp;±${gpUnit(Math.round(GPPOS.acc))}${GPUNIT==='y'?'yd':'m'}</div>`;
    h+=`<div class="gp-fb"><div class="gp-cell"><div class="v">${df!=null?gpUnit(df):'–'}</div><div class="l">Front</div></div><div class="gp-cell"><div class="v">${db!=null?gpUnit(db):'–'}</div><div class="l">Back</div></div></div>`;
    h+=`<div class="gp-lock ${GPPOS.locked?'on':''}">${GPPOS.locked?`● Locked — ${GPPOS.n} fixes agree within ${GPPOS.spread}m`:`Settling… ${GPPOS.n} fix${GPPOS.n>1?'es':''}, scatter ${GPPOS.spread}m · stand still a moment`}</div>`;
    h+=`<div class="gp-acc">${g.poly?'Edges measured live from the green outline':(g.src==='osm'?'Green from OpenStreetMap':'Green set by your group')} · a rangefinder is still the sharper tool inside 100${GPUNIT==='y'?'yd':'m'}</div>`;

      <button class="gp-cbtn${g&&g.f?' set':''}" onclick="GP_SET('f')">${g&&g.f?'✓ ':''}Set front</button>
      <button class="gp-cbtn${g&&g.c?' set':''}" onclick="GP_SET('c')">${g&&g.c?'✓ ':''}Set centre</button>
      <button class="gp-cbtn${g&&g.b?' set':''}" onclick="GP_SET('b')">${g&&g.b?'✓ ':''}Set back</button>
    </div><div class="gp-note">Standing on the green? Tap to record its edges — saved for your whole group, permanently.</div>`;
  }
  const site=LR&&OSM_SITES[LR.course];
  if(site) h+=`<button class="gp-imp" ${GPBUSY?'disabled':''} onclick="GP_IMPORT()">${GPBUSY?'Importing from OpenStreetMap…':'Auto-map all holes from OpenStreetMap'}</button>`;
  if(GPMSG) h+=`<div class="gp-note">${GPMSG}</div>`;
  // completeness banner — always know whether this course is fully mapped
  if(LR){
    const need=LR.holes, have=Object.keys(GPGEO||{}).filter(k=>k!=='_pool'&&GPGEO[k]&&GPGEO[k].c&&+k>=1&&+k<=need).length;

    h+=`<div class="gp-note" style="${have===need?'color:#7FB069':''}">${have===need?`✓ ${LR.course} fully mapped — ${need}/${need} holes`:`${have}/${need} holes mapped${miss.length&&miss.length<=8?` · missing ${miss.join(', ')}`:''}`}</div>`;
  }
  if(GPQ.length) h+=`<div class="lp-offline">⟳ ${GPQ.length} green measurement${GPQ.length>1?'s':''} saved on this phone, waiting for signal · <b onclick="GP_SYNC()">retry now</b></div>`;
  h+=`<button class="gp-toggle on" onclick="GP_OFF()">Hide GPS &nbsp;·&nbsp; saves battery</button>`;

          h+=`<tr class="tot"><td colspan="2">TOTAL</td>${B.sort((a,b)=>r.players.findIndex(p=>p.id===a.id)-r.players.findIndex(p=>p.id===b.id)).map(p=>`<td>${p.gross}</td>`).join('')}</tr>`;
          h+=`<tr class="tot"><td colspan="2">Net±</td>${B.map(p=>`<td>${(p.toPar>0?'+':'')+p.toPar}</td>`).join('')}</tr>`;
          h+=`<tr class="tot"><td colspan="2">Pts</td>${B.map(p=>`<td>${p.stb}</td>`).join('')}</tr></table></div></div>`;
        }
      }
      h+=shown.map(r=>{
        const B=lpBoard(r);
        return `<div class="lp-rcard${HISTOPEN===r.id?' on':''}" onclick="LP_HOPEN('${r.id}')">
          <div><div class="rc-course">${r.course} · ${r.tee}</div>
          <div class="rc-sub">${B.map(p=>`${p.name.split(' ')[0]} ${p.gross}`).join(' · ')}</div></div>
          <div class="rc-thru"><small>${r.date.split('-').reverse().join('/')}</small></div>
        </div>`;
      }).join('');
    }
  }
  return h+'</div>';
}

function render(){
  const root=document.getElementById('app');
  if(!INIT){root.innerHTML='<div class="ui-loading"><div class="ui-spin"></div>Connecting to The Club…</div>';return;}
  const R=ranked();
  // Profile tab = this phone's own player page
  if(V==='profile'&&!PID&&!TID&&UI_MEP()) PID=UI_ME;
  if(UI_RH&&UI_RH!==PID) UI_RH=null;     // round history belongs to the player it was opened for
  const AP=S.players.find(p=>p.id===PID),AT=S.tournaments.find(t=>t.id===TID);
  const isProfile=V==='profile'&&AP&&AP.id===UI_ME;

  let h=renderTopBar(AP,AT);

  if(AP) h+=isProfile?`<div class="ui-profile">${renderPlayerDetail(AP)}${UI_RH===AP.id?'':renderProfileFoot(AP)}</div>`:renderPlayerDetail(AP);
  else if(AT) h+=renderTournamentDetail(AT);
  else if(V==='home') h+=renderHome(R);
  else if(V==='profile') h+=renderProfilePick();
  else if(V==='settings') h+=renderSettings();
  else if(V==='rankings') h+=renderRanking(R);
  else if(V==='play') h+=renderPlay();
  else if(V==='crown') h+=renderCrown();
  else if(V==='tournaments') h+=renderTournaments();
  else if(V==='upcoming') h+=renderUpcoming();
  else if(V==='purse') h+=renderPurse();
  else if(V==='contests') h+=renderContests();
  else if(V==='winners') h+=renderWinners();
  else h+=renderCourses();

  if(MOD==='score'&&AP) h+=renderScoreModal(AP);
  if(MOD==='course') h+=renderCourseModal();
  if(MOD==='crownset') h+=renderCrownSettings();
  if(MOD==='register') h+=renderRegisterModal();
  if(MOD==='player') h+=renderPlayerModal();
  if(MOD==='hole') h+=renderHoleModal();
  if(MOD==='tournament') h+=renderTournamentModal();
  if(MOD==='upcoming') h+=renderUpcomingModal();
  if(MOD==='contest') h+=renderContestModal();
  if(MOD==='purse-edit') h+=renderPurseEditModal();
  if(MOD==='predict') h+=renderPredictModal();
  if(UI_MENU&&!MOD) h+=renderMenu();

  // Floating bottom bar: Home · Rankings · Crown · Profile + green Play
  h+=renderDock(AP?(isProfile?'profile':V):AT?'':V);

  root.innerHTML=h;
  root.className='ui-v-'+(AP?(isProfile?'profile':'player'):AT?'event':V);

  // Whenever the score modal is open, paint the course picker and let UM() fill in tee,
  // hole configuration and the live differential. (The old check looked for an input that
  // no longer exists, which left the picker blank.)
  if(MOD==='score'){
    setTimeout(()=>{ try{ mcPaint(); UM(); }catch(e){} }, 0);
  }
  if(MOD==='course'){
    setTimeout(()=>{ try{ AN_TYPE(document.getElementById('an')?.value||''); }catch(e){} }, 0);
  }
  if(MOD==='register'){
    setTimeout(()=>{ try{ REG_PAINT(); }catch(e){} }, 0);
  }
  if(MOD==='player'){
    setTimeout(()=>{ try{ PL_TOGGLE(); }catch(e){} }, 0);
  }
}

// ── RANKINGS ──────────────────────────────────────────────────────────────────
function renderRanking(R){
  const sort=UI_RSORT||'hi';
  const rows=R.map(p=>{const st=uiStats(p);return {p,st};});
  const hiOf=x=>x.p.hi;
  let list=[...rows];
  if(sort==='form'){
    list.sort((a,b)=>(a.st.form==null)-(b.st.form==null)||(a.st.form??0)-(b.st.form??0));
  }else if(sort==='rounds'){
    list.sort((a,b)=>b.st.roundsYear-a.st.roundsYear||b.st.valid-a.st.valid);
  }
  const mov=v=>v==null||Math.abs(v)<0.05?'':v<0?`<span class="ui-mv dn">↓${Math.abs(v).toFixed(1)}</span>`:`<span class="ui-mv up">↑${v.toFixed(1)}</span>`;
  let h=`<div class="ui-pagehead"><div class="ui-h1">Rankings</div>
      <button class="ui-btn ui-btn-g ui-btn-sm" onclick="PL_ADD()">${uiSvg('plus')}Add player</button></div>
    <div class="ui-seg" style="margin:4px 0 14px">
      <button class="${sort==='hi'?'on':''}" onclick="UI_SORT('hi')">Handicap</button>
      <button class="${sort==='form'?'on':''}" onclick="UI_SORT('form')">Form</button>
      <button class="${sort==='rounds'?'on':''}" onclick="UI_SORT('rounds')">Rounds</button>
    </div>`;
  if(sort==='form') h+=`<div class="ui-note" style="margin:-4px 4px 12px">Last five rounds against each player’s own index. Minus means playing better than their handicap.</div>`;
  if(sort==='rounds') h+=`<div class="ui-note" style="margin:-4px 4px 12px">Rounds posted in ${new Date().getFullYear()}.</div>`;
  let pos=0;
  h+=`<div class="ui-list">`+list.map((x,k)=>{
    const p=x.p, st=x.st, me=p.id===UI_ME;
    let big, sub;
    if(sort==='form'){
      big=st.form==null?'<span class="ui-na">—</span>':(st.form>0?'+':st.form<0?'−':'')+Math.abs(st.form).toFixed(1);
      sub=st.form==null?'needs 3 rounds':`index ${p.hi!=null?p.hi.toFixed(1):'—'} · last 5`;
    }else if(sort==='rounds'){
      big=String(st.roundsYear);
      sub=`${st.valid} in total`;
    }else{
      big=p.hi!==null?`${p.hi.toFixed(1)}${p.carried?'<i class="ui-star">*</i>':''}`:'<span class="ui-na">—</span>';
      sub=p.carried?'carried from previous club'
        :p.hi!==null?`${st.valid} rounds${mov(st.move)?' · '+mov(st.move):''}`
        :(st.holes?`needs ${Math.max(0,54-st.holes)} holes for an index`:'no rounds yet');
    }
    const showPos=sort==='hi'?(p.hi!==null?++pos:''):(k+1);
    return `<button class="ui-rrow${me?' me':''}" onclick="OP('${p.id}')">
      <span class="ui-rpos">${showPos}</span>
      <span class="ui-av${me?' g':''}">${uiInit(p.name)}</span>
      <span class="ui-row-t">${p.name}<small>${sub}</small></span>
      <span class="ui-rbig${sort==='form'&&st.form!=null&&st.form<0?' red':''}">${big}</span>
    </button>`;
  }).join('')+`</div>`;
  h+=renderRecords(R);
  return h;
}

function renderRoundHistory(p){
  const s=calcHI(p.scores,S.courses);
  let h=`<div class="ui-top">
      <button class="ui-ico" onclick="UI_RH_X()" aria-label="Back">${uiSvg('back')}</button><span></span>
      <button class="ui-btn ui-btn-g ui-btn-sm" onclick="OM('score')">Add round</button></div>
    <div style="margin:4px 4px 16px"><div class="ui-h1">Round history</div>
      <div class="ui-s" style="margin-top:6px">${p.id===UI_ME?'Your':p.name.split(' ')[0]+'’s'} ${s.hi!==null?`best ${s.n} of the last ${s.count} set ${p.id===UI_ME?'your':'the'} index`:'rounds so far — an index needs 54 holes'}</div></div>`;
  if(!p.scores||!p.scores.length)return h+`<div class="empty-state"><div class="empty-title">No rounds recorded</div><div class="empty-sub">Tap Add round to post the first one</div></div>`;
  const issues=s.issues||{};
  // Position in the counting window: 1 = most recent, 20 = the one that falls out next.
  // Numbered by PLAYING order (same rule as before), so it counts down without gaps.
  const winPos={};
  if(s.window&&s.window.length){
    const inWindow=new Set(s.window.map(x=>x.i));
    const played=orderScores(p.scores).map(x=>x.i).filter(i=>inWindow.has(i));
    played.forEach((i,k)=>{ winPos[i]=played.length-k; });
  }
  const maxPos=Math.max(0,...Object.values(winPos));
  const issueIdx=Object.keys(issues).map(Number);
  if(issueIdx.length)h+=`<div class="ui-alert red"><b>${issueIdx.length} round${issueIdx.length>1?'s':''} excluded</b> · ${issueIdx.length>1?'they cannot':'it cannot'} be right as recorded, so ${issueIdx.length>1?'they are':'it is'} left out rather than distorting the index. Tap to fix.
    ${issueIdx.map(i=>{const x=p.scores[i];return `<div class="ui-alert-i"><b>${x.course} · ${x.tee} · ${x.holes||'?'} · ${x.score}</b> — ${issues[i]}</div>`;}).join('')}</div>`;
  if(!scoresAllDated(p.scores)){
    const nd=p.scores.filter(x=>!x.date||isNaN(new Date(x.date).getTime())).length;
    h+=`<div class="ui-alert red"><b>${nd} round${nd>1?'s':''} without a date.</b> Rounds are sequenced in the order they were entered. Add the missing dates and the handicap follows true playing order instead.</div>`;
  }
  if(s.hi!==null) h+=`<div class="ui-legend"><span><i class="g"></i>Counting</span><span><i></i>In the last 20</span><span><i class="r"></i>Excluded</span></div>`;
  h+=`<div class="ui-hist">`;
  [...orderScores(p.scores)].reverse().forEach(entry=>{
    const s2=entry.s, oi=entry.i, c=findCourse(S.courses,s2);
    const d=c?calcDiff(s2.score,c.rating,c.slope):null;
    const cfg=cfgOf(s2,c),is9=isNineCfg(cfg),isO=OPEN_SCORE&&OPEN_SCORE.pid===p.id&&OPEN_SCORE.idx===oi;
    const isCounting=s.countingIdx&&s.countingIdx.has(oi);
    const m=s.meta&&s.meta[oi];
    const bad=!c||issues[oi];
    const cfgL=cfg==='18'?'18':cfg==='F9'?'front 9':cfg==='L9'?'back 9':cfg==='L9x2'?'back 9 ×2':cfg==='F9x2'?'front 9 ×2':cfg;
    const eff=m&&m.eighteenhDiff!=null?m.eighteenhDiff:d;
    h+=`<button class="ui-hrow${isCounting?' cnt':''}${bad?' bad':''}${isO?' open':''}" onclick="TSC('${p.id}',${oi})">
      <span class="ui-hpos">${bad?'!':winPos[oi]||''}</span>
      <span class="ui-row-t">${uiShort(s2.course)} · ${cfgL}<small>${s2.date?uiDay(s2.date):'no date'}${s2.tee?' · '+s2.tee:''}${winPos[oi]&&winPos[oi]===maxPos&&maxPos>=20?' · <em>drops out next</em>':''}${bad&&!issues[oi]?' · not counting':''}</small></span>
      <span class="ui-hsc">${s2.score}</span>
      <span class="ui-hdf">${bad?'–':eff!=null?eff.toFixed(1):'—'}</span>
    </button>`;
    if(isO){
      let breakdown='';
      if(is9&&m&&m.is9){
        if(m.pendingConversion){
          breakdown=`<div class="ui-bd"><b>Initial index period — pending conversion</b>
            <p>Under WHS the expected-score conversion starts once 54 holes are posted. This nine becomes an 18-hole differential when the first index is set.</p>
            <div class="ui-bdr"><span>9-hole differential (stored)</span><span>${m.ninehDiff.toFixed(1)}</span></div></div>`;
        }else{
          breakdown=`<div class="ui-bd"><b>${m.retroactivelyConverted?'First index set — converted retroactively':'WHS 9-hole → 18-hole conversion'}</b>
            <div class="ui-bdr"><span>9-hole differential</span><span>${m.ninehDiff.toFixed(1)}</span></div>
            <div class="ui-bdr"><span>Expected for the missing nine<small>index ${m.hiAtTime.toFixed(1)} × 0.52 + 1.2</small></span><span>${m.expected.toFixed(1)}</span></div>
            <div class="ui-bdr tot"><span>18-hole differential${isCounting?' · counting':''}</span><span>${m.eighteenhDiff.toFixed(1)}</span></div></div>`;
        }
      }
      h+=`<div class="ui-hdet">
        ${bad&&issues[oi]?`<div class="ui-alert red" style="margin:0 0 10px">${issues[oi]}</div>`:''}
        <div class="ui-hgrid">
          <div><span>Course</span><b>${s2.course}</b></div>
          <div><span>Rating / slope</span><b class="ui-mono">${c?c.rating.toFixed(1)+' / '+c.slope:'—'}</b></div>
          <div><span>Holes</span><b>${is9?'9-hole':'18-hole'}</b></div>
          <div><span>Date played</span><b>${s2.date?fmtDate(s2.date):'—'}</b></div>
        </div>
        ${breakdown}
        ${isCounting&&!(is9&&m&&m.is9)?`<div class="ui-cnt">Counting toward the index</div>`:''}
        <div class="ui-hact">
          <button class="ui-btn ui-btn-w ui-btn-sm" onclick="event.stopPropagation();ES('${p.id}',${oi})">${uiSvg('pen')}Edit</button>
          <button class="ui-btn ui-btn-sm ui-btn-red" onclick="event.stopPropagation();DS('${p.id}',${oi})">Delete</button>
        </div>
      </div>`;
    }
  });
  return h+`</div>`;
}
