  /* legacy token names used across the app, mapped to the new palette */
  --forest:#F4F6F3;--deep:#FFFFFF;--mid:#FFFFFF;--raised:#FAFBFA;--sage:#5F6E64;
  --border:#E7ECE8;--border2:#DCE3DE;
  --gold:#0E7A3E;--gold-lt:#0E7A3E;--gold-dim:#0B6534;--gold-faint:rgba(14,122,62,.05);
  --text:#0C1A12;--text2:#5F6E64;--text3:#7A887F;
  --success:#0E7A3E;--danger:#E23B2E;
  --ivory:#FFFFFF;--parchment:#F4F6F3;--panel:#FFFFFF;--card:#FFFFFF;
  --r:14px;--r2:18px;--r3:22px;
  --sh:0 1px 0 rgba(12,26,18,.03),0 14px 30px -22px rgba(12,26,18,.35);
  --sh2:0 18px 40px -24px rgba(12,26,18,.4);
}
body{
  font-family:'Geist','Segoe UI',sans-serif;
  background:var(--forest);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
#app{max-width:820px;margin:0 auto;padding:14px}

/* HEADER */
.hdr{
  background:var(--deep);
  border-radius:var(--r3);
  margin-bottom:16px;
  overflow:hidden;
  position:relative;
  border:0.5px solid var(--border);
}
/* Layered atmospheric background */
.hdr::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% -20%, rgba(14,122,62,.18) 0%, transparent 60%),
    radial-gradient(ellipse at 0% 100%, rgba(14,122,62,.9) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(14,122,62,.9) 0%, transparent 50%),
    repeating-linear-gradient(
      -45deg,
      transparent,transparent 22px,
      rgba(255,255,255,.012) 22px,rgba(255,255,255,.012) 23px
    );
  pointer-events:none;
}
/* Gold top rule */
.hdr::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(14,122,62,.5),rgba(14,122,62,.9),rgba(14,122,62,.5),transparent);
}
.hdr-inner{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 24px 24px;
  text-align:center;
}
/* Crest mark above name */
.hdr-crest{
  width:48px;height:48px;
  border:1.5px solid rgba(14,122,62,.35);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(14,122,62,.07);
  font-size:22px;
  margin-bottom:14px;
  position:relative;
}
.hdr-crest::before{
  content:'';
  position:absolute;inset:-6px;
  border-radius:50%;
  border:0.5px solid rgba(14,122,62,.15);
}
/* Thin gold rules flanking the name */
.hdr-rule{
  display:flex;align-items:center;gap:12px;width:100%;max-width:320px;margin-bottom:6px;
}
.hdr-rule-line{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(14,122,62,.4))}
.hdr-rule-line.r{background:linear-gradient(270deg,transparent,rgba(14,122,62,.4))}
.hdr-rule-dot{width:3px;height:3px;border-radius:50%;background:rgba(14,122,62,.6);flex-shrink:0}
.club-name{
  font-family:'Geist',Georgia,serif;
  font-size:30px;font-weight:700;font-style:normal;
  color:var(--gold);
  letter-spacing:0;line-height:1;
}
@media(min-width:480px){.club-name{font-size:36px}}
.club-sub{
  font-family:'Geist',sans-serif;
  font-size:8.5px;color:rgba(14,122,62,.42);
  letter-spacing:0;text-transform:none;
  margin-top:8px;
}
/* Top-right status */
.hdr-status{
  position:absolute;top:16px;right:16px;
  display:flex;align-items:center;gap:8px;
  z-index:3;
}
.sync{font-size:9px;padding:3px 9px;border-radius:20px;letter-spacing:.3px;font-weight:600;font-family:'Geist',sans-serif}
.sync.ok{background:rgba(14,122,62,.3);color:#0E7A3E;border:0.5px solid rgba(14,122,62,.4)}
.sync.err{background:rgba(226,59,46,.25);color:#E23B2E;border:0.5px solid rgba(226,59,46,.35)}
.sync.wait{background:rgba(14,122,62,.15);color:var(--gold);border:0.5px solid rgba(14,122,62,.25)}
/* Keep these for JS that references them */
.hdr-right{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px}
.club-seal{display:none}

/* ── BOTTOM NAV (mobile-first real app style) ── */
#app{padding-bottom:80px}
.nav-wrap{display:none}/* hide old top nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#FFFFFF;
  display:flex;align-items:stretch;
  border-top:0.5px solid rgba(14,122,62,.2);
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.bnt{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 2px 6px;
  background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:8px;font-weight:700;
  letter-spacing:0;text-transform:none;
  color:rgba(14,122,62,.4);
  gap:4px;transition:all .2s;
  min-height:56px;
}
.bnt.on{color:var(--gold)}
.bnt.on .bnt-icon{filter:drop-shadow(0 0 4px rgba(14,122,62,.4))}
.bnt:hover{color:var(--gold-lt)}
.bnt-icon{font-size:19px;line-height:1}
.bnt-lbl{font-size:8px;letter-spacing:.8px}

/* Desktop: restore top nav, hide bottom */
@media(min-width:640px){
  #app{padding-bottom:20px}
  .bnav{display:none}
  .nav-wrap{display:block;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-wrap::-webkit-scrollbar{display:none}
  .nav{background:var(--ivory);border-radius:var(--r2);display:flex;border:0.5px solid rgba(12,26,18,.09);box-shadow:var(--sh);min-width:max-content;width:100%}
  .nt{flex:1;background:none;border:none;border-bottom:2.5px solid transparent;padding:13px 14px 11px;font-size:9.5px;font-weight:700;letter-spacing:0;text-transform:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .2s;white-space:nowrap}
  .nt.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(14,122,62,.04)}
  .nt:hover:not(.on){color:var(--text2);background:rgba(12,26,18,.03)}
}

/* BACK NAV */
.back-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back-btn{background:none;border:none;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text3);font-family:'Geist',inherit;display:flex;align-items:center;gap:6px;padding:8px 0;transition:color .15s}
.back-btn:hover{color:var(--gold)}
.breadcrumb{font-family:'Geist',serif;font-style:normal;font-size:15px;color:var(--text2)}

/* SECTION HEADERS */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:0.5px solid var(--border)}
.sec-title{font-family:'Geist',Georgia,serif;font-size:24px;font-weight:600;font-style:normal;color:var(--gold-lt);letter-spacing:.2px}
/* Section intro bands — unique per tab */
.sec-band{
  border-radius:var(--r2) var(--r2) 0 0;
  padding:14px 18px;
  margin-bottom:0;
  display:flex;align-items:center;gap:12px;
}
.sec-band.rankings{background:linear-gradient(90deg,rgba(14,122,62,.08),transparent)}
.sec-band.purse{background:linear-gradient(90deg,rgba(14,122,62,.1),transparent)}
.sec-band.winners{background:linear-gradient(90deg,rgba(14,122,62,.12),transparent)}
.sec-band.contests{background:linear-gradient(90deg,rgba(14,122,62,.1),transparent)}
.sec-band.upcoming{background:linear-gradient(90deg,rgba(14,122,62,.08),transparent)}
.sec-band-icon{font-size:20px;opacity:.7}
.sec-band-text{font-family:'Geist',serif;font-size:13px;font-style:normal;color:var(--text3);letter-spacing:.3px}
.divider{height:0.5px;background:linear-gradient(90deg,transparent,rgba(14,122,62,.4),rgba(14,122,62,.6),rgba(14,122,62,.4),transparent);margin:18px 0}

/* RANK ROWS — member card style */
.rank-row{
  display:flex;align-items:center;gap:16px;
  padding:0;
  background:var(--deep);
  border-radius:var(--r2);
  margin-bottom:10px;
  cursor:pointer;
  box-shadow:var(--sh);
  border:0.5px solid var(--border);
  overflow:hidden;
  transition:all .25s;
  position:relative;
}
.rank-row.p1{
  background:linear-gradient(110deg,#FFFFFF,#FFFFFF);
  border-color:var(--border2);
  box-shadow:0 2px 12px rgba(14,122,62,.08),var(--sh);
}
.rank-row:active{transform:scale(.99)}
@media(hover:hover){.rank-row:hover{box-shadow:var(--sh2);transform:translateY(-2px);background:var(--raised)}}
.trn-row:hover{box-shadow:var(--sh2);transform:translateY(-1px);background:var(--raised)}
/* Gold left accent only on top 3 */
.rank-row.p1::before,.rank-row.p2::before,.rank-row.p3::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
}
.rank-row.p1::before{background:linear-gradient(180deg,#0E7A3E,#0E7A3E,#0B6534)}
.rank-row.p2::before{background:linear-gradient(180deg,#F4F6F3,#F4F6F3,#F4F6F3)}
.rank-row.p3::before{background:linear-gradient(180deg,#F4F6F3,#F4F6F3,#F4F6F3)}
/* Medal block */
.rank-medal-wrap{
  width:56px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 0 18px 8px;
  gap:4px;
}
.rank-medal{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;font-weight:700;
}
.medal-1{background:linear-gradient(135deg,#0E7A3E,#0E7A3E);color:var(--deep)}
.medal-2{background:linear-gradient(135deg,#F4F6F3,#F4F6F3);color:#FFFFFF}
.medal-3{background:linear-gradient(135deg,#F4F6F3,#F4F6F3);color:#FFFFFF}
.medal-n{background:var(--parchment);color:var(--text3)}
.rank-pos{font-family:'Geist',sans-serif;font-size:9px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text3);margin-top:2px}
/* Name + meta */
.rank-info{flex:1;min-width:0;padding:16px 4px}
.rank-name{font-family:'Geist',Georgia,serif;font-size:19px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.1}
.rank-sub{font-family:'Geist',sans-serif;font-size:10px;color:var(--text3);letter-spacing:.3px}
/* HCP number — large, right side */
.rank-hi{
  flex-shrink:0;
  text-align:center;
  padding:18px 16px;
  background:rgba(12,26,18,.035);
  border-left:0.5px solid var(--border);
  min-width:72px;
}
.hi-label{
  font-family:'Geist',sans-serif;
  font-size:7px;letter-spacing:0;
  text-transform:none;color:var(--text3);
  margin-bottom:4px;font-weight:700;
}
.hi-val{
  font-family:'Geist',Georgia,serif;
  font-size:34px;font-weight:700;
  color:var(--gold);line-height:1;
}
.hi-na{font-family:'Geist',serif;font-size:26px;color:var(--text3)}
.rank-chev{
  font-size:18px;color:rgba(14,122,62,.35);
  padding-right:12px;flex-shrink:0;
}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.scard{border-radius:var(--r);padding:14px;border:0.5px solid rgba(12,26,18,.08)}
.scard.normal{background:var(--mid)}
.scard.hero{background:linear-gradient(135deg,#FFFFFF,#FFFFFF);border:0.5px solid var(--border2)}
.s-lbl{font-size:9px;text-transform:none;letter-spacing:0;margin-bottom:6px;font-weight:600}
.scard.normal .s-lbl{color:var(--text3);font-family:'Geist',sans-serif}
.scard.hero .s-lbl{color:rgba(14,122,62,.55)}
.s-val{font-family:'Geist',serif;font-weight:600}
.scard.normal .s-val{font-size:22px;color:var(--gold-lt)}
.scard.hero .s-val{font-size:34px;color:var(--gold);line-height:1}
@media(max-width:520px){
  .stats{grid-template-columns:1fr 1fr 1fr}
  .scard.hero{grid-column:span 3;display:flex;align-items:center;gap:16px;padding:16px 18px}
  .scard.hero .s-lbl{margin-bottom:0;flex-shrink:0}
  .scard.hero .s-val{font-size:40px}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr 1fr}
  .scard.hero{grid-column:span 2}
}

/* CONTENT CARD */
.ccard{background:var(--deep);border-radius:var(--r2);border:0.5px solid var(--border);box-shadow:var(--sh);padding:0 18px}

/* SCORE TABLE */
.sthead{display:grid;grid-template-columns:1fr 54px 52px 60px 56px 28px;gap:6px;padding:11px 0 9px;font-size:9px;text-transform:none;letter-spacing:0;color:var(--text3);border-bottom:0.5px solid var(--border)}
.srow{display:grid;grid-template-columns:1fr 54px 52px 60px 56px 28px;gap:6px;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--border);font-size:13px;cursor:pointer;transition:background .15s}
.srow:last-child{border-bottom:none}
.srow:hover{background:rgba(14,122,62,.04);margin:0 -18px;padding:11px 18px}
/* Mobile: hide tee + type columns, keep course/score/diff/delete */
@media(max-width:500px){
  .sthead{grid-template-columns:1fr 48px 52px 28px}
  .srow{grid-template-columns:1fr 48px 52px 28px}
  .sthead span:nth-child(2),.sthead span:nth-child(5),
  .srow>span:nth-child(2),.srow>span:nth-child(5){display:none}
}

/* INFO EXPAND */
.icard{background:rgba(12,26,18,.035);border:0.5px solid rgba(14,122,62,.15);border-radius:var(--r);padding:14px 16px;margin:2px 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ic-full{grid-column:span 3;padding-bottom:10px;border-bottom:0.5px solid rgba(12,26,18,.08);margin-bottom:6px}
.ie-lbl{font-size:9px;text-transform:none;letter-spacing:0;color:var(--sage);margin-bottom:4px;font-weight:700}
.ie-val{font-size:15px;font-weight:500;color:var(--deep);word-break:break-word}
.ie-lbl{color:rgba(14,122,62,.55)}.ie-val{color:var(--gold-lt)}

/* TOURNAMENT ROWS */
.trn-row{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--deep);border-radius:var(--r2);margin-bottom:9px;cursor:pointer;box-shadow:var(--sh);border:0.5px solid var(--border);transition:all .2s}
.trn-row:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.trn-icon{width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.trn-name{font-family:'Geist',Georgia,serif;font-size:18px;font-weight:600;font-style:normal;color:var(--text);margin-bottom:3px}
.trn-meta{font-size:12px;color:var(--text3)}
.trn-win{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:2px}

/* WINNER BOX */
.win-box{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(135deg,rgba(14,122,62,.12),rgba(14,122,62,.04));border:0.5px solid rgba(14,122,62,.3);border-radius:var(--r2);margin-top:14px;box-shadow:0 4px 24px rgba(14,122,62,.08)}
.win-lbl{font-size:9px;text-transform:none;letter-spacing:0;color:var(--gold-dim);font-weight:700;margin-bottom:4px}
.win-name{font-family:'Geist',serif;font-size:21px;font-weight:700;font-style:normal;color:var(--gold-lt)}
@media(prefers-color-scheme:dark){.win-name{color:var(--gold-lt)}}

/* TOURNAMENT SCOREBOARD */
.tscore{display:grid;grid-template-columns:1fr 72px 60px;gap:8px;align-items:center;padding:12px 0;border-bottom:0.5px solid rgba(12,26,18,.07);font-size:14px}
.tscore:last-child{border-bottom:none}
@media(max-width:400px){.tscore{grid-template-columns:1fr 60px 56px;gap:6px}}
.tscore-val{text-align:center;font-family:'Geist',serif;font-size:17px;font-weight:600}
.under{color:var(--success);font-weight:700}
.over{color:var(--danger)}
.even{color:var(--text3)}
.counting-diff{color:var(--gold)!important;font-weight:700}

/* PILLS */
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.4px}
.p9{background:rgba(14,122,62,.15);color:var(--gold-dim)}
.p18{background:rgba(14,122,62,.25);color:#0E7A3E}
.pwon{background:var(--gold);color:var(--deep)}
.prun{background:rgba(255,255,255,.07);color:var(--text3)}
.pupcoming{background:rgba(26,58,106,.12);color:#5F6E64}

/* TROPHY */
.trophy-stage{
  text-align:center;padding:32px 20px 36px;
  background:linear-gradient(180deg,rgba(14,122,62,.08) 0%,rgba(0,0,0,0) 60%);
  border-radius:var(--r2);
  border:0.5px solid var(--border);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.trophy-stage::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 20%,rgba(14,122,62,.1) 0%,transparent 65%);
  pointer-events:none;
}
.trophy-eyebrow{font-size:9px;letter-spacing:0;text-transform:none;color:var(--text3);margin-bottom:20px}
.trophy-champ{font-family:'Geist',Georgia,serif;font-size:32px;font-weight:700;font-style:normal;color:var(--gold);margin-top:18px;letter-spacing:.8px;text-shadow:0 0 30px rgba(14,122,62,.3)}
.trophy-event{font-size:12px;color:var(--text3);letter-spacing:0;margin-top:5px}
/* Image-based trophy with dynamic engraving overlay on the nameplate */
.trophy-image-wrap{
  position:relative;
  width:100%;
  max-width:280px;
  margin:0 auto;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.7));
  container-type:inline-size;
  animation:trophyEnter 700ms cubic-bezier(.2,.7,.2,1) both;
}
@keyframes trophyEnter{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.trophy-image{width:100%;display:block}
.trophy-engraving{
  position:absolute;
  left:50%;
  top:86.9%;
  transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond','Times New Roman',Georgia,serif;
  font-style:italic;
  font-weight:600;
  font-size:5.2cqw;
  color:#1f2b2b;
  letter-spacing:0.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0.5px 0 rgba(255,255,255,.35);
  max-width:38%;
  text-align:center;
}

/* HONOURS TABLE */
.honour-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:0.5px solid var(--border)}
.honour-row:last-child{border-bottom:none}
.honour-pos{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--mid);border:0.5px solid var(--border)}
.honour-name{font-family:'Geist',serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:2px}
.honour-event{font-size:12px;color:var(--text3)}
.honour-score{font-family:'Geist',serif;font-size:16px;font-weight:600}

/* COURSE TABLE */
.crow{display:grid;grid-template-columns:1fr 62px 68px 60px 36px;gap:8px;align-items:center;padding:11px 0;border-bottom:0.5px solid rgba(12,26,18,.06);font-size:13px}
.crow:last-child{border-bottom:none}
@media(max-width:480px){
  .crow{grid-template-columns:1fr 56px 36px}
  .crow span:nth-child(3),.crow span:nth-child(4){display:none}
}
.info-btn{background:none;border:1px solid rgba(12,26,18,.14);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--text3);flex-shrink:0;transition:all .15s}
.info-btn:hover,.info-btn.active{background:var(--deep);color:var(--gold);border-color:var(--deep)}

/* PURSE */
.purse-total{
  background:linear-gradient(135deg,#FFFFFF,#FFFFFF);
  border:0.5px solid rgba(14,122,62,.3);
  border-radius:var(--r2);padding:28px;text-align:center;margin-bottom:16px;
  box-shadow:0 4px 24px rgba(14,122,62,.08);
}
.purse-lbl{font-size:9px;letter-spacing:0;text-transform:none;color:rgba(14,122,62,.5);margin-bottom:6px}
.purse-amt{font-family:'Geist',serif;font-size:48px;font-weight:700;font-style:normal;color:var(--gold);line-height:1}
.purse-row{display:grid;grid-template-columns:auto 1fr 90px 80px;gap:12px;align-items:center;padding:14px 0;border-bottom:0.5px solid rgba(12,26,18,.06);font-size:13px}
.purse-row:last-child{border-bottom:none}
@media(max-width:480px){.purse-row{grid-template-columns:auto 1fr 72px}}
.purse-bar-wrap{height:6px;background:rgba(12,26,18,.08);border-radius:3px;overflow:hidden}
.purse-bar{height:100%;background:linear-gradient(90deg,#0E7A3E,#0E7A3E);border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.purse-name{font-family:'Geist',serif;font-size:17px;font-weight:600;font-style:normal}
.purse-earned{font-family:'Geist',serif;font-size:18px;font-weight:700;color:#0E7A3E;text-align:right}
.purse-wins{font-size:11px;color:var(--text3);text-align:right}

/* CONTESTS */
.contest-tab{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.ctab{background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:20px;padding:8px 18px;font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;cursor:pointer;color:var(--text3);white-space:nowrap;transition:all .2s;flex-shrink:0}
.ctab.on{background:linear-gradient(135deg,#FFFFFF,#FFFFFF);color:var(--gold);border-color:var(--border2)}
.contest-row{display:grid;grid-template-columns:1fr 100px 28px;gap:10px;align-items:center;padding:13px 0;border-bottom:0.5px solid rgba(12,26,18,.06);font-size:13px}
.contest-row:last-child{border-bottom:none}
.contest-course{font-weight:500;font-size:13px}
.contest-winner{font-family:'Geist',serif;font-size:13px;color:var(--gold);text-align:right}
.contest-meta{font-size:11px;color:var(--text3);margin-top:2px}
.stat-leader{font-family:'Geist',serif;font-size:24px;font-weight:700;color:var(--gold)}
.stat-count{font-size:11px;color:var(--text3);margin-top:2px}

/* UPCOMING */
.upcoming-row{display:flex;align-items:flex-start;gap:14px;padding:16px 14px;background:var(--deep);border-radius:var(--r2);margin-bottom:10px;box-shadow:var(--sh);border:0.5px solid var(--border);border-left:3px solid var(--gold)}
.date-block{flex-shrink:0;width:52px;text-align:center;background:var(--deep);border-radius:var(--r);padding:8px 6px}
.date-day{font-family:'Geist',serif;font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.date-mon{font-size:9px;letter-spacing:0;text-transform:none;color:rgba(14,122,62,.6);margin-top:2px}
.date-yr{font-size:9px;color:rgba(14,122,62,.4);margin-top:1px}
.upcoming-name{font-family:'Geist',Georgia,serif;font-size:18px;font-weight:600;font-style:normal;color:var(--text);margin-bottom:4px}
.upcoming-meta{font-size:12px;color:var(--text3);margin-bottom:8px}
.upcoming-players{display:flex;flex-wrap:wrap;gap:5px}
.player-tag{font-size:10px;padding:3px 10px;background:rgba(14,122,62,.2);border-radius:12px;color:#0E7A3E;font-weight:500;border:0.5px solid rgba(14,122,62,.3)}
.countdown{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:12px;background:rgba(14,122,62,.15);color:var(--gold);border:0.5px solid rgba(14,122,62,.25)}

/* INPUTS */
select,input,textarea{font-family:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);background:rgba(12,26,18,.035);color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(14,122,62,.18);background:rgba(12,26,18,.035)}
textarea{resize:vertical;min-height:70px}

/* BUTTONS */
.btn-p{
  background:var(--deep);color:var(--gold);
  border:none;border-radius:var(--r);
  padding:11px 22px;
  font-family:'Geist',inherit;
  font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;
  cursor:pointer;transition:all .2s;
  position:relative;overflow:hidden;
}
.btn-p::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(14,122,62,.06),transparent,rgba(14,122,62,.06));
  pointer-events:none;
}
.btn-p:hover{background:var(--mid)}
.btn-p:active{transform:scale(.98)}
.btn-s{
  background:none;
  border:1px solid rgba(12,26,18,.16);
  border-radius:var(--r);
  padding:11px 20px;
  font-family:'Geist',inherit;
  font-size:11px;font-weight:500;
  cursor:pointer;color:var(--text2);
  transition:all .15s;
}
.btn-s:hover{background:var(--parchment);border-color:rgba(12,26,18,.28)}
.btn-ic{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 5px;border-radius:4px}
.btn-ic:hover{color:#c00;background:rgba(220,0,0,.1)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(12,26,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:100;overflow-y:auto}
.mo{background:#FFFFFF;border-radius:var(--r3) var(--r3) 0 0;border:0.5px solid var(--border2);border-bottom:none;padding:28px 24px 40px;width:100%;max-width:480px;box-shadow:0 -12px 60px rgba(0,0,0,.7);max-height:92vh;overflow-y:auto}
@media(min-width:540px){
  .ov{align-items:flex-start;padding:32px 14px}
  .mo{border-radius:var(--r3);border-bottom:0.5px solid var(--border2);max-height:none}
}
.mo-title{font-family:'Geist',Georgia,serif;font-size:24px;font-weight:700;font-style:normal;color:var(--gold-lt);margin-bottom:22px;letter-spacing:.2px}
/* mo-title always gold-lt on dark bg */
.fr{margin-bottom:16px}
.fl{display:block;font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--text3);margin-bottom:6px}
.tp-row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:0.5px solid rgba(12,26,18,.07);font-size:13px}
.tp-row:last-child{border-bottom:none}

/* EMPTY + WARN */
.pending-warn{padding:12px 16px;background:rgba(226,59,46,.12);border:0.5px solid rgba(226,59,46,.3);border-radius:var(--r);font-size:13px;color:#E23B2E;margin-bottom:16px;font-weight:500}
.empty-state{
  text-align:center;padding:56px 28px;
  background:var(--deep);border-radius:var(--r2);
  border:0.5px solid var(--border);
  box-shadow:var(--sh);
}
.empty-icon{font-size:44px;margin-bottom:18px;opacity:.45;display:block}
.empty-title{
  font-family:'Geist',Georgia,serif;
  font-style:normal;
  font-size:20px;color:var(--text2);margin-bottom:8px;
}
.empty-sub{
  font-family:'Geist',sans-serif;
  font-size:12px;color:var(--text3);
  letter-spacing:.3px;line-height:1.6;
}
/* Decorative gold divider in empty state */
.empty-state::before{
  content:'— ⛳ —';
  display:block;
  font-size:12px;
  letter-spacing:0;
  color:rgba(14,122,62,.3);
  margin-bottom:20px;
}

/* ── HEADER EXPORT BUTTON ──────────────────────────────────────────────── */
.hdr-iconbtn{
  background:rgba(14,122,62,.07);
  border:0.5px solid rgba(14,122,62,.22);
  color:var(--gold);
  font-family:inherit;
  font-size:11px;font-weight:600;
  letter-spacing:.4px;
  padding:3px 9px 3px 7px;
  border-radius:20px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:all .15s ease;
  line-height:1;
}
.hdr-iconbtn:hover{
  background:rgba(14,122,62,.15);
  border-color:rgba(14,122,62,.42);
  color:var(--gold-lt);
}
.hdr-iconbtn svg{width:11px;height:11px;display:block}

/* ── PASSPHRASE GATE ───────────────────────────────────────────────────── */
.gate{
  position:fixed;inset:0;z-index:9999;
  background:var(--forest);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:gateFade .4s ease both;
}
.gate::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 10%, rgba(14,122,62,.10) 0%, transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(14,122,62,.55) 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(14,122,62,.55) 0%, transparent 55%);
}
.gate-card{
  position:relative;
  width:100%;max-width:380px;
  background:var(--deep);
  border:0.5px solid var(--border2);
  border-radius:var(--r3);
  padding:36px 28px 28px;
  text-align:center;
  box-shadow:var(--sh2);
  animation:gateRise .5s cubic-bezier(.2,.8,.25,1) .1s both;
}
.gate-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r3) var(--r3) 0 0;
  background:linear-gradient(90deg,transparent,rgba(14,122,62,.5),rgba(14,122,62,.9),rgba(14,122,62,.5),transparent);
}
.gate-crest{
  width:54px;height:54px;
  border:1.5px solid rgba(14,122,62,.4);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(14,122,62,.08);
  font-size:24px;
  margin:0 auto 18px;
  position:relative;
}
.gate-crest::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:0.5px solid rgba(14,122,62,.18);
}
.gate-rule{display:flex;align-items:center;gap:12px;width:100%;max-width:240px;margin:0 auto 8px}
.gate-rule-line{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(14,122,62,.4))}
.gate-rule-line.r{background:linear-gradient(270deg,transparent,rgba(14,122,62,.4))}
.gate-rule-dot{width:3px;height:3px;border-radius:50%;background:rgba(14,122,62,.6)}
.gate-name{
  font-family:'Geist',Georgia,serif;
  font-size:30px;font-weight:700;font-style:normal;
  color:var(--gold);letter-spacing:0;line-height:1;
}
.gate-sub{
  font-family:'Geist',sans-serif;
  font-size:9px;color:rgba(14,122,62,.5);
  letter-spacing:0;text-transform:none;
  margin-top:10px;margin-bottom:26px;
}
.gate-lbl{
  font-family:'Geist',sans-serif;
  font-size:9.5px;font-weight:600;
  color:var(--text3);letter-spacing:0;text-transform:none;
  text-align:left;margin-bottom:8px;
}
.gate-input{
  width:100%;
  background:var(--mid);
  border:0.5px solid var(--border2);
  border-radius:var(--r);
  padding:13px 14px;
  font-family:'Geist',sans-serif;
  font-size:15px;
  color:var(--text);
  letter-spacing:.5px;
  outline:none;
  transition:border-color .15s, background .15s;
}
.gate-input:focus{border-color:var(--gold);background:var(--raised)}
.gate-input::placeholder{color:var(--text3);letter-spacing:.3px}
.gate-err{
  display:none;
  margin-top:10px;
  font-family:'Geist',sans-serif;font-size:11px;
  color:#E23B2E;letter-spacing:.3px;
  text-align:left;
}
.gate-btn{
  width:100%;margin-top:16px;
  background:linear-gradient(180deg,var(--gold),var(--gold-dim));
  border:none;
  color:var(--forest);
  font-family:'Geist',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:0;text-transform:none;
  padding:14px;
  border-radius:var(--r);
  cursor:pointer;
  transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;
}
.gate-btn:hover{filter:brightness(1.08);box-shadow:0 4px 18px rgba(14,122,62,.25)}
.gate-btn:active{transform:translateY(1px)}
.gate-foot{
  margin-top:22px;
  font-family:'Geist',serif;font-style:normal;
  font-size:11px;color:var(--text3);
  letter-spacing:.4px;
}
@keyframes gateFade{from{opacity:0}to{opacity:1}}
@keyframes gateRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── LIFETIME STATS GRID (per-player detail) ──────────────────────────── */
.lifestats{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(min-width:480px){.lifestats{grid-template-columns:repeat(4,1fr)}}
.ls-card{
  background:var(--deep);
  border:0.5px solid var(--border);
  border-radius:var(--r2);
  padding:14px 14px 12px;
  position:relative;
  overflow:hidden;
}
.ls-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(14,122,62,.35),transparent);
}
.ls-icon{
  font-size:14px;
  color:var(--gold-dim);
  margin-bottom:4px;
  letter-spacing:0;
}
.ls-lbl{
  font-size:9px;font-weight:700;
  color:var(--text3);
  text-transform:none;letter-spacing:0;
  margin-bottom:6px;
}
.ls-val{
  font-family:'Geist',Georgia,serif;
  font-size:24px;font-weight:600;
  color:var(--gold-lt);
  line-height:1;
  margin-bottom:4px;
}
.ls-sub{
  font-size:10px;color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'Geist',sans-serif;
}
.ls-empty .ls-val{color:var(--text3);font-size:18px}

/* Section subhead (smaller than .sec-title, used as a label between blocks) */
.subsec{
  font-family:'Geist',serif;font-style:normal;
  font-size:16px;color:var(--text2);
  letter-spacing:.3px;
  margin:20px 0 10px;
}

/* ── HANDICAP TREND CHART ─────────────────────────────────────────────── */
.trend-card{
  background:var(--deep);
  border:0.5px solid var(--border);
  border-radius:var(--r2);
  padding:14px 14px 8px;
  margin-top:14px;
  position:relative;
  overflow:hidden;
}
.trend-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(14,122,62,.35),transparent);
}
.trend-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:8px;
}
.trend-title{
  font-family:'Geist',serif;font-style:normal;
  font-size:16px;color:var(--gold-lt);
  letter-spacing:.3px;
}
.trend-sub{
  font-size:10px;color:var(--text3);
  letter-spacing:.5px;font-family:'Geist',sans-serif;
}

/* ── INLINE EDIT BUTTON (inside the expanded score card) ──────────────── */
.icard-actions{
  grid-column:span 3;
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:6px;padding-top:10px;
  border-top:0.5px solid rgba(14,122,62,.1);
}
.btn-edit{
  background:rgba(14,122,62,.08);
  border:0.5px solid rgba(14,122,62,.28);
  color:var(--gold);
  font-family:'Geist',inherit;
  font-size:10px;font-weight:700;
  letter-spacing:0;text-transform:none;
  padding:7px 14px;
  border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s ease;
}
.btn-edit:hover{
  background:rgba(14,122,62,.18);
  border-color:rgba(14,122,62,.5);
  color:var(--gold-lt);
}
.btn-edit svg{width:11px;height:11px}
.btn-edit.danger{
  background:rgba(226,59,46,.1);
  border-color:rgba(226,59,46,.3);
  color:#E23B2E;
}
.btn-edit.danger:hover{
  background:rgba(226,59,46,.2);
  border-color:rgba(226,59,46,.5);
  color:#E23B2E;
}

/* ═══ PLAY (live scoring) ═══ */
.lp-wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.lp-msg{text-align:center;border:0.5px solid rgba(14,122,62,.4);border-radius:14px;background:rgba(14,122,62,.08);padding:13px;margin-bottom:14px;font-family:'Geist',serif;font-style:normal;font-size:16px;color:#0E7A3E}
.lp-sec{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin:18px 4px 9px;display:flex;align-items:center;gap:10px}
.lp-sec::after{content:"";flex:1;height:0.5px;background:var(--line)}
.lp-chips{display:flex;flex-wrap:wrap;gap:7px}
.lp-chip{border:0.5px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer}
.lp-chip.on{background:rgba(14,122,62,.16);border-color:var(--gold);color:var(--gold-lt,#0E7A3E)}
.lp-prow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0.5px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 13px;margin-bottom:7px;cursor:pointer}
.lp-prow.on{border-color:var(--gold);background:rgba(14,122,62,.09)}
.lp-prow .nm{font-weight:600;font-size:14px;color:var(--text)}
.lp-prow .hi{font-size:11px;color:var(--text3);margin-top:1px}
.lp-prow .ch{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:19px;color:var(--gold)}
.lp-prow .ch small{font-size:9px;color:var(--text3);font-weight:500;letter-spacing:0;display:block;text-align:right}
.lp-prow.dis{opacity:.4;cursor:default}
.lp-start{width:100%;border:none;border-radius:13px;padding:15px;font-family:'Geist',sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px;background:linear-gradient(135deg,var(--gold),#0B6534);color:#FFFFFF;margin-top:16px;cursor:pointer}
.lp-start:disabled{opacity:.4}
.lp-strip{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.lp-strip::-webkit-scrollbar{display:none}
.lp-pip{flex:0 0 auto;width:26px;height:30px;border-radius:7px;border:0.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',sans-serif;font-weight:600;font-size:13px;color:var(--text3);cursor:pointer}
.lp-pip.done{color:var(--text);background:rgba(14,122,62,.14);border-color:rgba(14,122,62,.3)}
.lp-pip.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);color:var(--gold-lt,#0E7A3E)}
.lp-hole{background:linear-gradient(170deg,#FFFFFF,#FFFFFF);border:0.5px solid var(--line);border-radius:20px;padding:16px 15px 17px;box-shadow:0 16px 44px -32px #000}
.lp-hh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.lp-hh .big{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:46px;line-height:.85;color:var(--gold)}
.lp-hh .lbl{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600}
.lp-hh .meta{text-align:right;font-size:12px;color:var(--text2);line-height:1.5}
.lp-hh .meta b{color:var(--gold-lt,#0E7A3E)}
.lp-pl{margin-top:12px;border:0.5px solid var(--line);border-radius:12px;background:rgba(12,26,18,.035);padding:10px 11px}
.lp-pl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.lp-pl .pnm{font-weight:600;font-size:13.5px;color:var(--text)}
.lp-pl .pstk{font-size:10px;color:var(--text3)}
.lp-pl .pnet{font-size:11px;color:var(--text2)}
.lp-pl .pnet b{color:var(--gold-lt,#0E7A3E);font-family:'Geist Mono',sans-serif;font-size:14px}
.lp-schips{display:flex;gap:5px}
.lp-sc{flex:1;max-width:44px;aspect-ratio:1/1.02;border-radius:10px;border:0.5px solid var(--line);background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:17px;color:var(--text2);cursor:pointer}
.lp-sc:active{transform:scale(.92)}
.lp-sc.sel{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
.lp-sc.sel.b1{border-radius:50%}
.lp-sc.sel.b2{border-radius:50%;box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px var(--gold)}
.lp-sc.sel.o1{border-radius:4px}
.lp-sc.sel.o2{border-radius:4px;box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #E23B2E}
.lp-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:12px}
.lp-nbtn{border:0.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text2);font-family:'Geist',sans-serif;font-weight:600;font-size:14px;padding:13px;cursor:pointer}
.lp-nbtn.next{background:linear-gradient(135deg,var(--gold),#0B6534);color:#FFFFFF;border:none;font-weight:700}
.lp-nbtn:disabled{opacity:.35}
.lp-lb{border:0.5px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px}
.lp-lb .row{display:grid;grid-template-columns:26px 1fr 46px 52px 44px 40px;align-items:center;padding:9px 11px;border-bottom:0.5px solid rgba(14,122,62,.08);background:var(--card,rgba(255,255,255,.03));font-size:13px}
.lp-lb .row:last-child{border-bottom:none}
.lp-lb .row.hd{font-size:9px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;background:rgba(12,26,18,.035)}
.lp-lb .pos{font-family:'Geist',serif;font-style:normal;font-weight:700;color:var(--gold)}
.lp-lb .nm2{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-lb .num{font-family:'Geist Mono',sans-serif;font-weight:700;text-align:right;color:var(--text)}
.lp-lb .num.u{color:#E23B2E}.lp-lb .num.d{color:#0E7A3E}
.lp-lb .num small{font-size:9px;color:var(--text3);font-weight:500}
.lp-fin{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.lp-fbtn{border-radius:12px;padding:13px;font-family:'Geist',sans-serif;font-weight:600;font-size:13px;cursor:pointer}
.lp-fbtn.post{border:none;background:linear-gradient(135deg,#0E7A3E,#0B6534);color:#FFFFFF}
.lp-fbtn.post:disabled{opacity:.4}
.lp-fbtn.disc{background:transparent;color:#E23B2E;border:0.5px solid rgba(226,59,46,.3)}

/* simplified pickers + course editing */
.pk{display:flex;flex-wrap:wrap;gap:7px}
.pk-chip{display:flex;align-items:center;gap:7px;border:1px solid rgba(12,26,18,.18);border-radius:22px;background:#fff;
  padding:8px 14px 8px 10px;font-family:'Geist',sans-serif;font-weight:600;font-size:13.5px;color:#0C1A12;cursor:pointer}
.pk-chip:active{transform:scale(.97)}
.pk-chip.on{border-color:var(--gold,#0E7A3E);box-shadow:0 0 0 1.5px var(--gold,#0E7A3E);background:#FFFFFF}
.pk-sw{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.22);flex-shrink:0}
.pk-chip .pk-sub{font-weight:500;font-size:11px;color:#5F6E64}
.pk-hint{font-size:11.5px;color:#5F6E64;margin-top:7px;line-height:1.5}
.cbtns{display:flex;gap:5px;justify-content:center}
.mini-btn{border:1px solid rgba(12,26,18,.18);background:#fff;border-radius:8px;width:27px;height:27px;font-size:12px;cursor:pointer;color:#0C1A12}
.mini-btn.del{color:#E23B2E;border-color:rgba(226,59,46,.3)}
.wpos{display:inline-block;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:9.5px;
  color:var(--gold);opacity:.85;margin-right:6px;min-width:12px;text-align:right;vertical-align:1px;letter-spacing:.2px}
.mc-lbl{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin:9px 0 6px}
.mc-list{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:0.5px solid rgba(12,26,18,.12);border-radius:var(--r);background:#fff}
.mc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:0.5px solid rgba(12,26,18,.07);padding:12px 13px;cursor:pointer;font-family:'Geist',sans-serif}
.mc-item:last-child{border-bottom:none}
.mc-item:active{background:rgba(14,122,62,.1)}
.mc-nm{font-weight:600;font-size:14px;color:#0C1A12;line-height:1.25}
.mc-meta{font-size:10.5px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.mc-none{font-size:12.5px;color:#E23B2E;padding:12px 4px;line-height:1.55}
.mc-chosen{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid rgba(14,122,62,.5);background:rgba(14,122,62,.08);border-radius:var(--r);padding:11px 13px}
.mc-change{background:none;border:0.5px solid rgba(12,26,18,.2);border-radius:8px;padding:7px 12px;
  font-family:'Geist',sans-serif;font-weight:600;font-size:12px;color:var(--text2);cursor:pointer;flex-shrink:0}
/* course tab grouped by club */
.cg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:0.5px solid rgba(12,26,18,.07);padding:13px 4px;cursor:pointer;font-family:'Geist',sans-serif}
.cg-row:last-child{border-bottom:none}
.cg-nm{font-weight:600;font-size:14.5px;color:#0C1A12}
.cg-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.cg-caret{color:var(--gold);font-size:12px;flex-shrink:0}
.cg-detail{background:rgba(12,26,18,.04);border:0.5px solid rgba(12,26,18,.1);border-radius:var(--r);padding:4px 0;margin:2px 0 8px}
.cg-tee{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 12px;font-size:12.5px;border-bottom:0.5px solid rgba(12,26,18,.06)}
.cg-tee:last-child{border-bottom:none}
.cg-tee .t1{display:flex;align-items:center;gap:7px;font-weight:600;color:#0C1A12}
.cg-tee .t2{font-family:'Geist Mono',sans-serif;font-weight:700;color:var(--text2);white-space:nowrap}
/* ═══ CROWN — player of the month ═══ */
.cr-hero{text-align:center;border-radius:18px;padding:20px 16px 16px;margin-bottom:14px;
  background:linear-gradient(165deg,#FFFFFF,#FFFFFF);box-shadow:0 14px 34px -24px #000}
.cr-hero-k{font-size:32px;line-height:1}
.cr-hero-n{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:26px;color:#0E7A3E;margin-top:2px}
.cr-hero-s{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:44px;color:#fff;line-height:1;margin-top:2px}
.cr-hero-s span{font-size:15px;color:var(--ink2)}
.cr-hero-sp{font-size:12px;color:var(--ink2);margin-top:8px}
.cr-hero-m{font-size:11px;color:#0E7A3E;margin-top:9px;letter-spacing:.3px}
.cr-paid{font-size:11.5px;color:var(--text2);text-align:center;margin-bottom:12px}
.cr-board{border:0.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:8px}
.cr-b-row{display:grid;grid-template-columns:26px 1fr 30px 52px;gap:8px;align-items:center;
  padding:12px 12px;border-bottom:0.5px solid rgba(12,26,18,.06);cursor:pointer}
.cr-b-row:last-child{border-bottom:none}
.cr-b-row.lead{background:rgba(14,122,62,.09)}
.cr-b-pos{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:16px;color:var(--gold)}
.cr-b-nm{font-weight:600;font-size:13.5px;color:#0C1A12;min-width:0}
.cr-b-bar{display:flex;height:4px;border-radius:3px;overflow:hidden;margin-top:5px;background:rgba(12,26,18,.06)}
.cr-b-bar span{display:block;height:100%}
.cr-b-rd{font-family:'Geist Mono',sans-serif;font-weight:600;font-size:12px;color:var(--text3);text-align:right}
.cr-b-tot{font-family:'Geist Mono',sans-serif;font-weight:700;font-size:19px;color:#0C1A12;text-align:right}
.cr-key{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:9.5px;color:var(--text3);margin-bottom:10px}
.cr-key span{display:flex;align-items:center;gap:4px}
.cr-key i{width:8px;height:8px;border-radius:2px;display:block}
.cr-waiting{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.cr-waiting span{font-size:11px;color:var(--text3);background:rgba(12,26,18,.04);border-radius:20px;padding:5px 11px}
.cr-det{background:rgba(12,26,18,.04);padding:8px 12px 10px;border-bottom:0.5px solid rgba(12,26,18,.06)}
.cr-d-row{display:grid;grid-template-columns:1fr 62px 44px 42px;gap:6px;align-items:center;padding:5px 0;font-size:12px}
.cr-d-n{color:#0C1A12;font-weight:600}
.cr-d-v,.cr-d-r{font-family:'Geist Mono',sans-serif;color:var(--text2);text-align:right}
.cr-d-p{font-family:'Geist Mono',sans-serif;font-weight:700;color:var(--gold);text-align:right}
.cr-goal{font-size:11.5px;color:#0E7A3E;background:rgba(14,122,62,.1);border-radius:8px;padding:7px 10px;margin-top:7px}
.cs{border:0.5px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.cs-h{display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;width:100%;
  background:none;border:none;padding:13px 14px;cursor:pointer;font-family:'Geist',sans-serif;text-align:left}
.cs-t{font-size:13.5px;font-weight:600;color:#0C1A12}
.cs-s{font-size:11px;color:var(--text3)}
.cs-c{font-size:10px;color:var(--gold)}
.cs-b{padding:2px 14px 14px;border-top:0.5px solid rgba(12,26,18,.06)}
.cs-note{font-size:11.5px;color:var(--text3);line-height:1.55;padding:6px 0}
.cs-sub{font-size:10px;letter-spacing:0;text-transform:none;color:var(--text3);font-weight:600;margin:12px 0 2px}
.cr-h2hwrap{overflow-x:auto;margin-top:8px}
.cr-mg{display:block;font-family:'Geist',sans-serif;font-size:8.5px;font-weight:600;opacity:.6;margin-top:1px}
.cr-tb{font-size:11px;color:var(--gold);vertical-align:super}
.cr-tbnote{font-size:10.5px;color:var(--text3);text-align:center;margin:-2px 0 8px}
.lp-lb6{grid-template-columns:24px 1fr 38px 38px 44px 46px 36px !important}
.lp-turn{flex:0 0 auto;display:flex;align-items:center;font-size:8px;letter-spacing:0;text-transform:none;
  color:var(--gold);opacity:.6;padding:0 5px;white-space:nowrap}
.lp-turnline{display:grid;gap:5px;margin-top:12px;padding-top:11px;border-top:0.5px solid rgba(14,122,62,.18)}
.lp-tl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2)}
.lp-tl-n{font-weight:600}
.lp-tl b{font-family:'Geist Mono',sans-serif;font-size:14px;color:#fff}
.lp-tl i{font-family:'Geist Mono',sans-serif;font-style:normal;font-weight:700;font-size:16px;color:var(--gold);margin-left:5px}
.lp-tl-h{font-size:8.5px;letter-spacing:0;text-transform:none;color:var(--ink2);text-align:right;margin-top:2px}
.lp-tbl tr.split td{background:rgba(14,122,62,.13);font-family:'Geist Mono',sans-serif;font-weight:700;
  font-size:12px;color:#0B6534;letter-spacing:.5px}
.cr-fair{border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:13px 14px}
.cr-fair-t{font-family:'Geist',serif;font-style:normal;font-weight:700;font-size:16px;color:#0C1A12;margin-bottom:8px}
.cr-fair-b{font-size:12px;color:var(--text2);line-height:1.6;padding:4px 0}
.cr-fair-b b{color:#0C1A12}
.cr-fair-w{font-size:11.5px;color:#0B6534;background:rgba(226,59,46,.09);border:0.5px solid rgba(226,59,46,.3);
  border-radius:9px;padding:9px 11px;margin-top:9px;line-height:1.55}
.cr-warn-dot{color:#E23B2E;font-size:9px}
.hi-carried{font-size:12px;color:var(--gold);vertical-align:super;margin-left:1px}
.cr-pcc{border:0.5px solid rgba(14,122,62,.3);background:rgba(14,122,62,.06);border-radius:9px;padding:10px 11px;margin-top:10px}
.cr-pccrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:11.5px;color:var(--text2);padding:4px 0}
.cr-strip{display:flex;align-items:center;gap:10px;border:0.5px solid rgba(14,122,62,.4);
  background:linear-gradient(100deg,rgba(14,122,62,.12),rgba(14,122,62,.03));border-radius:var(--r);
  padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:#0C1A12;cursor:pointer;line-height:1.45}
.cr-strip-k{font-size:18px;flex-shrink:0}
.cr-strip-go{margin-left:auto;color:var(--gold);font-size:18px;flex-shrink:0}
.cr-target{font-size:11.5px;color:#0E7A3E;background:rgba(14,122,62,.09);border:0.5px solid rgba(14,122,62,.28);
  border-radius:9px;padding:9px 11px;margin-top:8px;line-height:1.55}
.cr-h2h{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);border-bottom:0.5px solid rgba(12,26,18,.06)}
.cr-h2h:last-child{border-bottom:none}
.cr-h2h-c{padding:9px 4px;text-align:center;font-family:'Geist Mono',sans-serif;font-weight:700;font-size:12px;color:var(--text2)}
.cr-h2h-hd{font-family:'Geist',sans-serif;font-size:9px;letter-spacing:.6px;text-transform:none;color:var(--text3);background:rgba(12,26,18,.04)}
.cr-h2h-nm{text-align:left;font-family:'Geist',sans-serif;font-size:12px;color:#0C1A12;font-weight:600}
.cr-h2h-c.win{color:#0E7A3E}.cr-h2h-c.loss{color:#E23B2E}.cr-h2h-c.draw{color:var(--text2)}
.cr-h2h-self{color:rgba(12,26,18,.2)}
.bdg-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bdg{display:flex;align-items:center;gap:9px;border:0.5px solid rgba(14,122,62,.28);background:rgba(14,122,62,.06);
  border-radius:11px;padding:10px 11px}
.bdg-i{font-size:19px;flex-shrink:0}
.bdg-t{display:flex;flex-direction:column;min-width:0}
.bdg-t b{font-size:12.5px;color:#0C1A12;line-height:1.2}
.bdg-n{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.3}
.cr-rstate{font-size:9.5px;letter-spacing:.6px;text-transform:none;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.cr-rstate.awaiting{background:rgba(226,59,46,.16);color:#0B6534}
.cr-rstate.posted{background:rgba(14,122,62,.18);color:#0E7A3E}
.cr-rstate.outstanding{background:rgba(226,59,46,.16);color:#E23B2E}
.cr-rstate.cancelled{background:rgba(12,26,18,.07);color:var(--text3)}
.cr-check{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:13.5px;color:#0C1A12;border-bottom:0.5px solid rgba(12,26,18,.06)}
.cr-check:last-of-type{border-bottom:none}
.cr-check input{width:18px;height:18px}
.cr-entrybox{border:0.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.cr-erow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:0.5px solid rgba(12,26,18,.06)}
.cr-erow:last-child{border-bottom:none}
.cr-enm{font-size:13.5px;font-weight:600;color:#0C1A12}
.cr-etog{border:1px solid rgba(12,26,18,.18);background:#fff;border-radius:20px;padding:6px 14px;
  font-family:'Geist',sans-serif;font-weight:700;font-size:11.5px;color:var(--text3);cursor:pointer;min-width:74px}
